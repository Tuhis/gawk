<?xml version="1.0" encoding="UTF-8"?>
<!--
  The gawk application icon (R44, docs/53): the web app's lightning bolt on a
  rounded purple tile. This file is the single source of truth. png/, gawk.ico
  and gawk.res are generated from it by `go run ./tools/icon generate` and
  drift-checked in CI by `go run ./tools/icon check`. Edit this, regenerate,
  commit all of it.

  The bolt path is the first <path> of gawk-app/public/favicon.svg, verbatim
  (48x46 units), translated and scaled to sit centred on the 256-unit tile.
  The favicon's glow layers are deliberately not carried over: blurred
  ellipses and display-p3 fills do not survive icon rasterisers, and the tile
  is what keeps the mark legible at 16 px on a dark taskbar.

  tools/icon parses exactly the SVG subset used here: <rect> with rx, <g> with
  translate/scale transforms, and <path> with M L H V C A Z (both cases).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#863bff"/>
  <g transform="translate(51.2 54.4) scale(3.2)">
    <path fill="#ffffff" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"/>
  </g>
</svg>
