# The WHIP endpoint behind the HTTPRoute or Ingress (TLS there). ClusterIP:
# the public way in is the route, which must hash on the bearer key
# (httproute.yaml, ingress.yaml).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gawk-whip-gateway.fullname" . }}
  labels:
    {{- include "gawk-whip-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: whip
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "gawk-whip-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
---
# The StatefulSet's governing Service, headless: one DNS record per pod, so
# pod N is <fullname>-N.<this Service> for D10's peer lookup, and a
# ServiceMonitor scrapes every pod. The internal and ops ports are never
# routed publicly (docs/83 §6, D10).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gawk-whip-gateway.peersName" . }}
  labels:
    {{- include "gawk-whip-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: peers
spec:
  clusterIP: None
  selector:
    {{- include "gawk-whip-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: internal
      port: 8081
      targetPort: internal
      protocol: TCP
    - name: ops
      port: 9090
      targetPort: ops
      protocol: TCP
