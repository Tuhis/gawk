{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $proxy := $np.httpProxy }}
{{- if not (or $proxy.podSelector $proxy.namespaceSelector $proxy.cidrs) }}
{{- $proxy = $np.ingressController }}
{{- end }}
{{- if not (or $proxy.podSelector $proxy.namespaceSelector $proxy.cidrs) }}
{{- fail "networkPolicy: httpProxy (or ingressController) must name a podSelector, namespaceSelector or cidrs; a from with no peers would admit every source to the WHIP port" }}
{{- end }}
{{- $base := int .Values.media.basePort }}
{{- $last := add $base (int .Values.replicas) -1 }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gawk-whip-gateway.fullname" . }}
  labels:
    {{- include "gawk-whip-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gawk-whip-gateway.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # WHIP over HTTP: from the HTTP proxy only (Gateway or Ingress).
    # A peer is rendered only when a selector names something: a bare
    # podSelector {} with no namespaceSelector would admit the whole
    # namespace. With a namespaceSelector, podSelector {} means every pod
    # in the namespaces it selects.
    - from:
        {{- if or $proxy.podSelector $proxy.namespaceSelector }}
        - podSelector:
            {{- with $proxy.podSelector }}
            matchLabels:
              {{- toYaml . | nindent 14 }}
            {{- else }}
            {}
            {{- end }}
          {{- with $proxy.namespaceSelector }}
          namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
        {{- end }}
        {{- range $proxy.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    # Media from anywhere: ICE over UDP and ICE-TCP, the whole port range
    # (each pod listens on its own one).
    - ports:
        - protocol: UDP
          port: {{ $base }}
          {{- if gt $last $base }}
          endPort: {{ $last }}
          {{- end }}
        - protocol: TCP
          port: {{ $base }}
          {{- if gt $last $base }}
          endPort: {{ $last }}
          {{- end }}
    # D10's peer lookup: the other gateway pods only.
    - from:
        - podSelector:
            matchLabels:
              {{- include "gawk-whip-gateway.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8081
    # Probes come from the kubelet (not subject to the policy); scrapes from
    # the monitoring namespace.
    - from:
        - namespaceSelector:
            {{- if $np.monitoring.namespaceSelector }}
            matchLabels:
              {{- toYaml $np.monitoring.namespaceSelector | nindent 14 }}
            {{- else }}
            {}
            {{- end }}
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # The publish sessions to the relay (QUIC).
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml $np.relay.podSelector | nindent 14 }}
          {{- with $np.relay.namespaceSelector }}
          namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: UDP
          port: {{ $np.relay.port }}
    # The other gateway pods' internal port.
    - to:
        - podSelector:
            matchLabels:
              {{- include "gawk-whip-gateway.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8081
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml $np.dns.podSelector | nindent 14 }}
          {{- with $np.dns.namespaceSelector }}
          namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
