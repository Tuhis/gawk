{{- if .Values.metrics.serviceMonitor.enabled }}
# Requires the prometheus-operator CRDs.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gawk-whip-gateway.fullname" . }}
  labels:
    {{- include "gawk-whip-gateway.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "gawk-whip-gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: peers
  endpoints:
    - port: ops
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
