# Shared by the jobs in .github/workflows/broadcast-desktop.yml that compile
# Linux code (R56, docs/58 D12): they run in an `ubuntu:24.04` container, not
# on the runner image, so the build's glibc floor is pinned by the container
# (OD14) rather than by whenever the runner image is upgraded — and the runner
# image stays exactly as it is.
#
# Everything a job here needs is installed by this one action, so the two
# jobs cannot drift apart on a package list:
#
#  * build: the GStreamer and PipeWire headers the -sys crates link against,
#    fontconfig/xkbcommon for Slint's winit backend, clang for bindgen
#    (pipewire-sys), cmake for the vendored libopus, lld for the test links;
#  * test runtime: a PipeWire daemon, WirePlumber and a session bus for the
#    headless app-audio harness (docs/39 D7, F6), and the GStreamer plugins
#    the gst-level tests build pipelines from — `-ugly` only for the
#    test-only x264enc stub, never a production candidate;
#  * packaging: desktop-file-utils and binutils (objdump) for the tarball
#    checks;
#  * Rust: rustup, then the toolchain rust-toolchain.toml pins.
#
# The apt invocation (install-deps.sh) is ci.yml's defensive one (the
# broadcast job documents every line of it): HTTPS for the Ubuntu archives,
# IPv4 only, short inactivity timeouts, bounded retries, and update errors
# surfaced.
#
# THE PREBUILT IMAGE. The jobs run in ghcr.io/tuhis/gawk-desktop-ci, which is
# ubuntu:24.04 with install-deps.sh and the pinned toolchain already applied
# (Dockerfile beside this file, published by desktop-ci-image.yml). It
# exists for speed only — on the stock image this took 61-110 s per job,
# every job, and it is a no-op there now — so it is never trusted to be
# current:
#
#  * apt: the image records install-deps.sh's sha256, and this action runs the
#    script whenever the file in the checkout hashes differently. A PR that
#    changes the list gets it installed on top of the old image; the image
#    catches up when the PR lands on main.
#  * Rust: `rustup toolchain install` reads rust-toolchain.toml and is a
#    no-op when the image already has that toolchain, and an install when a
#    PR bumps it.
#
# The action still works unchanged in plain ubuntu:24.04, so pointing a job
# back at it is the whole rollback.
name: Linux container setup
description: Install the Linux build/test toolchain inside the ubuntu:24.04 container (a no-op on a current gawk-desktop-ci image).

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        want=$(sha256sum "$GITHUB_ACTION_PATH/install-deps.sh" | cut -d' ' -f1)
        have=$(cat /etc/gawk-desktop-ci/install-deps.sha256 2>/dev/null || true)
        if [ "$want" = "$have" ]; then
          echo "The prebuilt image already has this install-deps.sh applied ($want): skipping apt."
        else
          echo "install-deps.sh is ${want}; the image has ${have:-none}. Installing."
          bash "$GITHUB_ACTION_PATH/install-deps.sh"
        fi
        # The checkout belongs to the runner's user, not the container's root:
        # without this, git refuses it ("dubious ownership") and the version
        # badge loses its +g<commit> (crates/ui/build_rev.rs asks git).
        # Per job, not in the image: it is global git config under $HOME,
        # which the runner points at its own /github/home.
        git config --global --add safe.directory '*'
    - shell: bash
      working-directory: gawk-broadcast-desktop
      run: |
        set -euo pipefail
        # The image keeps rustup in /opt (RUSTUP_HOME, plus the proxies in
        # /opt/cargo/bin) rather than under $HOME, which the runner remaps to
        # the RAM-backed _work volume. CARGO_HOME is deliberately left at its
        # default, $HOME/.cargo: the registry sources' absolute paths are part
        # of every sccache key, and moving them would miss every crate once.
        if [ -x /opt/cargo/bin/rustup ]; then
          echo "RUSTUP_HOME=/opt/rustup" >> "$GITHUB_ENV"
          export RUSTUP_HOME=/opt/rustup
          echo /opt/cargo/bin >> "$GITHUB_PATH"
          export PATH="/opt/cargo/bin:$PATH"
          # rustup itself refuses to run ("rustup is not installed at
          # $CARGO_HOME") unless CARGO_HOME is where it was installed; cargo
          # and rustc do not care. So only this step's rustup calls see it.
          export CARGO_HOME=/opt/cargo
        else
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
        fi
        # rust-toolchain.toml names the channel (and rustfmt + clippy);
        # llvm-tools is cargo-llvm-cov's, and must match rustc's LLVM. Both
        # are no-ops when the image already has them.
        rustup toolchain install
        rustup component add llvm-tools-preview
        rustc --version
        cargo --version
        echo "GStreamer $(pkg-config --modversion gstreamer-1.0), PipeWire $(pkg-config --modversion libpipewire-0.3), $(ldd --version | sed -n 1p)"
