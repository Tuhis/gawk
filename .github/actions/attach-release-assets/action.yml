# Attaches already-built files to the GitHub Release for the commit being
# built — if there is one. Nothing here compiles anything.
#
# Why this exists at all: the binaries a user wants are the ones CI already
# builds. On a release-PR merge the push to main fires ci.yml,
# broadcast-windows.yml AND release-please.yml at the same time, on the same
# commit, so by the time a release exists its binaries have already been built
# and uploaded as workflow artifacts. Rebuilding them in a release job would be
# minutes of duplicate work for a byte-identical result. This action moves the
# bytes instead.
#
# Why an action rather than a step in each workflow: the interesting part is
# the gate, and there must be exactly one copy of it.
#
# **The gate is not "did a release happen".** If only gawk-app bumped, this
# component's tag still exists from an earlier release, and attaching to it
# would staple a freshly built binary onto an *older* release — mislabelled,
# and silently so. The gate is "does <component>-v<manifest version> point at
# THIS commit", which is false for a component that did not bump and false on
# every ordinary push.
name: Attach release assets
description: Upload files to this commit's GitHub Release for a release-please component, if one exists.

inputs:
  component:
    description: release-please component name, exactly as keyed in .release-please-manifest.json
    required: true
  dir:
    description: directory whose files each become a release asset
    required: true
  sha:
    # Exists because the gate is the ONLY thing standing between a build and a
    # release, and a build that was never made has no commit to match. When
    # broadcast-windows.yml stopped loading on the v1.1.0 release commit, that
    # release published with no binary, and no later push could fix it: every
    # subsequent commit fails `sha !== context.sha` — correctly, since the tag
    # really does point somewhere else.
    #
    # Overriding this does NOT weaken the gate, it re-aims it. The tag must
    # still point at the commit named here, and the caller is expected to have
    # BUILT that commit; broadcast-windows.yml checks it out to do so. Passing
    # a commit you did not build is how you staple the wrong bytes onto a
    # release, which is the exact failure the gate exists to prevent.
    description: >-
      Commit the release tag must point at. Defaults to the commit being built.
      Set only to backfill a release whose assets were missed, and only to a
      commit this run actually built.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/github-script@v9
      env:
        # Passed as env, never interpolated into the script body: a commit
        # message is attacker-controlled text and `${{ }}` inside `script:` is
        # a code-injection sink.
        COMPONENT: ${{ inputs.component }}
        ASSET_DIR: ${{ inputs.dir }}
        HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        EXPECT_SHA: ${{ inputs.sha }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const { owner, repo } = context.repo;
          const component = process.env.COMPONENT;
          const dir = process.env.ASSET_DIR;

          // The manifest at THIS commit already holds the versions being
          // released: release-please updates it in the release PR, and merging
          // that PR is the release commit.
          // The commit the tag has to point at. context.sha on every ordinary
          // run; a backfill names an older commit it has just rebuilt, and the
          // manifest in the workspace must be that commit's — see the
          // attach-release job in broadcast-windows.yml, which checks it out.
          const expectSha = process.env.EXPECT_SHA || context.sha;

          const manifest = JSON.parse(fs.readFileSync('.release-please-manifest.json', 'utf8'));
          const version = manifest[component];
          if (!version) {
            core.setFailed(`${component} is not a package in .release-please-manifest.json`);
            return;
          }
          // Tags moved from `component-vX.Y.Z` to `component/vX.Y.Z` — the
          // layout Go requires of a module in a subdirectory, so that
          // gawk-server/wire is `go get`-able (release-please emits it via
          // tag-separator in release-please-config.json).
          //
          // BOTH spellings are tried, newest first, and this is not
          // belt-and-braces: `attach_to` backfills a release cut BEFORE the
          // change, whose tag is legacy-spelled and always will be. Hardcoding
          // either format alone breaks half the releases this action exists to
          // serve — and it would break them silently, since a tag that is
          // merely absent is an ordinary "nothing to attach" (see below), the
          // exact shape of the bug that published gawk-broadcast-v1.11.0 with
          // no assets. Drop the legacy candidate only once no reachable
          // release predates the change.
          const candidates = [`${component}/v${version}`, `${component}-v${version}`];

          // release-please runs in a parallel workflow on this same push. Its
          // job is ~30 s where the build this one waits on takes minutes, so
          // the tag has existed for a while by the time we look — but wait
          // rather than race, and only when the commit says to expect one.
          const expectRelease = (process.env.HEAD_COMMIT_MESSAGE || '').startsWith('chore: release main');
          const attempts = expectRelease ? 6 : 1;

          const tagSha = async (tag) => {
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              // release-please creates lightweight tags today; deref anyway,
              // so an annotated one would not silently never match.
              if (ref.data.object.type !== 'tag') return ref.data.object.sha;
              const annotated = await github.rest.git.getTag({ owner, repo, tag_sha: ref.data.object.sha });
              return annotated.data.object.sha;
            } catch (e) {
              if (e.status === 404) return null;
              throw e;
            }
          };

          let tag = null;
          let sha = null;
          for (let i = 1; i <= attempts && !sha; i++) {
            for (const candidate of candidates) {
              sha = await tagSha(candidate);
              if (sha) {
                tag = candidate;
                break;
              }
            }
            if (!sha && i < attempts) await new Promise((r) => setTimeout(r, 10_000));
          }

          // Both misses are ordinary, not failures: a component that did not
          // bump in this release has no new tag, and one that has never been
          // released has no tag at all.
          if (!sha) {
            core.info(`neither ${candidates.join(' nor ')} exists — nothing to attach`);
            return;
          }
          if (sha !== expectSha) {
            core.info(`${tag} points at ${sha.slice(0, 7)}, not ${expectSha.slice(0, 7)} — nothing to attach`);
            return;
          }

          const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
          const files = fs.readdirSync(dir);
          for (const name of files) {
            // Re-running this job must not fail on a name already there —
            // which is the whole recovery path if the upload half ever breaks.
            const existing = release.data.assets.find((a) => a.name === name);
            if (existing) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
            }
            const data = fs.readFileSync(path.join(dir, name));
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.data.id,
              name,
              headers: { 'content-type': 'application/octet-stream', 'content-length': data.length },
              data,
            });
            core.info(`uploaded ${name} (${data.length} bytes)`);
          }
          core.notice(`Attached ${files.length} asset(s) to ${tag}`);
