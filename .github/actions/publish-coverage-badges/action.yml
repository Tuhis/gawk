# Publishes coverage badges to the orphan `badges` branch (R41, docs/43).
#
# The branch is the whole storage layer: shields.io reads
# `img.shields.io/endpoint?url=…raw.githubusercontent.com/Tuhis/gawk/badges/…`,
# so there is no third-party account, no token beyond GITHUB_TOKEN, and no
# coverage report leaving GitHub. It carries `data.json` (the counts, which is
# what the aggregate is computed from) plus one shields-shaped file per
# component and `total.json`.
#
# **Updates are partial, and that is the point.** ci.yml is path-filtered, so a
# push that only touches gawk-app runs one coverage job. The five components
# that did not run must keep the numbers they last measured — still true of
# code that did not move — so this action merges the records it was given into
# `data.json` rather than rewriting the branch from what this run happened to
# produce. Publishing the run's output wholesale would blank five badges on
# nearly every push.
#
# Two workflows call it: ci.yml for the seven components it builds, and
# broadcast-windows.yml for the Rust one, which lives in its own workflow and
# therefore cannot share ci.yml's artifacts. They can land at the same second
# on a release commit, so pushes race — hence the fetch-rebuild-retry loop,
# and hence the shared `concurrency` group on both calling jobs.
name: Publish coverage badges
description: Merge coverage records into the badges branch and regenerate the shields endpoints.

inputs:
  records-dir:
    description: Directory holding the normalised coverage records (one JSON per component)
    required: true
  token:
    description: Token used to push the badges branch
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Update the badges branch
      shell: bash
      env:
        RECORDS_DIR: ${{ inputs.records-dir }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        shopt -s nullglob
        records=("$RECORDS_DIR"/*.json)
        # Not an error: every coverage job in this run can legitimately have
        # been skipped by the path filter. Nothing measured, nothing to say.
        if [ ${#records[@]} -eq 0 ]; then
          echo "No coverage records in $RECORDS_DIR — nothing to publish."
          exit 0
        fi

        checkout="${RUNNER_TEMP}/badges-branch"
        remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # Depth 1: the branch is a running total, not a history anyone reads
        # back, and its whole content is four kilobytes of JSON.
        if git clone --depth 1 --branch badges --quiet "$remote" "$checkout" 2>/dev/null; then
          echo "Updating the existing badges branch."
        else
          # First run, or someone deleted the branch. An orphan branch rather
          # than a branch off main: nothing here shares history with the code,
          # and a badges branch carrying workflow files would be a second place
          # CI could be triggered from.
          echo "No badges branch yet — creating it."
          git clone --depth 1 --quiet "$remote" "$checkout"
          git -C "$checkout" checkout --orphan badges
          # 2>/dev/null: on a repository whose default branch is empty this
          # prints a bare `fatal: pathspec '.' did not match any files`, which
          # reads like a failure in the logs and is not one.
          git -C "$checkout" rm -rq --cached . 2>/dev/null || true
          find "$checkout" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
        fi

        publish() {
          python3 "$GITHUB_WORKSPACE/tools/coverage/coverage.py" badges "$checkout" "${records[@]}"
        }
        publish

        cat > "$checkout/README.md" <<'EOF'
        # badges

        Generated by `.github/actions/publish-coverage-badges` on pushes to
        `main`. `data.json` holds the counts; every other file is a
        [shields.io endpoint](https://shields.io/badges/endpoint-badge)
        response consumed by the README badges. Nothing here is source — do not
        edit it by hand, and do not merge this branch anywhere.
        EOF

        cd "$checkout"
        git add -A
        # A run that measured the same numbers as the last one leaves no
        # commit, so the branch does not accrue one empty commit per push.
        if git diff --cached --quiet; then
          echo "Coverage unchanged — no commit."
          exit 0
        fi

        # The race is real on a release commit, where ci.yml and
        # broadcast-windows.yml both finish against the same SHA. Rebuild
        # rather than rebase: the merge lives in coverage.py, which folds this
        # run's records into whatever the branch now holds, so re-running it
        # after a fetch is the conflict resolution.
        for attempt in 1 2 3 4 5; do
          git commit -qm "chore(coverage): update badges for ${GITHUB_SHA:0:7}"
          if git push -q origin badges; then
            echo "Published $(basename -a *.json | tr '\n' ' ')"
            exit 0
          fi
          echo "Push rejected (attempt $attempt) — folding in the concurrent update."
          git fetch -q --depth 1 origin badges
          git reset -q --hard FETCH_HEAD
          publish
          git add -A
          if git diff --cached --quiet; then
            echo "The concurrent update already carries these numbers."
            exit 0
          fi
          sleep $((attempt * 3))
        done

        echo "::error::could not push the badges branch after 5 attempts"
        exit 1
