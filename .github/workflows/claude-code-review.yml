name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"

jobs:
  claude-review:
    # Only review PRs from branches in this repo, opened by someone with write
    # access. Fork PRs don't receive secrets.CLAUDE_CODE_OAUTH_TOKEN anyway, so
    # without this they'd just fail noisily on every push; this skips them
    # cleanly. To review an outside contribution, comment "@claude review this"
    # on it — claude.yml handles that, gated the same way.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # Pinned to main for Claude Code 2.1.280: the v1 tag still installs 2.1.278,
        # which the API rejects for --model claude-opus-5-5 (400
        # claude_code_version_too_old). Return to @v1 once a release ships 2.1.280+.
        uses: anthropics/claude-code-action@9ca9355b36297178e28d37c799d1c9c8a28e6507
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Keep every subagent in the foreground. Headless -p mode ends the
          # session when the main agent ends its turn, and it does not wait for
          # background agents. On #354 the bot started its four reviewers with
          # run_in_background, ended its turn "waiting for their results", and
          # the job exited before any reviewer reported back: no comment, green
          # check. Several foreground Agent calls in one turn still run in
          # parallel.
          settings: '{"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The allowlist is the code-review plugin's own `allowed-tools`
          # (plugins/code-review/commands/code-review.md), verbatim. Allowing the
          # inline-comment tool alone denied every gh call: the bot could not
          # read the PR (gh pr view/diff) or post its "No issues found" summary
          # (gh pr comment), so every review since #331 ended silently. All of
          # these are gh reads except gh pr comment, which the plugin needs for
          # the summary; nothing here builds or runs PR code.
          claude_args: '--model claude-opus-5-5 --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action logs only permission_denials_count, never which calls were
      # denied, so a review that ends silently leaves nothing to go on (#350:
      # 5 denials, 9 turns, no comment, green check). Print the denied calls and
      # keep the transcript. Not show_full_output: that dumps every tool result
      # into the log. The transcript holds only what the allowlisted gh reads
      # returned, which is already public on this repo.
      - name: List denied tool calls
        if: always() && steps.claude-review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "result") | .permission_denials // [] | .[]
                 | "::warning title=Review bot tool denied::\(.tool_name) \(.tool_input | tojson)"' \
            "$EXECUTION_FILE" || true

      - name: Upload review transcript
        if: always() && steps.claude-review.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: claude-review-transcript-pr${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ steps.claude-review.outputs.execution_file }}
          retention-days: 7
          if-no-files-found: warn
