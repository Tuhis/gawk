# Release automation: release-please maintains ONE combined release PR
# covering every component (gawk-server, gawk-app, gawk-broadcast,
# gawk-broadcast-windows, gawk-telemetry, gawk-admin), computing each one's
# next SemVer from conventional commits; merging it tags per component (e.g.
# gawk-server/v0.5.0 — tag-separator "/") and the publish jobs below push the
# docker image and OCI Helm chart to GHCR with matching versions.
#
# gawk-broadcast and gawk-broadcast-windows have NO publish job here on
# purpose (R14 Decision 2, docs/19): they are native binaries you run on your
# own PC, deliberately outside the "chart version == appVersion == image tag"
# model that exists for cluster-side components. No image, no chart, no
# deploy — which is also what keeps broadcaster commits from bumping,
# rebuilding and auto-redeploying the relay (Decision 1).
#
# They do get their binaries onto the release page, but not from here and not
# from a build of their own: this push and the CI runs for the same commit are
# concurrent, so ci.yml's attach-broadcast-release and broadcast-windows.yml's
# attach-release upload the artifacts those runs already built. Rebuilding
# them in a job here would be minutes of duplicate work for a byte-identical
# result. See .github/actions/attach-release-assets.
#
# The publish jobs MUST live in this workflow, gated on release-please
# outputs: tags created with GITHUB_TOKEN do not trigger other workflows,
# so an `on: push: tags` publish workflow would silently never run.
#
# GHCR refs hardcode lowercase "tuhis" — GHCR rejects uppercase and
# github.repository_owner returns "Tuhis".
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Runner pool: `runs-on` reads RUNNER_LABEL, falling back to `ubuntu-latest`
# in a fork that has no such variable. Why: ci.yml's header.

jobs:
  release-please:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      server_release: ${{ steps.rp.outputs['gawk-server--release_created'] }}
      server_version: ${{ steps.rp.outputs['gawk-server--version'] }}
      app_release: ${{ steps.rp.outputs['gawk-app--release_created'] }}
      app_version: ${{ steps.rp.outputs['gawk-app--version'] }}
      telemetry_release: ${{ steps.rp.outputs['gawk-telemetry--release_created'] }}
      telemetry_version: ${{ steps.rp.outputs['gawk-telemetry--version'] }}
      admin_release: ${{ steps.rp.outputs['gawk-admin--release_created'] }}
      admin_version: ${{ steps.rp.outputs['gawk-admin--version'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-server:
    needs: release-please
    if: needs.release-please.outputs.server_release == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release-please.outputs.server_version }}
    steps:
      - uses: actions/checkout@v7
      # Host networking and the in-cluster registry mirror — see the action.
      - uses: ./.github/actions/setup-buildx
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No layer cache. Importing one from GitHub's Actions cache measured
      # slower than building from scratch on these runners — 160s against 55s
      # for this image, with the cache HITTING (run 30769004833). ci.yml's
      # `docker` job carries the full numbers and the caveat about when to
      # re-measure. Base images come from the in-cluster mirror instead.
      - uses: docker/build-push-action@v7
        with:
          context: gawk-server
          file: gawk-server/deploy/Dockerfile
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/tuhis/gawk-server:${{ env.VERSION }}
            ghcr.io/tuhis/gawk-server:latest
      - name: Push Helm chart
        # The tagged commit's Chart.yaml already carries the right versions
        # (release-please extra-files); the explicit flags are
        # belt-and-suspenders so the published chart always matches the
        # release even if the updater mis-fires.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package gawk-server/deploy/charts/gawk-server --version "$VERSION" --app-version "$VERSION"
          helm push "gawk-server-$VERSION.tgz" oci://ghcr.io/tuhis/charts

  publish-app:
    needs: release-please
    if: needs.release-please.outputs.app_release == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release-please.outputs.app_version }}
    steps:
      - uses: actions/checkout@v7
      # Host networking and the in-cluster registry mirror — see the action.
      - uses: ./.github/actions/setup-buildx
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: gawk-app
          file: gawk-app/deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/tuhis/gawk-app:${{ env.VERSION }}
            ghcr.io/tuhis/gawk-app:latest
      - name: Push Helm chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package gawk-app/deploy/charts/gawk-app --version "$VERSION" --app-version "$VERSION"
          helm push "gawk-app-$VERSION.tgz" oci://ghcr.io/tuhis/charts

  # R28 (docs/33). Publishes exactly like the other cluster-side components;
  # the chart it ships is default-off, so releasing it changes nothing for a
  # deployment that never enables telemetry.
  publish-telemetry:
    needs: release-please
    if: needs.release-please.outputs.telemetry_release == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release-please.outputs.telemetry_version }}
    steps:
      - uses: actions/checkout@v7
      # Host networking and the in-cluster registry mirror — see the action.
      - uses: ./.github/actions/setup-buildx
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          # The REPO ROOT, not the module dir: gawk-telemetry consumes
          # gawk-server/wire through a local `replace` (docs/33 D12).
          context: .
          file: gawk-telemetry/deploy/Dockerfile
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/tuhis/gawk-telemetry:${{ env.VERSION }}
            ghcr.io/tuhis/gawk-telemetry:latest
      - name: Push Helm chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package gawk-telemetry/deploy/charts/gawk-telemetry --version "$VERSION" --app-version "$VERSION"
          helm push "gawk-telemetry-$VERSION.tgz" oci://ghcr.io/tuhis/charts

  # R39 (docs/42 D1). The sixth release-please component, and the FOURTH
  # cluster-side publish: image + OCI chart, versions in lockstep, exactly like
  # the three above. Its chart is default-nothing — installing gawk-admin is a
  # deliberate act, and the relay chart's moderation.enabled is a separate one —
  # so releasing it changes nothing for a deployment that never installs it.
  #
  # ONE IMAGE, TWO MODES: the chart's migration hook Job runs `gawk-admin
  # migrate` from this exact tag. That is what makes "the schema a release needs
  # travels with the release" (docs/42 §4.15) a property of the build rather
  # than a note in a runbook.
  publish-admin:
    needs: release-please
    if: needs.release-please.outputs.admin_release == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release-please.outputs.admin_version }}
    steps:
      - uses: actions/checkout@v7
      # Host networking and the in-cluster registry mirror — see the action.
      - uses: ./.github/actions/setup-buildx
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          # The REPO ROOT, not the module dir: gawk-admin consumes
          # gawk-server/moderation through a local `replace` (docs/42 D13).
          context: .
          file: gawk-admin/deploy/Dockerfile
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/tuhis/gawk-admin:${{ env.VERSION }}
            ghcr.io/tuhis/gawk-admin:latest
      - name: Push Helm chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package gawk-admin/deploy/charts/gawk-admin --version "$VERSION" --app-version "$VERSION"
          helm push "gawk-admin-$VERSION.tgz" oci://ghcr.io/tuhis/charts
