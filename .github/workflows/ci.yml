# Validation on every PR and main push: Go tests (with -race, which needs
# CGO) for both Go modules, frontend lint/test/build, chart lint/render, and
# docker builds (no push — publishing happens in release-please.yml on
# release).
#
# No path filters on purpose: the whole matrix takes a few minutes, and
# skipped-vs-required check semantics aren't worth it at this repo size.
#
# The R20 E2E jobs (docs/25) deviate from the rest of the matrix on purpose:
# they run on pull_request ONLY, never on push to main — every change reaches
# main through a PR, and the release-please PR re-runs them against the
# merged aggregate, so a main-push re-run would double the billable minutes
# for near-zero information (docs/25 Decision 1). workflow_dispatch exists as
# the on-demand escape hatch for the cluster tier.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ioio-k8s
    defaults:
      run:
        working-directory: gawk-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: gawk-server/go.mod
          cache-dependency-path: gawk-server/go.sum
      # quic-go asks for ~7 MiB UDP buffers and a stock kernel caps them
      # at 2 MiB — low enough that loopback datagrams drop under -race load
      # (run 29663246454 lost a delta and hung a carrier test for the full
      # package timeout). Applies to every job that pushes QUIC over loopback.
      # The ioio-k8s runner pods can't write net.core sysctls (/proc/sys is
      # read-only in the container) — the limits are preset on the cluster
      # nodes instead, so only write when actually below the floor.
      - name: Ensure UDP buffer limits for quic-go
        run: |
          need=7340032
          if [ "$(sysctl -n net.core.rmem_max)" -lt "$need" ] || [ "$(sysctl -n net.core.wmem_max)" -lt "$need" ]; then
            sudo sysctl -w net.core.rmem_max="$need" net.core.wmem_max="$need"
          fi
      - run: go vet ./...
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  # The native Linux broadcaster (R14, docs/19). Separate from the `server`
  # job on purpose (Decision 1): the GUI shell imports Gio, so this job — and
  # only this job — pays for the cgo/Wayland/X11/EGL/Vulkan headers. The
  # relay's job must stay header-free.
  broadcast:
    runs-on: ioio-k8s
    defaults:
      run:
        working-directory: gawk-broadcast
    env:
      # Explicit, not inherited: Gio's window backend is cgo, so with
      # CGO_ENABLED=0 the GUI package fails to build with a confusing
      # "build constraints exclude all Go files in gioui.org/internal/vk"
      # rather than anything about cgo.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: gawk-broadcast/go.mod
          cache-dependency-path: gawk-broadcast/go.sum
      # Gio's build dependencies (docs/19 Decision 14) — the honest price of
      # a native Wayland GUI. Keep in sync with gawk-broadcast/README.md.
      #
      # The apt invocation is deliberately defensive, because the plain one is
      # not survivable here (run 29937257710 — every broadcast job failed for
      # over an hour):
      #  * the ioio-k8s runner pods have no IPv6 route, so apt burns a connect
      #    timeout on all six AAAA records of every archive host before it ever
      #    tries an A record → ForceIPv4.
      #  * port 80 to the Canonical archives goes dark periodically while 443
      #    stays healthy (in that run the HTTPS repos — dl.google.com, the
      #    git-core PPA — fetched in milliseconds while archive/security
      #    .ubuntu.com timed out on every address; reproduced off-cluster from
      #    a second network) → the .ubuntu.com sources are rewritten to HTTPS.
      #    Safe on any Ubuntu image: apt has built-in HTTPS support and the
      #    runner images ship ca-certificates (those HTTPS repos prove it).
      #  * `apt-get update` exits 0 when index downloads fail, so the outage
      #    surfaced two commands later as a baffling "E: Unable to locate
      #    package libwayland-dev" → Error-Mode=any + retries. A pocket that
      #    stays unreachable is only a warning: a stale index still installs,
      #    and the install below is the real gate.
      #
      # Patience is budgeted, not maximised: when a host is unreachable, more
      # of it only converts a 30 s step into a 30 min one. Measured against the
      # live degraded archives — 3 apt-level retries at a 20 s timeout (9
      # attempts per index file, once the outer retry loop multiplies in) ran
      # past 20 minutes without finishing, where 1 at 15 s installed all eleven
      # packages in 2m25s. Note these are *inactivity* timeouts, so they don't
      # cut off a slow-but-progressing transfer — a good thing: on the run that
      # verified this the indexes came down in 13 s at 2.4 MB/s and then the
      # .debs crawled in at 9.5 kB/s, 7m07s for 4 MB.
      #
      # timeout-minutes is a hang backstop, not a performance budget — that
      # 7m07s is why it isn't tighter. Neither the job nor the workflow sets
      # one, so without it a wedged apt holds a self-hosted runner for the
      # 6-hour default.
      - name: Install Gio build dependencies
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # deb822 (.sources) on noble, one-line (.list) on older images.
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -i 's|http://\([a-z0-9.-]*\)\.ubuntu\.com|https://\1.ubuntu.com|g' {} +
          sudo tee /etc/apt/apt.conf.d/99-gawk-ci >/dev/null <<'EOF'
          Acquire::ForceIPv4 "true";
          Acquire::Retries "1";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          EOF
          retry() {
            for attempt in 1 2 3; do
              [ "$attempt" = 1 ] || sleep $(((attempt - 1) * 15))
              "$@" && return 0
              echo "::warning::attempt ${attempt}/3 failed: $*"
            done
            return 1
          }
          retry sudo apt-get -o APT::Update::Error-Mode=any update ||
            echo "::warning::apt-get update never completed cleanly — installing against whatever indexes we have"
          retry sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev \
            libffi-dev libxcursor-dev libvulkan-dev || {
              echo "::error::Gio build dependencies could not be installed — the Ubuntu archives look unreachable from this runner, not a change in this PR"
              exit 1
            }
      # See the server job — the relay integration tests here run QUIC over
      # loopback too.
      - name: Ensure UDP buffer limits for quic-go
        run: |
          need=7340032
          if [ "$(sysctl -n net.core.rmem_max)" -lt "$need" ] || [ "$(sysctl -n net.core.wmem_max)" -lt "$need" ]; then
            sudo sysctl -w net.core.rmem_max="$need" net.core.wmem_max="$need"
          fi
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      # `go test` type-checks the GUI package but never links it. Building the
      # shells is what proves the Gio window actually compiles and links —
      # this job is the only place that happens automatically.
      #
      # The binaries are also uploaded as an artifact: R14's claims (hardware
      # encode, the portal, game fps) are unverifiable in CI by construction —
      # no GPU, no portal, no desktop — so a build someone can run on real
      # hardware is how this gets tested at all, and it must be available
      # before merge, not after.
      - name: Build binaries
        run: |
          mkdir -p dist
          # -trimpath keeps build paths out of the binary handed to someone else.
          go build -trimpath -o dist/ ./cmd/...
      # Recorded, not guessed: INSTALL.md's library list has to match what the
      # binary actually links, and the glibc floor decides whether it starts at
      # all on the tester's distro.
      - name: Record build provenance and runtime dependencies
        run: |
          # The floor is the newest glibc symbol version the binary actually
          # references — NOT the builder's glibc, which is only an upper bound
          # and overstates the requirement badly (2.39 vs. the real 2.34,
          # i.e. "rebuild on Ubuntu 22.04" vs. "just run it").
          glibc_floor() {
            objdump -T "$1" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          }
          {
            echo "gawk-broadcast — prebuilt test binaries"
            echo
            echo "commit:  ${{ github.sha }}"
            echo "branch:  ${{ github.ref_name }}"
            echo "built:   $(date -u +%FT%TZ)"
            echo "runner:  $(. /etc/os-release && echo "$PRETTY_NAME") ($(uname -m))"
            echo "go:      $(go version)"
            # sed, not head: head closes the pipe early and ldd reports the
            # SIGPIPE as an error into the file we're generating.
            echo "builder glibc: $(ldd --version | sed -n 1p)"
            echo
            echo "Minimum glibc to RUN these (check yours with 'ldd --version'):"
            echo "  gawk-broadcast-gui: $(glibc_floor dist/gawk-broadcast-gui)"
            echo "  gawk-broadcast:     $(glibc_floor dist/gawk-broadcast)"
            echo
            echo "Below that they won't start. Above it, a missing shared library"
            echo "is the likelier failure — see INSTALL.md, and check with:"
            echo "  ldd ./gawk-broadcast-gui | grep 'not found'"
            echo
            echo "=== gawk-broadcast-gui links against ==="
            ldd dist/gawk-broadcast-gui
            echo
            echo "=== gawk-broadcast (CLI) links against ==="
            ldd dist/gawk-broadcast
          } | tee dist/BUILD-INFO.txt
      - name: Include install instructions with the binaries
        run: cp INSTALL.md dist/
      - uses: actions/upload-artifact@v7
        with:
          name: gawk-broadcast-linux-amd64-${{ github.sha }}
          # Repo-relative, not job-relative: `defaults.run.working-directory`
          # applies to `run:` steps only, never to an action's inputs.
          path: gawk-broadcast/dist/
          retention-days: 30
          if-no-files-found: error

  app:
    runs-on: ioio-k8s
    defaults:
      run:
        working-directory: gawk-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gawk-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Multi-module tidy gate. A dependency bump that lands in one module can
  # leave a module that requires it via a local `replace` (gawk-broadcast →
  # gawk-server) with a stale pruned module graph, which Go 1.25's
  # `go vet`/`go build` then refuse — the failure that broke PR #75
  # (client_golang bumped in gawk-server left gawk-broadcast's go.mod untidy).
  # Renovate's `gomodTidy` tidies the module it edits, and grouping shared deps
  # (renovate.json) makes cross-module bumps touch both go.mod files at once —
  # but the transitive local-replace case only surfaces here, so every module
  # must be `go mod tidy`-clean, checked independently of any build. `go mod
  # tidy` resolves the module graph without compiling cgo, so this stays
  # header-free and fast.
  # R28 (docs/33): the optional telemetry service. Its own job for the same
  # reason gawk-broadcast has one — it is a separate module — but unlike that
  # one it needs no extra headers: DuckDB is a query OPTION, never a runtime
  # dependency (D11), so this stays a plain cgo-free Go build.
  telemetry:
    runs-on: ioio-k8s
    defaults:
      run:
        working-directory: gawk-telemetry
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: gawk-telemetry/go.mod
          # go.mod, not go.sum: this module's ONLY dependency is the locally
          # `replace`d gawk-server, so it legitimately has no checksum file.
          cache-dependency-path: gawk-telemetry/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  tidy:
    runs-on: ioio-k8s
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: gawk-server/go.mod
          cache-dependency-path: |
            gawk-server/go.sum
            gawk-broadcast/go.sum
      - name: go mod tidy leaves every module unchanged
        run: |
          for mod in gawk-server gawk-broadcast gawk-telemetry; do
            (cd "$mod" && go mod tidy)
          done
          if ! git diff --exit-code; then
            echo "::error::go.mod/go.sum not tidy — run 'go mod tidy' in the module(s) shown in the diff above and commit the result"
            exit 1
          fi

  helm:
    runs-on: ioio-k8s
    steps:
      - uses: actions/checkout@v7
      - run: helm lint gawk-server/deploy/charts/gawk-server gawk-app/deploy/charts/gawk-app
      - run: helm lint gawk-telemetry/deploy/charts/gawk-telemetry --set telemetryKey=00
      - run: helm template gawk-server/deploy/charts/gawk-server > /dev/null
      - run: helm template gawk-app/deploy/charts/gawk-app > /dev/null
      - run: helm template gawk-telemetry/deploy/charts/gawk-telemetry --set telemetryKey=00 > /dev/null
      # R28 (docs/33 TM3): with telemetry off, the relay chart must render
      # nothing telemetry-related at all — an install that never enables it
      # carries no trace of R28.
      #
      # This is a whole-render absence check, not a byte-diff against the
      # pre-R28 output (review nit): a golden render would have to be
      # regenerated on every release-please version bump, since the chart
      # version, appVersion and image tag all appear in it. So what is asserted
      # is exactly what the check can hold — no telemetry token anywhere in the
      # default render, case-insensitively, which covers env vars, Service and
      # label names, annotations and comments alike.
      - name: relay chart with telemetry off renders nothing telemetry-related
        run: |
          out=$(helm template gawk-server/deploy/charts/gawk-server)
          if echo "$out" | grep -qi "telemetry"; then
            echo "::error::telemetry.enabled=false still renders telemetry content"
            echo "$out" | grep -i telemetry
            exit 1
          fi
      - name: relay chart with telemetry on renders the key and headless Service
        run: |
          out=$(helm template gawk-server/deploy/charts/gawk-server \
                  --set telemetry.enabled=true --set telemetry.key=00)
          echo "$out" | grep -q GAWK_TELEMETRY_KEY
          echo "$out" | grep -q metrics-headless

  # R20 tier 1 (docs/25): browser E2E on every PR — the real relay
  # (-dev-cert), the real native engine publishing the committed H.264
  # fixture (gawk-pubsim), and the production viewer surface in headless
  # system Chrome, with flow-shaped assertions read from the viewer's own
  # Copy-diagnostics JSON. Advisory until the docs/25 Z4 burn-in completes.
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ioio-k8s
    timeout-minutes: 10
    # A force-push supersedes the previous run instead of paying for it.
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: gawk-server/go.mod
          cache-dependency-path: |
            gawk-server/go.sum
            gawk-broadcast/go.sum
      # See the server job — the relay↔pubsim↔browser leg is QUIC over
      # loopback.
      - name: Ensure UDP buffer limits for quic-go
        run: |
          need=7340032
          if [ "$(sysctl -n net.core.rmem_max)" -lt "$need" ] || [ "$(sysctl -n net.core.wmem_max)" -lt "$need" ]; then
            sudo sysctl -w net.core.rmem_max="$need" net.core.wmem_max="$need"
          fi
      - name: Build the relay and the fixture publisher
        run: |
          mkdir -p e2e/bin
          (cd gawk-server && go build -o ../e2e/bin/gawk-server ./cmd/gawk-server)
          # gawk-pubsim imports engine+wire only — no Gio, so unlike the
          # broadcast job this needs no cgo or apt headers (docs/25 D3).
          (cd gawk-broadcast && CGO_ENABLED=0 go build -o ../e2e/bin/gawk-pubsim ./cmd/gawk-pubsim)
          (cd gawk-telemetry && CGO_ENABLED=0 go build -o ../e2e/bin/gawk-telemetry ./cmd/gawk-telemetry)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            gawk-app/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: gawk-app
      - run: npm run build
        working-directory: gawk-app
      - run: npm ci
        working-directory: e2e
      # R22 MF1 (docs/27 Decision 10): the fMP4 muxer's output plays in a real
      # Chrome MediaSource <video>. Standalone (no relay/publisher) and fast
      # (~10 s), so it runs first — a broken muxer fails here with its own
      # verdict instead of as noise in a full-stack run.
      - name: Run the fMP4 muxer playback check (R22)
        run: node run.mjs --muxer-check
        working-directory: e2e
        env:
          GAWK_E2E_OUT_DIR: out-muxer-check
      - name: Run the browser E2E (headless system Chrome)
        run: node run.mjs
        working-directory: e2e
      # R28 (docs/33): the telemetry pipe, end to end. Every other R28 test
      # runs against fakes, in-memory sinks or handler-level calls; this is the
      # only thing that proves the pipe EXISTS — a real relay mints a real 0x0D
      # hello onto a real uni stream, a real browser parses it and POSTs a real
      # batch, and a real service verifies the token and stores a session that
      # diagnose() can answer about. Its own step because it starts a fourth
      # process and spends ~25 s of dwell waiting for a real flush.
      #
      # It found five defects on its first run that the unit suite could not:
      # a method-scoped mux route that 404'd the CORS preflight, duplicate
      # rollup rows from late batches, an unimplemented relayCoverage join, a
      # false-positive diagnose() verdict on a clean stream, and legitimate
      # nulls counted as data-quality anomalies.
      - name: Run the telemetry E2E (R28)
        run: node run.mjs --telemetry
        working-directory: e2e
        env:
          GAWK_E2E_OUT_DIR: out-telemetry
      # Z5 (docs/25 Decision 9): the browser publishes — the production
      # broadcaster surface captures an animated tab, auto-granted via
      # --auto-select-tab-capture-source-by-title. The Z5 spike found headless
      # *screen* capture grants but delivers black frames; *tab* capture
      # delivers real pixels — don't switch this to a desktop-source flag.
      - name: Run the browser-broadcaster E2E (Z5)
        run: node run.mjs --browser-broadcast
        working-directory: e2e
        env:
          GAWK_E2E_OUT_DIR: out-browser-broadcast
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-tier1-${{ github.run_id }}
          path: |
            e2e/out/
            e2e/out-browser-broadcast/
            e2e/out-telemetry/
            e2e/out-muxer-check/
          retention-days: 7

  # R20 tier 2 (docs/25 Decision 7): cluster-mode E2E — the real chart with
  # 2 replicas + clusterMode on a fresh pinned kind cluster, reached over the
  # kind UDP port mapping (kubectl port-forward is TCP-only and cannot carry
  # WebTransport). Runs on release-please PRs only (docs/25 user decision 1;
  # release-please refreshes that PR after every main merge, so it still
  # re-checks each merged change) plus workflow_dispatch for cluster work.
  # This is the automated successor to docs/22's two-pod smoke.
  e2e-cluster:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--'))
    # Disk-backed runner pool: kind needs Docker's data-root on a real
    # filesystem (its inner containerd can't stack overlayfs on the tmpfs the
    # default ioio-k8s pool uses for /var/lib/docker). Every other job stays on
    # ioio-k8s. See ioio repo: clusters/baremetal/actions-runners/gawk-e2e.yaml.
    runs-on: ioio-k8s-disk
    timeout-minutes: 15
    concurrency:
      group: e2e-cluster-${{ github.ref }}
      cancel-in-progress: true
    env:
      KIND_VERSION: v0.30.0
      KIND_NODE_IMAGE: kindest/node:v1.34.0
      HELM_VERSION: v3.19.0
      KUBECTL_VERSION: v1.34.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: gawk-server/go.mod
          cache-dependency-path: |
            gawk-server/go.sum
            gawk-broadcast/go.sum
      # See the server job. net.core sysctls are host-global (not namespaced),
      # so this also covers the relay pods inside the kind node.
      - name: Ensure UDP buffer limits for quic-go
        run: |
          need=7340032
          if [ "$(sysctl -n net.core.rmem_max)" -lt "$need" ] || [ "$(sysctl -n net.core.wmem_max)" -lt "$need" ]; then
            sudo sysctl -w net.core.rmem_max="$need" net.core.wmem_max="$need"
          fi
      - name: Build the E2E toolchain (devcert, loadgen, pubsim)
        run: |
          mkdir -p e2e/bin e2e/out
          (cd gawk-server && go build -o ../e2e/bin/ ./cmd/gawk-devcert ./cmd/gawk-loadgen)
          (cd gawk-broadcast && CGO_ENABLED=0 go build -o ../e2e/bin/gawk-pubsim ./cmd/gawk-pubsim)
      # Host networking on both levels: the ioio-k8s pod network MTU is 1480
      # and buildkit's default bridged networks assume 1500 — large downloads
      # inside RUN steps black-hole otherwise.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [worker.oci]
              networkMode = "host"
      - name: Build the relay image (reusing the docker job's cache scope)
        uses: docker/build-push-action@v7
        with:
          context: gawk-server
          file: gawk-server/deploy/Dockerfile
          push: false
          load: true
          tags: gawk-server:e2e
          cache-from: type=gha,scope=gawk-server
      - name: Install kind (pinned)
        run: |
          sudo curl -fsSLo /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo chmod +x /usr/local/bin/kind
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}
      - name: Create the kind cluster (UDP NodePort mapped to 127.0.0.1:4433)
        run: |
          kind create cluster --config e2e/kind-config.yaml --image "$KIND_NODE_IMAGE" --wait 120s
          kind load docker-image gawk-server:e2e
      - name: Install the relay chart (replicas=2, clusterMode, NodePort)
        run: |
          ./e2e/bin/gawk-devcert -out e2e/out/certs -hosts localhost,127.0.0.1 > e2e/out/devcert.txt
          CERT_HASH=$(openssl x509 -in e2e/out/certs/cert.pem -outform der | sha256sum | cut -d' ' -f1)
          echo "CERT_HASH=$CERT_HASH" >> "$GITHUB_ENV"
          kubectl create namespace gawk-e2e
          kubectl -n gawk-e2e create secret tls gawk-server-tls \
            --cert=e2e/out/certs/cert.pem --key=e2e/out/certs/key.pem
          # Throwaway fleet secrets (exercises the chart's replicas>1-requires-
          # clusterMode guard and the R17 shared-key plumbing). SSL_CERT_FILE
          # points Go's system root pool at the mounted self-signed cert so
          # edge pods can verify their internal dials to the origin pod — the
          # edge dialer deliberately never skips TLS verification.
          # connBurstLimit is raised because every session arrives SNAT'd from
          # one host IP through the kind port mapping.
          helm install relay gawk-server/deploy/charts/gawk-server -n gawk-e2e \
            --set image.repository=gawk-server \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --set replicas=2 \
            --set config.clusterMode=true \
            --set service.type=NodePort \
            --set service.nodePort=30443 \
            --set certificate.enabled=false \
            --set config.internalServerName=localhost \
            --set config.internalPsk="$(openssl rand -hex 16)" \
            --set config.statelessResetKey="$(openssl rand -hex 32)" \
            --set config.resumeTokenKey="$(openssl rand -hex 32)" \
            --set config.statsKey="$(openssl rand -hex 32)" \
            --set config.connBurstLimit=50 \
            --set-json 'extraEnv=[{"name":"SSL_CERT_FILE","value":"/tls/tls.crt"}]' \
            --wait --timeout 180s
      - name: Publish the fixture and spread synthetic viewers
        run: |
          ./e2e/bin/gawk-pubsim -url https://127.0.0.1:4433 -insecure -duration 600s \
            > e2e/out/pubsim.out 2> e2e/out/pubsim.err &
          for i in $(seq 100); do
            grep -q GAWK_PUBSIM_ID e2e/out/pubsim.out && break
            sleep 0.2
          done
          ID=$(grep -m1 -o 'GAWK_PUBSIM_ID=[A-Z0-9]*' e2e/out/pubsim.out | cut -d= -f2)
          if [ -z "$ID" ]; then cat e2e/out/pubsim.err; exit 1; fi
          echo "BROADCAST_ID=$ID" >> "$GITHUB_ENV"
          # ~12 sessions so kube-proxy's per-5-tuple UDP conntrack spreads
          # subscribers across both pods (P[all-on-one] ≈ 2⁻¹²). The duration
          # must outlive the npm build + browser run that follow — sessions
          # ending before cluster-assert would erase the edge pod's
          # subscriber count.
          ./e2e/bin/gawk-loadgen -url https://127.0.0.1:4433 -id "$ID" -viewers 12 \
            -duration 600s -ramp-ms 150 -insecure > e2e/out/loadgen.log 2>&1 &
          # R21: a handful of DVR sessions in the same spread, so at least one
          # lands on the EDGE pod. An edge builds its own ring from the
          # datagrams it pulled from the origin — a different code path from
          # an origin-served ring, and the only one tier 2 can reach.
          ./e2e/bin/gawk-loadgen -url https://127.0.0.1:4433 -id "$ID" -viewers 6 \
            -delivery deep -buffer-ms 3000 \
            -duration 600s -ramp-ms 150 -insecure > e2e/out/loadgen-dvr.log 2>&1 &
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            gawk-app/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: gawk-app
      - run: npm run build
        working-directory: gawk-app
      - run: npm ci
        working-directory: e2e
      - name: Run the browser E2E against the cluster
        run: node run.mjs --external
        working-directory: e2e
        env:
          GAWK_E2E_URL: https://127.0.0.1:4433
          GAWK_E2E_CERT_HASH: ${{ env.CERT_HASH }}
          GAWK_E2E_ID: ${{ env.BROADCAST_ID }}
      - name: Assert the origin/edge split from per-pod ops endpoints
        run: |
          # One retry with a fresh spread if conntrack ever lands every
          # session on the origin pod (docs/25 Decision 7).
          ./e2e/cluster-assert.sh gawk-e2e 120 || {
            echo "retrying with 12 more subscriber sessions"
            ./e2e/bin/gawk-loadgen -url https://127.0.0.1:4433 -id "$BROADCAST_ID" \
              -viewers 12 -duration 180s -ramp-ms 150 -insecure >> e2e/out/loadgen.log 2>&1 &
            ./e2e/bin/gawk-loadgen -url https://127.0.0.1:4433 -id "$BROADCAST_ID" \
              -viewers 6 -delivery deep -buffer-ms 3000 \
              -duration 180s -ramp-ms 150 -insecure >> e2e/out/loadgen-dvr.log 2>&1 &
            ./e2e/cluster-assert.sh gawk-e2e 120
          }
      - name: Export cluster state on failure
        if: failure()
        run: |
          kubectl -n gawk-e2e get pods -o wide > e2e/out/pods.txt 2>&1 || true
          kubectl -n gawk-e2e describe pods > e2e/out/describe.txt 2>&1 || true
          kubectl -n gawk-e2e get leases -o yaml > e2e/out/leases.yaml 2>&1 || true
          kind export logs e2e/out/kind-logs || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-cluster-${{ github.run_id }}
          path: e2e/out/
          retention-days: 7

  docker:
    runs-on: ioio-k8s
    strategy:
      matrix:
        include:
          - context: gawk-server
            dockerfile: gawk-server/deploy/Dockerfile
          - context: gawk-app
            dockerfile: gawk-app/deploy/Dockerfile
          # R28: the build context is the REPO ROOT, not the module dir —
          # gawk-telemetry consumes gawk-server/wire through a local `replace`
          # (docs/33 D12), so the relay module's tree must be present.
          - context: .
            dockerfile: gawk-telemetry/deploy/Dockerfile
    steps:
      - uses: actions/checkout@v7
      # Host networking on both levels: the ioio-k8s pod network MTU is 1480
      # and buildkit's default bridged networks assume 1500 — large downloads
      # inside RUN steps black-hole otherwise.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [worker.oci]
              networkMode = "host"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          # Distinct scope per image or the two builds evict each other.
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}
