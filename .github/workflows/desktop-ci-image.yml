# Publishes ghcr.io/tuhis/gawk-desktop-ci, the prebuilt ubuntu:24.04 toolchain
# broadcast-desktop.yml's Linux jobs build with, in two forms: the container
# image (`latest`) and the runner image of the ioio-k8s-desktop scale set
# (`runner-*`). What is in them and why:
# .github/actions/linux-container-setup/Dockerfile. Why a stale or missing
# copy cannot break a build: that action's header.
#
# Not part of the release train: the image is CI plumbing, never shipped, so it
# is tagged by commit and `latest`, not by version, and release-please does
# not know about it.
#
# THE PACKAGE MUST BE PUBLIC. A container job pulls its image before any step
# runs, without credentials, so a private package fails every desktop job at
# "Initialize containers". GHCR creates a package private on its first push
# and has no API to change that — flip it once in the package settings, as
# was done for every other ghcr.io/tuhis image.
name: desktop-ci-image

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/linux-container-setup/**"
      - "gawk-broadcast-desktop/rust-toolchain.toml"
      - ".github/workflows/desktop-ci-image.yml"
  # Build without pushing, so a broken Dockerfile is a red PR rather than a
  # red main.
  pull_request:
    paths:
      - ".github/actions/linux-container-setup/**"
      - "gawk-broadcast-desktop/rust-toolchain.toml"
      - ".github/workflows/desktop-ci-image.yml"
  # Weekly, for the Ubuntu point updates the per-job `apt-get install` used to
  # pick up for free. Nothing breaks without it; the image just ages.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      # Host networking and the in-cluster registry mirror — see the action.
      - uses: ./.github/actions/setup-buildx
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/actions/linux-container-setup/Dockerfile
          # Pushing is the `push=` in `outputs`, not the action's `push:` input,
          # which would add a second output (--push) alongside this one.
          # zstd layers, not gzip. Every desktop job unpacks the whole image
          # into its pod's fresh dind, one layer at a time on one core: through
          # the in-cluster cache the gzip download took ~7 s and the unpack
          # ~36 s (gawk run 36924378225, `test`). zstd decompresses several
          # times faster; dockerd, zot and GHCR all take OCI zstd layers.
          # `force-compression` re-compresses the ubuntu:24.04 base layer too.
          target: ci
          outputs: type=image,push=${{ env.PUSH }},oci-mediatypes=true,compression=zstd,compression-level=6,force-compression=true
          tags: |
            ghcr.io/tuhis/gawk-desktop-ci:latest
            ghcr.io/tuhis/gawk-desktop-ci:${{ github.sha }}
      # The `runner` stage: the image the ioio-k8s-desktop scale set runs as
      # its runner pods (the Dockerfile says why). Same package, `runner-`
      # tags. The timestamp tag is what ioio's Flux image policy pins and
      # bumps (ioio clusters/baremetal/actions-runners/image-update.yaml),
      # exactly as it does for ghcr.io/tuhis/actions-runner; kubelet pulls a
      # new tag once per node. gzip, not zstd: containerd on the nodes
      # unpacks it once per tag, not once per job, and gzip is the format
      # every containerd takes.
      - name: Runner image tag
        id: stamp
        run: echo "ts=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/actions/linux-container-setup/Dockerfile
          target: runner
          outputs: type=image,push=${{ env.PUSH }},oci-mediatypes=true
          tags: |
            ghcr.io/tuhis/gawk-desktop-ci:runner-latest
            ghcr.io/tuhis/gawk-desktop-ci:runner-${{ steps.stamp.outputs.ts }}
      # The desktop jobs pull through the in-cluster registry cache (see
      # broadcast-desktop.yml, "THE LINUX CONTAINER"). zot re-syncs a moved tag
      # on the first request for it, blocking that request for as long as the
      # whole image takes to fetch — so make this job that first request,
      # instead of the next desktop job. Advisory: the hourly warmer in ioio
      # would get there anyway, and outside the cluster the host does not
      # resolve.
      - name: Warm the in-cluster registry cache
        if: env.PUSH == 'true'
        run: |
          mirror=registry-cache.actions-runners.svc.cluster.local
          if ! getent hosts "$mirror" >/dev/null; then
            echo "No in-cluster registry cache here; nothing to warm."
            exit 0
          fi
          out=$(curl -s -o /dev/null -I --max-time 600 -w '%{http_code} %{time_total}s' \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' \
            "http://$mirror:5000/v2/tuhis/gawk-desktop-ci/manifests/latest" || true)
          echo "registry cache: $out"
