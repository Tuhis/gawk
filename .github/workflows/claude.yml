name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Two gates, both required:
    #  1. the text mentions @claude
    #  2. the author has write access to this repo.
    # author_association is computed by GitHub and cannot be spoofed; only
    # OWNER / MEMBER / COLLABORATOR imply write access. Without this gate any
    # GitHub user could open an issue or comment "@claude" on a fork PR and
    # spend this repo's runner minutes and Claude quota.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && (
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event_name == 'issue_comment' && github.event.comment.author_association
          || github.event_name == 'pull_request_review_comment' && github.event.comment.author_association
          || github.event_name == 'pull_request_review' && github.event.review.author_association
          || github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        # Pinned to main for Claude Code 2.1.280: the v1 tag still installs 2.1.278,
        # which the API rejects for --model claude-opus-5-5 (400
        # claude_code_version_too_old). Return to @v1 once a release ships 2.1.280+.
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'
          # Read-only allowlist mirroring the code-review plugin's gh commands, plus
          # inline PR comments. No build/test commands: those would run PR code
          # with the bot's token, and github_ci already exposes CI results.
          claude_args: '--model claude-opus-5-5 --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),mcp__github_inline_comment__create_inline_comment"'
