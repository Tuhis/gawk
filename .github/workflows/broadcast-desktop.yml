# R34 native Windows broadcaster (docs/38 D18).
#
# The workspace was renamed gawk-broadcast-windows/ -> gawk-broadcast-desktop/
# in R52 MB0 (docs/54 D2), ahead of the macOS binary joining it; so was this
# file. `lint`, `test`, `build` and `attach-release` build the Windows
# distribution — the `gawk-broadcast-windows-*` artifact, asset and manifest
# names are distribution names and deliberately did not change. `macos` (R52
# MB1, docs/54 D15) is the macOS distribution, and the one job here that runs
# on a GitHub-hosted runner.
#
# Runs on the SELF-HOSTED Linux runners, cross-compiling to
# x86_64-pc-windows-msvc with cargo-xwin. The component is Windows-only; the
# CI for it does not have to be, and the reasons it used to be no longer hold:
#
#  * Tests: `cargo test --workspace` is all passing / 5 ignored (the real-relay integration suite) on
#    Linux — identical to a Windows run. The only Windows-exclusive tests are
#    the three WARP ones in crates/capture/tests/warp.rs, and those already
#    self-skipped on windows-latest (docs/38 F-6: the hosted runner's WARP has
#    no D3D11 video), so the paid runner was contributing no unique test signal.
#  * Lints: `clippy --target x86_64-pc-windows-msvc` type-checks every
#    cfg(windows) block — the Media Foundation encoder, the WGC capture path,
#    the WASAPI loopback — exactly as a Windows host would.
#  * The artifact: cargo-xwin links a real msvc-ABI PE32+ binary, so R14's
#    artifact-as-verification pattern survives intact. CI structurally cannot
#    see a GPU, a hardware encoder or an interactive desktop, so a build a
#    human can run on real hardware must be available before merge, not after.
#
# What moving OFF windows-latest bought, beyond the paid minutes (a private
# repo bills Windows at 2x, and the job was ~34 min):
#
#  * The path filter no longer has to be miserly. gawk-server/wire is now a
#    trigger, closing the blind spot D18 accepted: a wire change used to leave
#    this mirror unexercised until a gawk-broadcast-windows/ commit followed.
#  * The relay integration tests gain the cfg(unix) drain-restart case, which
#    self-skipped on Windows.
#
# What it costs, and what therefore still belongs on the on-hardware register:
# the three WARP conversion tests, and anything about the msvc-vs-mingw or
# clang-cl-vs-cl code generation of the shipped binary. The EXE this job
# uploads is msvc-ABI but clang-built — see BUILD-INFO.txt.
#
# ---------------------------------------------------------------------------
# THREE JOBS, NOT ONE (2026-08-01)
#
# This was a single serial job of ~19 min. Nothing in it forced that sequence:
# no step consumed a previous step's output, and the only couplings were the
# two `rm -rf` reclaims that existed to keep three build trees from
# co-existing in a 4Gi RAM-backed volume. Splitting on the tree boundary
# removes the coupling and the serialisation at the same time. Measured
# per-step, from run 30667766932:
#
#     Clippy (Windows target)  4:02  ─┐ lint  6:04
#     Clippy (host)            2:02  ─┘
#     Test                     2:25  ─┐ test  5:22
#     Integration              2:57  ─┘
#     Build (release)          7:03  ─── build 7:03
#                             ─────
#     serial total            18:47   →  critical path ~7:15
#
# Nothing is recompiled that was not already recompiled: the old job built the
# msvc dependency set twice anyway (dev for the cross clippy, release for the
# artifact) and deleted the first tree in between, so `lint` and `build`
# shared nothing to begin with. `test` re-does the host dependency build that
# `lint` also does — that is the one duplication the split adds, and it is
# ~1:24 of a job that has ~1:40 of slack against the critical path.
#
# Each pod now builds ONE tree instead of three, so the peak footprint in the
# RAM-backed _work volume is lower than before, not higher. CARGO_PROFILE_DEV_
# DEBUG=0 and the msvc reclaim in `lint` are kept for that reason — the
# headroom they buy is what makes it safe to leave the runner's 4Gi emptyDir
# and 2Gi memory request alone while tripling the number of concurrent pods.
#
# Cost to weigh: three pool slots at once. ci.yml already fans ten jobs into
# the same min-7/max-10 warm pool with no path filters, so a PR touching this
# component can queue for a few minutes behind it. That is bounded by ci.yml's
# own 3-4 min runtime and is a much smaller number than the 11:32 this saves.
#
# RENAMING A JOB HERE IS A BREAKING CHANGE — grep `needs:` first.
#
# The split above renamed the single `broadcast-windows` job, and #218 had
# landed `attach-release: needs: broadcast-windows` forty minutes earlier. Both
# PRs were green: #218's base still had the one job, #217's base had no
# attach-release, and neither branch was re-tested against the other's merged
# state. The broken combination therefore first ran on main, on the release
# commit — and an unresolvable `needs:` is not a failing job, it is a workflow
# that does not load: zero jobs, no logs, no annotation, the run labelled
# `.github/workflows/broadcast-windows.yml` instead of `broadcast-windows`
# because GitHub falls back to the path when it cannot parse the file. lint,
# test and build never ran either. gawk-broadcast-windows-v1.1.0 was published
# with no binary attached as a direct result.
#
# Nothing inside this file could have caught that: each branch was internally
# consistent. The gate that catches it is the repository's, "Require branches
# to be up to date before merging" on main, which forces the second PR to
# re-run against the first. If that setting is off, two concurrently-open PRs
# touching this workflow need a deliberate re-run of the second before merge.
# ---------------------------------------------------------------------------
#
# The toolchain lives in the runner image, NOT here — see
# .github/actions/rust-windows-preflight, which every job below runs first.
# These jobs install nothing and cache nothing, deliberately. actions/cache
# would lose anyway: restore on these runners runs at ~6 MB/s and _work is
# RAM-backed (a 747MB restore has already caused a mid-build ENOSPC, ci.yml's
# tidy job documents it), so the target dir, the registry and the MSVC SDK all
# cost more to restore than to rebuild or refetch. Re-measure before adding
# one — and if you do, measure against in-cluster storage rather than GitHub's
# cache CDN, because 93% of the compile time here is third-party dependencies
# (660 units, 830 CPU-seconds, of which this workspace's own six crates are
# 59s) and that is the only part worth caching.
#
# Sequencing, the one real trap: a change to the runner image only reaches
# these jobs after build-runner-image runs in ioio AND Flux rolls the scale
# set over. The preflight action is what turns that ordering mistake into a
# two-second failure with instructions.
name: broadcast-desktop

on:
  push:
    branches: [main]
    paths:
      - "gawk-broadcast-desktop/**"
      - "gawk-server/wire/**"
      # R44 (docs/53 D7/D8): the EXE links assets/icon/gawk.res and the
      # build job verifies the resource landed with tools/icon.
      - "assets/icon/**"
      - "tools/icon/**"
      # R52 (docs/54 D15): the macOS bundle's Info.plist, entitlements and
      # assembly script.
      - "tools/macos/**"
      - ".github/actions/rust-windows-preflight/**"
      - ".github/actions/coverage/**"
      - ".github/actions/publish-coverage-badges/**"
      - "tools/coverage/**"
      - "coverage-floors.json"
      - ".github/workflows/broadcast-desktop.yml"
  pull_request:
    paths:
      - "gawk-broadcast-desktop/**"
      - "gawk-server/wire/**"
      # R44 (docs/53 D7/D8): the EXE links assets/icon/gawk.res and the
      # build job verifies the resource landed with tools/icon.
      - "assets/icon/**"
      - "tools/icon/**"
      # R52 (docs/54 D15): the macOS bundle's Info.plist, entitlements and
      # assembly script.
      - "tools/macos/**"
      - ".github/actions/rust-windows-preflight/**"
      - ".github/actions/coverage/**"
      - ".github/actions/publish-coverage-badges/**"
      - "tools/coverage/**"
      - "coverage-floors.json"
      - ".github/workflows/broadcast-desktop.yml"
  # The recovery path this workflow lacked. attach-release-assets already
  # tolerates re-running an upload ("the whole recovery path if the upload half
  # ever breaks"), but re-running is not available when the BUILD half is what
  # failed: a re-run replays the workflow file as of that commit, which for
  # v1.1.0 is the file that would not load. Dispatching runs the file as of the
  # ref you dispatch from — a fixed one — against the source you name.
  workflow_dispatch:
    inputs:
      attach_to:
        description: >-
          Backfill. Ref or SHA of an already-released commit whose release
          assets were missed. Everything is built FROM that commit and attached
          to its release. Leave empty for an ordinary on-demand run, which
          builds the current ref and attaches nothing.
        required: false
        default: ""

permissions:
  contents: read

# Cancel superseded PR runs; never cancel main. The runners are free now, but
# they are finite pods — a queue of stale runs still delays real ones, and
# this workflow now claims three slots per run rather than one.
concurrency:
  group: broadcast-desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The vendored libopus (gawk-audio → opus → audiopus_sys) carries a
  # CMakeLists older than CMake 4's floor; this is CMake's own escape hatch.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  # The runner's _work volume is a 4Gi RAM-backed emptyDir (ioio
  # actions-runners/gawk.yaml) and it holds the checkout, the Go caches and
  # the build tree together. Debug info is the bulk of a debug tree and
  # nothing here consumes it — no debugger, no symbolised backtrace is
  # asserted on — so turning it off is free headroom. Still set after the
  # three-way split: the split lowered the peak, it did not raise the cap.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Cargo turns incremental compilation on for dev profiles by default. These
  # pods are ephemeral — the incremental cache is written on every run and
  # read on none of them, so it is pure cost in both time and tmpfs. It only
  # ever applied to this workspace's own crates (cargo never uses incremental
  # for registry dependencies), so the win is small; it is simply free.
  CARGO_INCREMENTAL: "0"

# Runner pool: `runs-on` reads RUNNER_LABEL, falling back to `ubuntu-latest`
# in a fork that has no such variable. Why: ci.yml's header.

jobs:
  # Both clippy passes, because neither alone covers the tree. The msvc one is
  # the port of what the Windows runner did: it is the pass that lints every
  # cfg(windows) block. The host one covers what that pass cannot see — the
  # cfg(unix) code, which no Windows runner ever linted.
  lint:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: gawk-broadcast-desktop
    steps:
      # `inputs.attach_to` is empty on push and pull_request, so this is the
      # ordinary checkout in every case but a backfill. A backfill lints, tests
      # AND builds the commit it is attaching to, rather than trusting that
      # today's tree still matches what was released.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.attach_to || github.sha }}
      - uses: ./.github/actions/rust-windows-preflight

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (Windows target)
        run: cargo xwin clippy --all-targets --target "$WINDOWS_TARGET" -- -D warnings

      # This job holds two trees, so the reclaim survives the split. Nothing
      # after this reads the msvc tree and the pod is fresh every run, so
      # there is no cache to spoil. `df` is logged so that if this ever fails
      # again the headroom is in the log instead of being guessed at.
      - name: Reclaim the msvc debug tree
        run: |
          du -sh "target/$WINDOWS_TARGET/debug" 2>/dev/null || true
          rm -rf "target/$WINDOWS_TARGET/debug"
          df -h /home/runner/_work | tail -1

      - name: Clippy (host)
        run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: gawk-broadcast-desktop
    env:
      # Link the host artifacts with lld instead of the default bfd: this job
      # links a test binary per crate, each pulling the whole dependency graph.
      #
      # Job-scoped, NOT workflow-scoped, and that distinction cost a run to
      # find (30688980949). Cargo does not apply target rustflags to host
      # artifacts when cross-compiling, but does when building for the host —
      # so with this set workflow-wide, `lint`'s two passes disagreed about the
      # flags on every proc-macro and build-script unit. The cross clippy built
      # 107 of them (autocfg, cc, cmake, the derive macros) with no flags, the
      # host clippy then rebuilt every one: 367 units became 481 and the step
      # went 2:02 -> 2:58. `lint` runs no linker at all — clippy only checks —
      # so it was paying that for nothing.
      #
      # Scoped to the host triple rather than a bare RUSTFLAGS because the
      # latter would also reach msvc units, where `-fuse-ld=lld` is a
      # clang-driver flag lld-link does not accept. `build` is unaffected
      # either way and is deliberately left out of this.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      # `inputs.attach_to` is empty on push and pull_request, so this is the
      # ordinary checkout in every case but a backfill. A backfill lints, tests
      # AND builds the commit it is attaching to, rather than trusting that
      # today's tree still matches what was released.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.attach_to || github.sha }}
      - uses: ./.github/actions/rust-windows-preflight

      # R41 (docs/43): coverage for the Rust workspace. A prebuilt binary
      # pinned by version and fetched from its release, exactly as the
      # `licenses` job in ci.yml installs cargo-deny and for the same reason —
      # `cargo install` would compile it on every run. Into RUNNER_TEMP because
      # the self-hosted runner pods are not root.
      #
      # llvm-tools-preview is added rather than assumed: the runner image bakes
      # a system LLVM for the clang-cl cross path, but cargo-llvm-cov needs the
      # llvm-profdata that MATCHES rustc's LLVM, and a version skew there
      # produces an unreadable profile rather than an error.
      - name: Install cargo-llvm-cov
        env:
          CARGO_LLVM_COV_VERSION: "0.9.0"
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${CARGO_LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/bin" cargo-llvm-cov
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          rustup component add llvm-tools-preview
          "${RUNNER_TEMP}/bin/cargo-llvm-cov" llvm-cov --version

      # Wire golden vectors, chunking, strict-parse rejections, GF(256)
      # parity, engine defaults, the encoder cascade policy, the SPS parser —
      # all headless and all portable, which is why they run here unchanged.
      # The three cfg(windows) WARP tests compile away; they were already
      # skipping on the hosted Windows runner (docs/38 F-6) and remain on the
      # on-hardware register.
      #
      # `--no-report` here and on the integration step, with one `report` at
      # the end: the two steps run different test binaries over the same crates,
      # and reporting per step would publish whichever ran last instead of what
      # the job as a whole covered. The instrumented build replaces the plain
      # one rather than adding to it — same compilation, different RUSTFLAGS.
      - name: Test
        run: cargo llvm-cov --workspace --no-report

      # See the server job in ci.yml — these tests run QUIC over loopback too.
      - name: Ensure UDP buffer limits for quic-go
        run: |
          need=7340032
          if [ "$(sysctl -n net.core.rmem_max)" -lt "$need" ] || [ "$(sysctl -n net.core.wmem_max)" -lt "$need" ]; then
            sudo sysctl -w net.core.rmem_max="$need" net.core.wmem_max="$need"
          fi

      # WB2 integration: the engine against the REAL gawk-server binary —
      # "a hand-written fake would only assert the engine against our belief
      # about the relay, which is the belief most worth doubting in a second
      # implementation of a protocol" (docs/38 D18). Serialized: each test
      # runs its own relay. On Linux this now also runs the drain-restart
      # test, which is cfg(unix) and self-skipped on the old Windows job.
      #
      # No setup-go step: the runner image bakes Go on PATH (its Dockerfile
      # says so explicitly, and notes that setup-go resolves through the tool
      # cache only and never sees that copy). setup-go would pull the 63MiB
      # toolchain and unpack ~250MB into the RAM-backed _work volume, which
      # dies with the ephemeral pod and is never reused even once. The baked
      # Go satisfies gawk-server/go.mod's `go 1.26.0` directive; if a module
      # ever asks for newer, GOTOOLCHAIN=auto fetches it per-job.
      #
      # Worth knowing before optimising this step: ~130s of its ~150s runtime
      # is inside the FIRST test, which shells out to a cold `go build` of
      # gawk-server (whose internal/cluster imports k8s.io/client-go, so the
      # module fetch is large). Tests 2-4 finish ~6s apart off Go's now-warm
      # build cache. Moving that build earlier saves nothing — it is paid once
      # either way. Only a warm GOMODCACHE/GOCACHE would, and the place to put
      # one is the runner image, not actions/cache.
      - name: Integration — publish, reject, resume, supersede vs the real relay
        run: cargo llvm-cov --no-report -p gawk-engine --test relay_integration -- --ignored --test-threads=1

      # One report over both tiers. --summary-only drops the per-file arrays:
      # the badge needs the totals, and the full export of this workspace is
      # megabytes of JSON to hand to an artifact nothing reads.
      - name: Coverage report
        run: cargo llvm-cov report --summary-only --json --output-path coverage-llvm.json
      # The runner's _work is a 4 GiB memory-backed tmpfs (ioio runner spec),
      # and the llvm-cov-instrumented target tree plus the relay Go build the
      # integration tier makes fill it once the workspace is R42-sized: the
      # coverage action then dies installing its Python into the tool cache
      # with ENOSPC (runs 33864313980, 33890068024). The report above is the
      # only thing the action needs, so the tree goes before it runs — the
      # same reclaim the lint job does for the msvc debug tree.
      - name: Reclaim the instrumented target tree
        run: |
          du -sh target 2>/dev/null || true
          rm -rf target
          df -h /home/runner/_work | tail -1
      - uses: ./.github/actions/coverage
        with:
          format: llvm-cov
          report: gawk-broadcast-desktop/coverage-llvm.json
          component: gawk-broadcast-desktop
          label: broadcast-desktop

  build:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # Resolved rather than echoed back: `attach_to` may be a tag or a branch,
    # and the gate compares commit SHAs. This is also the single fact that ties
    # the artifact, the gate and the thing actually compiled together — they
    # all derive from one `git rev-parse` of the tree that was checked out.
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    defaults:
      run:
        working-directory: gawk-broadcast-desktop
    steps:
      # `inputs.attach_to` is empty on push and pull_request, so this is the
      # ordinary checkout in every case but a backfill. A backfill lints, tests
      # AND builds the commit it is attaching to, rather than trusting that
      # today's tree still matches what was released.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.attach_to || github.sha }}
      - uses: ./.github/actions/rust-windows-preflight

      - name: Resolve the commit being built
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The critical path. ~4:31 of this is the third-party dependency set and
      # ~2:13 is a single serial tail — the app crate's codegen plus thin LTO
      # plus the link. Dropping `lto = "thin"` shortens that tail but was
      # measured to cost ~12% MORE total CPU (874 vs 781 CPU-seconds), which
      # is the wrong trade on a shared runner, and it would change the bytes
      # BUILD-INFO.txt asks testers to report codegen differences against.
      # -p: the workspace also holds the macOS shell (R52), which off macOS
      # is a stub binary nobody ships. Naming the package also pins feature
      # unification to exactly the EXE's own graph.
      - name: Build (release)
        run: cargo xwin build --release --target "$WINDOWS_TARGET" -p gawk-broadcast-app-windows

      # R44 (docs/53 D8): the icon reaches Explorer through a .res that
      # build.rs hands the linker as a plain input — no resource compiler in
      # the cross toolchain. A linker that silently dropped it would leave
      # the EXE looking exactly like before, so ask the binary: walk its
      # resource directory and require RT_GROUP_ICON + RT_ICON. `go -C`
      # because this directory is not a Go module and tools/icon is.
      - name: The EXE carries the icon resource
        run: go -C ../tools/icon run . verify-exe "$PWD/target/${WINDOWS_TARGET}/release/gawk-broadcast.exe"

      - name: Assemble artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${WINDOWS_TARGET}/release/gawk-broadcast.exe" dist/
          # THIRD-PARTY-NOTICES.md discharges the attribution obligations of
          # everything statically linked into the .exe (373 crates incl.
          # libopus); LICENSE is the repo root's (working-directory is
          # gawk-broadcast-desktop). Both ride to the release page via the
          # attach job's explicit cp list — keep the two lists in step.
          cp README.md THIRD-PARTY-NOTICES.md ../LICENSE dist/
          {
            echo "gawk-broadcast-windows (R34, docs/38)"
            # The commit COMPILED, which on a backfill is not github.sha —
            # that would name the ref the run was dispatched from and quietly
            # misattribute the binary. This is provenance; it has to be true.
            echo "commit:    ${{ steps.source.outputs.sha }}"
            echo "ref:       ${{ inputs.attach_to || github.ref }}"
            echo "built:     $(date -Iseconds)"
            echo "toolchain: $(rustc --version)"
            echo "target:    ${WINDOWS_TARGET}"
            # Provenance a tester needs, because it is not what they would
            # assume from a .exe: this binary is cross-compiled on Linux with
            # clang-cl via cargo-xwin, not built by MSVC on Windows. It is the
            # msvc ABI, but the code generator is clang, and the bundled
            # libopus assumes an SSE4.1 floor (see the clang-cl shim in the
            # runner image). Report anything that smells like a codegen
            # difference against this line.
            echo "built-by:  cross-compiled on Linux ($(cargo xwin --version), $(clang --version | head -1))"
            echo "libopus:   compiled with an SSE4.1 floor (no runtime SIMD dispatch)"
          } > dist/BUILD-INFO.txt
          cat dist/BUILD-INFO.txt

      # R14's artifact-as-verification pattern: available before merge,
      # if-no-files-found is an error because a missing artifact means the
      # verification path itself broke.
      - uses: actions/upload-artifact@v7
        with:
          # Keyed by the commit built, which equals github.sha on every run but
          # a backfill. attach-release downloads it by needs.build.outputs.sha.
          name: gawk-broadcast-windows-x86_64-${{ steps.source.outputs.sha }}
          path: gawk-broadcast-desktop/dist/
          retention-days: 1
          if-no-files-found: error

  # R52 MB1 (docs/54 D15): the macOS distribution, on GitHub-hosted
  # `macos-latest` (Apple Silicon) — the one deliberate exception to docs/38
  # D18's "everything on the self-hosted Linux runners". Free on a public
  # repository, and it has the SDK, codesign and notarytool natively;
  # cross-compiling instead would mean extracting MacOSX.sdk onto Linux,
  # whose licence restricts it to Apple hardware.
  #
  # Host = Darwin, so this job's clippy is what type-checks every
  # cfg(target_os = "macos") block — the analogue of `lint`'s xwin pass. The
  # portable crates are tested here AND on Linux; coverage is measured on
  # Linux only (docs/54 D14: one floor, one source of truth).
  #
  # Nothing is cached, for now: unlike the self-hosted pods, a hosted runner
  # restores from GitHub's cache CDN at full speed, so actions/cache may well
  # pay here. Measure a few runs first (docs/38 D18's rule for this workflow).
  #
  # PR builds are ad-hoc signed and say so in BUILD-INFO.txt. Developer ID
  # signing and notarization arrive with the release path (MB7, docs/54 D13),
  # and only ever on push to main — a pull_request run must never see the
  # signing secrets.
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: gawk-broadcast-desktop
    env:
      # Whether Developer ID signing is configured at all (docs/54 D13) —
      # `secrets` cannot appear in a step's `if`, a job env can.
      SIGNING_CONFIGURED: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12 != '' }}
    steps:
      # See `lint`: a backfill builds the commit it is attaching to.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.attach_to || github.sha }}

      # The relay integration suite shells out to `go build` of gawk-server,
      # and the hosted image's Go predates gawk-server/go.mod's floor.
      - uses: actions/setup-go@v7
        with:
          go-version-file: gawk-server/go.mod
          cache-dependency-path: gawk-server/go.sum

      - name: Resolve the commit being built
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # rust-toolchain.toml pins the compiler; the hosted image's rustup
      # installs it (with rustfmt and clippy) on first use. Printed so the
      # log names the compiler that built the artifact.
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
          echo "macOS $(sw_vers -productVersion), SDK $(xcrun --show-sdk-version)"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (Darwin)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # docs/54 MB1: "wtransport works on macOS" is a claim the transport
      # gates should prove, not the crate's README. The same suite `test`
      # runs on Linux — Origin honoured by an allowlisting relay, rejection
      # status and close code visible, kill-and-restart resume — against the
      # real gawk-server binary, built on this runner.
      - name: Integration — publish, reject, resume, supersede vs the real relay
        run: cargo test -p gawk-engine --test relay_integration -- --ignored --test-threads=1

      - name: Build (release)
        run: cargo build --release --target aarch64-apple-darwin -p gawk-broadcast-app-macos

      # docs/54 D13: Developer ID signing and notarization, from repository
      # secrets referenced by name only — never echoed, and the identity name
      # is discovered from the imported keychain, never written down. Never
      # on pull_request (PRs never sign, #218's posture); only when the
      # secrets exist, so a repository without them keeps building ad-hoc
      # bundles (and says so) instead of failing every push. The release
      # attach below refuses an unsigned bundle once they do exist.
      - name: Import the signing identity
        id: signing
        if: github.event_name != 'pull_request' && env.SIGNING_CONFIGURED == 'true'
        env:
          P12: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(uuidgen)"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # The quoted name of the first Developer ID Application identity —
          # into an output, not the log.
          identity=$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$identity" ]; then
            echo "::error::the imported certificate holds no Developer ID Application identity"
            exit 1
          fi
          echo "::add-mask::$identity"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Bundle (Developer ID when imported, else ad-hoc)
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: ../tools/macos/bundle.sh target/aarch64-apple-darwin/release/gawk-broadcast-macos bundle

      # Notarize with an App Store Connect API key (D13: no Apple ID or
      # address anywhere), staple the ticket so Gatekeeper's check works
      # offline, and prove both with the tools a downloader's Mac uses.
      - name: Notarize and staple
        if: steps.signing.outputs.identity != ''
        env:
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          for v in KEY_ID ISSUER KEY_P8; do
            if [ -z "${!v}" ]; then
              echo "::error::signing is configured but the notarization secret for $v is missing (docs/54 D13)"
              exit 1
            fi
          done
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$KEY_P8" > "$key"
          ditto -c -k --keepParent bundle/gawk-broadcast-macos.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$key" --key-id "$KEY_ID" --issuer "$ISSUER" --wait --timeout 20m
          rm -f "$key"
          xcrun stapler staple bundle/gawk-broadcast-macos.app
          codesign --verify --deep --strict bundle/gawk-broadcast-macos.app
          spctl --assess --type execute --verbose bundle/gawk-broadcast-macos.app

      # The bundle rides zipped by `ditto`, not as a directory: upload-artifact
      # drops the executable bit, and a bundle whose binary is not executable
      # does not launch. ditto also keeps the signature's extended attributes.
      - name: Assemble artifact
        env:
          SIGNED: ${{ steps.signing.outputs.identity != '' }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --keepParent bundle/gawk-broadcast-macos.app dist/gawk-broadcast-macos.app.zip
          # The bundle's own notices (the aarch64-apple-darwin graph), next to
          # it the way the EXE's ride next to the EXE.
          cp README.md THIRD-PARTY-NOTICES-macos.md ../LICENSE dist/
          {
            echo "gawk-broadcast-macos (R52, docs/54)"
            echo "commit:    ${{ steps.source.outputs.sha }}"
            echo "ref:       ${{ inputs.attach_to || github.ref }}"
            echo "built:     $(date -Iseconds)"
            echo "toolchain: $(rustc --version)"
            echo "target:    aarch64-apple-darwin"
            echo "built-by:  GitHub-hosted macos-latest (macOS $(sw_vers -productVersion), SDK $(xcrun --show-sdk-version))"
            # docs/54 D13. The attach job reads this line: a release only ever
            # carries the Developer ID one. For an ad-hoc build, a tester
            # opens it once via System Settings → Privacy & Security → Open
            # Anyway, and any permission it is granted dies with the build.
            if [ "$SIGNED" = "true" ]; then
              echo "signed:    Developer ID + notarized (stapled)"
            else
              echo "signed:    ad-hoc — not Developer ID, not notarized"
            fi
          } > dist/BUILD-INFO.txt
          cat dist/BUILD-INFO.txt
          ls -l dist

      # R14's artifact-as-verification pattern, as `build` does for the EXE,
      # and the bytes attach-release puts on the release page. A week rather
      # than a day: the on-hardware passes it also exists for are human-paced.
      - uses: actions/upload-artifact@v7
        with:
          name: gawk-broadcast-macos-${{ steps.source.outputs.sha }}
          path: gawk-broadcast-desktop/dist/
          retention-days: 7
          if-no-files-found: error

  # The Windows half of the release-assets story; the Linux one is
  # attach-broadcast-release in ci.yml, and the reasoning for both lives in
  # .github/actions/attach-release-assets. No rebuild — the artifact `build`
  # just produced is already the --release EXE, and on a release-PR merge
  # this run and release-please.yml's are the same commit.
  #
  # This workflow is path-filtered, which works out exactly right: a release
  # that bumps this component necessarily touches gawk-broadcast-desktop/
  # (its CHANGELOG.md and Cargo.toml), so the job runs precisely when there is
  # something to attach.
  #
  # `needs` is all three jobs, not just `build`, and that is deliberate. This
  # read `needs: broadcast-windows` when the workflow was a single job, which
  # meant "lint, test AND build passed" — only `build` produces the artifact,
  # but a green release asset must not be published off a red test run. When
  # the three-way split renamed that job, this reference was left pointing at
  # a job that no longer existed; see the incident note above `jobs:`.
  #
  # A dispatch WITHOUT attach_to deliberately skips this: an on-demand build is
  # for looking at a binary, not for touching a release.
  #
  # Never on pull_request, which is the security posture #218 chose and this
  # keeps: the job holds `contents: write` and `uses:` an action from the tree
  # it checks out, so on a PR it would run a contributor's own code with a
  # write token. workflow_dispatch does not reopen that — dispatching requires
  # write access to the repository, and the action still comes from the
  # dispatched ref rather than from `attach_to`. The event is named explicitly
  # in the second clause rather than leaning on `inputs` being empty outside a
  # dispatch: that is true, but it is a coercion rule, and this is not a place
  # to be clever about falsiness.
  attach-release:
    # `macos` is a soft dependency (R52, docs/54 D13): the Windows release
    # needs lint, test and build green and waits for nothing else — not a
    # macOS flake, not hosted-image drift, not a backfill of a commit older
    # than the macOS bundle. `!cancelled()` is what lets this job run when
    # `macos` failed; the three hard dependencies are then checked by hand.
    needs: [lint, test, build, macos]
    if: >-
      !cancelled() &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.attach_to != ''))
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      # Deliberately NOT `ref: attach_to`, unlike every other job here. This is
      # the one job that runs the composite action below, and a backfill exists
      # precisely because something at the target commit was broken — checking
      # it out would run the old, broken tooling to repair the damage the old,
      # broken tooling did. v1.1.0 is the live example: the action at that
      # commit has no `sha` input, so a backfill checked out there would
      # silently fall back to comparing against this run's commit and attach
      # nothing. The tooling comes from the dispatched ref; only the source
      # being built comes from the target.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: gawk-broadcast-windows-x86_64-${{ needs.build.outputs.sha }}
          path: staging
      # The macOS bundle (R52, docs/54 D14), built from the same commit —
      # when the macos job produced one.
      - uses: actions/download-artifact@v8
        if: needs.macos.result == 'success'
        with:
          name: gawk-broadcast-macos-${{ needs.build.outputs.sha }}
          path: staging-macos

      # ...with one exception: the manifest has to be the TARGET's, because the
      # gate resolves the tag from it and the version being backfilled is the
      # one that commit released, not the one main happens to be on now.
      # Sparse, because this is the only file wanted from that tree.
      - name: Read the manifest as of the commit being attached to
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          path: released
          sparse-checkout: .release-please-manifest.json
          sparse-checkout-cone-mode: false
      - name: Swap in that manifest, and show which one the gate will read
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          cp released/.release-please-manifest.json .release-please-manifest.json
          echo "manifest as of ${{ needs.build.outputs.sha }}:"
          cat .release-please-manifest.json
      - name: Package the release assets
        id: package
        env:
          MACOS_SIGNING: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12 != '' }}
          MACOS_BUILT: ${{ needs.macos.result == 'success' }}
        run: |
          set -euo pipefail
          # NOT `assets`: the repository root already has an `assets/`
          # directory (the icon source set, R44/docs/53), and a staging
          # directory that collides with a checked-out one is how
          # gawk-broadcast-windows v1.5.0 published with no EXE — `sha256sum
          # ./*` hit `assets/icon`, a directory, and the step died before the
          # upload. Keep this name outside anything the checkout can create.
          mkdir -p release-assets
          # No archive: a single .exe is the whole product (docs/38 D17), and
          # one file someone can click beats one they have to unpack. BUILD-INFO
          # rides alongside because this EXE is cross-compiled with
          # clang-cl rather than built by MSVC — provenance a tester would not
          # otherwise guess.
          cp staging/gawk-broadcast.exe release-assets/gawk-broadcast-windows-x86_64.exe
          # NOTICES/LICENSE alongside the .exe: the attribution obligations
          # attach to the distributed binary, so they must be assets a
          # downloader gets, not files that only live in the repo.
          cp staging/BUILD-INFO.txt staging/THIRD-PARTY-NOTICES.md staging/LICENSE release-assets/
          # The macOS bundle (docs/54 D13/D14). A release never carries an
          # unsigned one: with the signing secrets configured, a bundle that
          # is not Developer ID + notarized fails the attach loudly. Without
          # the secrets, or without a bundle (the macos job failed, or the
          # commit predates it), Windows attaches alone with a warning — it
          # never waits on Apple credentials or on the macOS job.
          if [ "$MACOS_BUILT" != "true" ]; then
            echo "::warning::the macOS bundle is not attached: the macos job did not succeed for this commit — backfill it with workflow_dispatch attach_to once it does"
          elif [ "$MACOS_SIGNING" = "true" ]; then
            if ! grep -q '^signed:    Developer ID + notarized' staging-macos/BUILD-INFO.txt; then
              echo "::error::signing is configured but the macOS bundle is not Developer ID + notarized — refusing to attach it (docs/54 D13)"
              cat staging-macos/BUILD-INFO.txt
              exit 1
            fi
            cp staging-macos/gawk-broadcast-macos.app.zip release-assets/gawk-broadcast-macos-arm64.zip
            cp staging-macos/BUILD-INFO.txt release-assets/BUILD-INFO-macos.txt
            cp staging-macos/THIRD-PARTY-NOTICES-macos.md release-assets/
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the macOS bundle is not attached: no Developer ID signing secrets are configured (docs/54 D13)"
          fi
          # Unsigned by design (docs/38 D17) — the checksum is the only
          # integrity check a downloader gets. Written outside the asset
          # directory and moved in, because whether a shell's `*` sees a file the same
          # command is redirecting into is not something to rely on.
          (cd release-assets && sha256sum ./* > ../SHA256SUMS)
          mv SHA256SUMS release-assets/
          ls -l release-assets
      - uses: ./.github/actions/attach-release-assets
        id: attach
        with:
          # The release-please component — the workspace, since R52 MB0. A
          # backfill of a release cut before the rename (whose manifest keys
          # `gawk-broadcast-windows`) fails loudly on "not a package" rather
          # than attaching anything: dispatch it from a pre-rename ref.
          component: gawk-broadcast-desktop
          dir: release-assets
          # Equals github.sha on every ordinary push, so this changes nothing
          # there. On a backfill it is the commit `build` compiled, and the gate
          # still refuses unless the component's tag points at exactly it.
          sha: ${{ needs.build.outputs.sha }}
      # R46 (docs/46): the "newest gawk-broadcast-windows" pointer the project
      # site's Download section reads. Only after a real attach — a manifest
      # for a release with no EXE on it would be a download button to a 404.
      #
      # Keyed by DISTRIBUTION, not by component (docs/54 D14): the version
      # comes from the desktop component, the path and the manifest's own
      # `component` field stay `gawk-broadcast-windows`, so the site card and
      # the URL R45 compiles in never move.
      - uses: ./.github/actions/publish-release-manifest
        if: steps.attach.outputs.attached == 'true'
        with:
          component: gawk-broadcast-desktop
          distribution: gawk-broadcast-windows
          dir: release-assets
          primary: gawk-broadcast-windows-x86_64.exe
          tag: ${{ steps.attach.outputs.tag }}
          published-at: ${{ steps.attach.outputs.published_at }}
          token: ${{ secrets.GITHUB_TOKEN }}
      # The second distribution of the same release (docs/54 D14): its own
      # manifest, which the site's macOS card and R45's macOS check read.
      - uses: ./.github/actions/publish-release-manifest
        if: steps.attach.outputs.attached == 'true' && steps.package.outputs.macos == 'true'
        with:
          component: gawk-broadcast-desktop
          distribution: gawk-broadcast-macos
          dir: release-assets
          primary: gawk-broadcast-macos-arm64.zip
          tag: ${{ steps.attach.outputs.tag }}
          published-at: ${{ steps.attach.outputs.published_at }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # R41 (docs/43): this component's half of the badges branch.
  #
  # It cannot ride ci.yml's writer — artifacts do not cross workflows, and this
  # workflow exists precisely because the Rust job's triggers are its own. The
  # writer merges rather than replaces, so the two publishing paths do not
  # fight over the other's numbers; the shared `concurrency` group keeps their
  # pushes from racing on a commit that triggers both.
  coverage-badges:
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
    concurrency:
      group: coverage-badges
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
          path: ${{ runner.temp }}/records
        continue-on-error: true
      - uses: ./.github/actions/publish-coverage-badges
        with:
          records-dir: ${{ runner.temp }}/records
          token: ${{ secrets.GITHUB_TOKEN }}
