# R65 iOS app (docs/67 D24). Two jobs on GitHub-hosted macOS runners, the
# same deliberate exception to docs/38 D18 that broadcast-desktop.yml's macOS
# jobs are: the iOS SDK and the Simulator exist only on Apple hardware.
#
# Both run on the `xcode-27` image, not `macos-latest`: GitHub's images are
# one per major Xcode, and `macos-latest` carried Xcode 26 only when this
# landed (2026-10-04). The image's Xcode 27.0 sits at a release-candidate
# path, so `Select Xcode` pins by the version `xcodebuild` reports, not by
# the app's file name.
#
# `rust`  — the core's host tests, the shared desktop crates' tests in the
#           iOS configuration (`self-update` off, docs/67 D4), a check that the
#           resolved graph really has it off, and both iOS cross-builds.
# `xcode` — XcodeGen, then the app built and its Swift tests run in an iOS 27
#           Simulator, plus an unsigned device build. Phase S needs no team
#           (OD14); signing belongs to the distribution milestone.
#
# Triggers follow the path dependencies (OD9): a change to a shared desktop
# crate or to the canonical wire runs this workflow as well as the desktop
# one, which in turn watches gawk-ios/rust/**.
name: ios

on:
  push:
    branches: [main]
    paths:
      - "gawk-ios/**"
      - "gawk-broadcast-desktop/crates/wire/**"
      - "gawk-broadcast-desktop/crates/engine/**"
      - "gawk-broadcast-desktop/crates/capture/**"
      - "gawk-broadcast-desktop/crates/encode/**"
      - "gawk-broadcast-desktop/crates/audio/**"
      - "gawk-broadcast-desktop/vendor/**"
      - "gawk-server/wire/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "gawk-ios/**"
      - "gawk-broadcast-desktop/crates/wire/**"
      - "gawk-broadcast-desktop/crates/engine/**"
      - "gawk-broadcast-desktop/crates/capture/**"
      - "gawk-broadcast-desktop/crates/encode/**"
      - "gawk-broadcast-desktop/crates/audio/**"
      - "gawk-broadcast-desktop/vendor/**"
      - "gawk-server/wire/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The vendored libopus (gawk-audio → opus → audiopus_sys) carries a
  # CMakeLists older than CMake 4's floor; this is CMake's own escape hatch.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # docs/67 D24: a pinned Xcode, never the image default, which can lag a
  # major version behind the iOS 27 SDK the app builds against (OD6).
  XCODE_VERSION: "27.0"

jobs:
  rust:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: gawk-ios/rust
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          for app in /Applications/Xcode*.app; do
            [ -L "$app" ] && continue
            v=$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version 2>/dev/null | awk 'NR==1 {print $2}')
            if [ "$v" = "$XCODE_VERSION" ]; then
              sudo xcode-select -s "$app"
              xcodebuild -version
              xcrun simctl list runtimes
              exit 0
            fi
          done
          echo "::error::no Xcode $XCODE_VERSION on this runner image; installed:"
          ls -d /Applications/Xcode*.app
          exit 1

      # The image is Xcode-first; rustup and CMake (for the vendored libopus)
      # are installed only when it lacks them.
      - name: Rust and CMake
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          command -v cmake >/dev/null || brew install cmake

      # rust-toolchain.toml pins the compiler and both iOS targets; rustup
      # installs them on first use.
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
          rustup target list --installed

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gawk-ios/rust
            gawk-broadcast-desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (host)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (iOS)
        run: cargo clippy --target aarch64-apple-ios -p gawk-core -- -D warnings

      - name: Test
        run: cargo test --workspace

      # docs/67 D4: App Store apps must not update themselves. Features unify
      # across the graph, so one dependency line that takes the engine's
      # default would quietly turn `self-update` back on; this reads the
      # graph the iOS targets actually resolve.
      - name: self-update is off on iOS
        run: |
          for t in aarch64-apple-ios aarch64-apple-ios-sim; do
            tree=$(cargo tree -p gawk-core --target "$t" -e features)
            if grep -E 'self-update|minisign' <<<"$tree"; then
              echo "::error::gawk-engine's self-update feature is on for $t (docs/67 D4)"
              exit 1
            fi
          done

      # The shared crates' own tests in the configuration the app links
      # (IO1's acceptance: "the iOS host tests pass with it off"). They are
      # path dependencies, not members, so they run from their workspace.
      - name: Test the shared crates with self-update off
        working-directory: gawk-broadcast-desktop
        run: cargo test -p gawk-wire -p gawk-engine --no-default-features

      - name: Build (device and simulator)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        run: |
          cargo build -p gawk-core --target aarch64-apple-ios
          cargo build -p gawk-core --target aarch64-apple-ios-sim

      # docs/67 D24: the viewer core against the real relay and gawk-pubsim,
      # through induced datagram loss and a rolling relay restart. Both Go
      # binaries are built once here and handed to the test.
      - uses: actions/setup-go@v7
        with:
          go-version-file: gawk-server/go.mod
          cache-dependency-path: |
            gawk-server/go.sum
            gawk-broadcast/go.sum

      - name: Build the relay, devcert and publisher simulator
        run: |
          bin="$RUNNER_TEMP/relay-bin"
          mkdir -p "$bin"
          go -C ../../gawk-server build -o "$bin/" ./cmd/gawk-server ./cmd/gawk-devcert
          go -C ../../gawk-broadcast build -o "$bin/" ./cmd/gawk-pubsim
          echo "GAWK_IT_RELAY_BIN_DIR=$bin" >> "$GITHUB_ENV"
          echo "GAWK_IT_PUBSIM_BIN=$bin/gawk-pubsim" >> "$GITHUB_ENV"

      - name: Integration — the viewer through loss and a relay restart
        run: cargo test -p gawk-viewer --test relay_viewer -- --ignored --test-threads=1

  xcode:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: gawk-ios/app
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          for app in /Applications/Xcode*.app; do
            [ -L "$app" ] && continue
            v=$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version 2>/dev/null | awk 'NR==1 {print $2}')
            if [ "$v" = "$XCODE_VERSION" ]; then
              sudo xcode-select -s "$app"
              xcodebuild -version
              xcrun simctl list runtimes
              exit 0
            fi
          done
          echo "::error::no Xcode $XCODE_VERSION on this runner image; installed:"
          ls -d /Applications/Xcode*.app
          exit 1

      # The image is Xcode-first; rustup and CMake (for the vendored libopus)
      # are installed only when it lacks them.
      - name: Rust and CMake
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          command -v cmake >/dev/null || brew install cmake

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gawk-ios/rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen

      # The first iPhone on the pinned iOS 27 runtime; device names vary
      # between runner images.
      - name: Pick a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          for rt in sorted(devs, reverse=True):
              if "iOS-27" not in rt:
                  continue
              for d in devs[rt]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit(1)
          ') || { echo "::error::no iPhone simulator on an iOS 27 runtime"; exit 1; }
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$udid"

      # docs/67 D24: the Swift tests that need a relay (the broadcast loop on
      # D27's test source, the Watch smoke test) run against a local one,
      # reached from the Simulator on the host's loopback.
      - uses: actions/setup-go@v7
        with:
          go-version-file: gawk-server/go.mod
          cache-dependency-path: gawk-server/go.sum

      - name: Start a local relay
        run: |
          bin="$RUNNER_TEMP/relay"
          mkdir -p "$bin"
          go -C ../../gawk-server build -o "$bin/" ./cmd/gawk-server ./cmd/gawk-devcert
          "$bin/gawk-devcert" -out "$bin/cert"
          "$bin/gawk-server" -addr 127.0.0.1:4499 -metrics-addr 127.0.0.1:4498 \
            -cert-file "$bin/cert/cert.pem" -key-file "$bin/cert/key.pem" \
            -publish-secret smoke > "$RUNNER_TEMP/relay.log" 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:4498/healthz && break; sleep 1; done

      # The broadcast loop's first QUIC dial sometimes never reaches the
      # relay on a fresh runner (2026-10-04); the relay logs nothing for a
      # handshake that never completes, so the loopback UDP is recorded and
      # shown on failure: long-header (handshake) packets only, so a live
      # stream's short-header traffic doesn't fill it.
      - name: Record the relay's QUIC handshakes
        run: |
          sudo tcpdump -i lo0 -n -tttt -c 300 'udp port 4499 and udp[8] & 0x80 != 0' \
            > "$RUNNER_TEMP/udp.txt" 2>&1 &
          sleep 2

      - name: Test (Simulator)
        env:
          TEST_RUNNER_GAWK_SMOKE_RELAY_URL: https://127.0.0.1:4499
          TEST_RUNNER_GAWK_SMOKE_SECRET: smoke
        # Ad-hoc signed: an unsigned test host has no Keychain, and the
        # identity tests (D17) need one. Needs no certificate or team.
        # Xcode 27 can spend 600 s in `simctl diagnose` after a test run;
        # diagnostics are not collected.
        run: |
          xcodebuild -project Gawk.xcodeproj -scheme Gawk \
            -destination "id=$SIM_UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test

      - name: Relay log
        if: failure()
        run: |
          cat "$RUNNER_TEMP/relay.log"
          echo "--- QUIC handshake packets to and from the relay (first 300)"
          sudo pkill tcpdump || true
          sleep 1
          cat "$RUNNER_TEMP/udp.txt"

      - name: Build (device, unsigned)
        run: |
          xcodebuild -project Gawk.xcodeproj -scheme Gawk \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build
