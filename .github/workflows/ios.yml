# R65 iOS app (docs/67 D24). Two jobs on GitHub-hosted macOS runners, the
# same deliberate exception to docs/38 D18 that broadcast-desktop.yml's macOS
# jobs are: the iOS SDK and the Simulator exist only on Apple hardware.
#
# Both run on the `xcode-27` image, not `macos-latest`: GitHub's images are
# one per major Xcode, and `macos-latest` carried Xcode 26 only when this
# landed (2026-10-04). The image's Xcode 27.0 sits at a release-candidate
# path, so `Select Xcode` pins by the version `xcodebuild` reports, not by
# the app's file name.
#
# `rust`  — the core's host tests, the shared desktop crates' tests in the
#           iOS configuration (`self-update` off, docs/67 D4), a check that the
#           resolved graph really has it off, both iOS cross-builds, and the
#           app's unsigned device build on top of the device one. Phase S
#           needs no team (OD14); signing belongs to the distribution
#           milestone.
# `xcode` — XcodeGen, then the app built and its Swift tests run in an iOS 27
#           Simulator: the unit tests and docs/70's UI tests against a local
#           relay with rooms, room fixtures published by gawk-devpub, and an
#           iPad pass for D26.
#
# Triggers follow the path dependencies (OD9): a change to a shared desktop
# crate or to the canonical wire runs this workflow as well as the desktop
# one, which in turn watches gawk-ios/rust/**. assets/icon/** is here
# because the app builds the icon catalogs tools/icon writes there
# (docs/70 K13), and global.css and main.slint because Theme.swift copies
# their tokens (K10's drift check).
name: ios

on:
  push:
    branches: [main]
    paths:
      - "gawk-ios/**"
      - "gawk-broadcast-desktop/crates/wire/**"
      - "gawk-broadcast-desktop/crates/engine/**"
      - "gawk-broadcast-desktop/crates/capture/**"
      - "gawk-broadcast-desktop/crates/encode/**"
      - "gawk-broadcast-desktop/crates/audio/**"
      - "gawk-broadcast-desktop/vendor/**"
      - "gawk-server/wire/**"
      - "assets/icon/**"
      - "gawk-app/src/styles/global.css"
      - "gawk-broadcast-desktop/crates/ui/main.slint"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "gawk-ios/**"
      - "gawk-broadcast-desktop/crates/wire/**"
      - "gawk-broadcast-desktop/crates/engine/**"
      - "gawk-broadcast-desktop/crates/capture/**"
      - "gawk-broadcast-desktop/crates/encode/**"
      - "gawk-broadcast-desktop/crates/audio/**"
      - "gawk-broadcast-desktop/vendor/**"
      - "gawk-server/wire/**"
      - "assets/icon/**"
      - "gawk-app/src/styles/global.css"
      - "gawk-broadcast-desktop/crates/ui/main.slint"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The vendored libopus (gawk-audio → opus → audiopus_sys) carries a
  # CMakeLists older than CMake 4's floor; this is CMake's own escape hatch.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # docs/67 D24: a pinned Xcode, never the image default, which can lag a
  # major version behind the iOS 27 SDK the app builds against (OD6).
  XCODE_VERSION: "27.0"
  # No debuginfo in CI builds (the test profile inherits dev): it makes
  # every compile and link slower and the cached target/ larger, and the
  # repository's Actions cache sits at its 10 GB eviction limit.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  rust:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: gawk-ios/rust
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          for app in /Applications/Xcode*.app; do
            [ -L "$app" ] && continue
            v=$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version 2>/dev/null | awk 'NR==1 {print $2}')
            if [ "$v" = "$XCODE_VERSION" ]; then
              sudo xcode-select -s "$app"
              xcodebuild -version
              xcrun simctl list runtimes
              exit 0
            fi
          done
          echo "::error::no Xcode $XCODE_VERSION on this runner image; installed:"
          ls -d /Applications/Xcode*.app
          exit 1

      # The image is Xcode-first; rustup and CMake (for the vendored libopus)
      # are installed only when it lacks them.
      - name: Rust and CMake
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          command -v cmake >/dev/null || brew install cmake

      # rust-toolchain.toml pins the compiler and both iOS targets; rustup
      # installs them on first use.
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
          rustup target list --installed

      # rust-cache reads `rustc -vV` from the repository root, which is the
      # image's default compiler, not the pinned one; the toolchain file's
      # hash in the prefix makes a compiler bump (and only that) a new key.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ hashFiles('gawk-ios/rust/rust-toolchain.toml') }}
          workspaces: |
            gawk-ios/rust
            gawk-broadcast-desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # docs/70 K10: Theme.swift's colours are copies of gawk-app's and the
      # desktop's tokens. The second half proves the check can fail: one
      # changed hex must trip it.
      - name: The theme matches the web and desktop tokens
        working-directory: .
        run: |
          gawk-ios/scripts/check-theme.sh
          sed 's/"#0a0b0d"/"#0a0b0e"/' gawk-ios/app/Gawk/Design/Theme.swift > "$RUNNER_TEMP/Theme.swift"
          if gawk-ios/scripts/check-theme.sh "$RUNNER_TEMP/Theme.swift"; then
            echo "::error::check-theme.sh passed a Theme.swift with a changed hex"
            exit 1
          fi

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (host)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (iOS)
        run: cargo clippy --target aarch64-apple-ios -p gawk-core -- -D warnings

      - name: Test
        run: cargo test --workspace

      # docs/67 D4: App Store apps must not update themselves. Features unify
      # across the graph, so one dependency line that takes the engine's
      # default would quietly turn `self-update` back on; this reads the
      # graph the iOS targets actually resolve.
      - name: self-update is off on iOS
        run: |
          for t in aarch64-apple-ios aarch64-apple-ios-sim; do
            tree=$(cargo tree -p gawk-core --target "$t" -e features)
            if grep -E 'self-update|minisign' <<<"$tree"; then
              echo "::error::gawk-engine's self-update feature is on for $t (docs/67 D4)"
              exit 1
            fi
          done

      # The shared crates' own tests in the configuration the app links
      # (IO1's acceptance: "the iOS host tests pass with it off"). They are
      # path dependencies, not members, so they run from their workspace.
      - name: Test the shared crates with self-update off
        working-directory: gawk-broadcast-desktop
        run: cargo test -p gawk-wire -p gawk-engine --no-default-features

      - name: Build (device and simulator)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        run: |
          cargo build -p gawk-core --target aarch64-apple-ios
          cargo build -p gawk-core --target aarch64-apple-ios-sim

      # The app's device build lives here, not in `xcode`: its build phase
      # (build-core.sh) wants the same dev-profile aarch64-apple-ios core the
      # step above just built, so it links instead of compiling it again.
      - name: XcodeGen
        working-directory: gawk-ios/app
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen

      - name: Build the app (device, unsigned)
        working-directory: gawk-ios/app
        run: |
          xcodebuild -project Gawk.xcodeproj -scheme Gawk \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build

      # docs/67 D24: the viewer core against the real relay and gawk-pubsim,
      # through induced datagram loss and a rolling relay restart. Both Go
      # binaries are built once here and handed to the test.
      - uses: actions/setup-go@v7
        with:
          go-version-file: gawk-server/go.mod
          cache-dependency-path: |
            gawk-server/go.sum
            gawk-broadcast/go.sum

      - name: Build the relay, devcert and publisher simulator
        run: |
          bin="$RUNNER_TEMP/relay-bin"
          mkdir -p "$bin"
          go -C ../../gawk-server build -o "$bin/" ./cmd/gawk-server ./cmd/gawk-devcert
          go -C ../../gawk-broadcast build -o "$bin/" ./cmd/gawk-pubsim
          echo "GAWK_IT_RELAY_BIN_DIR=$bin" >> "$GITHUB_ENV"
          echo "GAWK_IT_PUBSIM_BIN=$bin/gawk-pubsim" >> "$GITHUB_ENV"

      # `--workspace` with `--test`, not `-p`: features resolve per selected
      # package, so `-p gawk-viewer` resolved a narrower graph than `Test`
      # did and rebuilt all of it (3m 38s, for an 11 s test).
      - name: Integration — the viewer through loss and a relay restart
        run: cargo test --workspace --test relay_viewer -- --ignored --test-threads=1

      # docs/67 D24 (IO2): the broadcast pipeline on real VideoToolbox
      # through a rotation and a relay restart. It needs a hardware H.264
      # encoder; on a runner VM without one it prints SKIPPED and passes.
      - name: Integration — the broadcast pipeline through a rotation and a relay restart
        run: cargo test --workspace --test publish_relay -- --ignored --test-threads=1 --nocapture

  xcode:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: gawk-ios/app
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          for app in /Applications/Xcode*.app; do
            [ -L "$app" ] && continue
            v=$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version 2>/dev/null | awk 'NR==1 {print $2}')
            if [ "$v" = "$XCODE_VERSION" ]; then
              sudo xcode-select -s "$app"
              xcodebuild -version
              xcrun simctl list runtimes
              exit 0
            fi
          done
          echo "::error::no Xcode $XCODE_VERSION on this runner image; installed:"
          ls -d /Applications/Xcode*.app
          exit 1

      # The image is Xcode-first; rustup and CMake (for the vendored libopus)
      # are installed only when it lacks them.
      - name: Rust and CMake
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          command -v cmake >/dev/null || brew install cmake

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ hashFiles('gawk-ios/rust/rust-toolchain.toml') }}
          workspaces: gawk-ios/rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen

      # docs/67 D24: the Swift tests that need a relay (the broadcast loop on
      # D27's test source, the Watch smoke test) run against a local one,
      # reached from the Simulator on the host's loopback.
      #
      # Go is set up and the relay built before the Simulator boots: during
      # its boot storm this disk-bound step took 400-455 s, against 17-29 s
      # for the same step in `rust` (2026-10-04/05). The cache key matches
      # `rust`'s, so both jobs share one entry.
      - uses: actions/setup-go@v7
        with:
          go-version-file: gawk-server/go.mod
          cache-dependency-path: |
            gawk-server/go.sum
            gawk-broadcast/go.sum

      # Rooms on, with the static gated room the key test joins
      # (scripts/static-rooms.json), and caps and a grace for a test run
      # (docs/70 §8): the UI tests go live a few dozen times, a room holds
      # five fixture streams plus the tests', and the away tile must
      # outlast the run.
      - name: Start a local relay
        run: |
          bin="$RUNNER_TEMP/relay"
          mkdir -p "$bin"
          go -C ../../gawk-server build -o "$bin/" ./cmd/gawk-server ./cmd/gawk-devcert ./cmd/gawk-loadgen
          "$bin/gawk-devcert" -out "$bin/cert"
          "$bin/gawk-server" -addr 127.0.0.1:4499 -metrics-addr 127.0.0.1:4498 \
            -cert-file "$bin/cert/cert.pem" -key-file "$bin/cert/key.pem" \
            -publish-secret smoke -rooms -rooms-file ../scripts/static-rooms.json \
            -max-broadcasts 120 -max-room-broadcasts 10 -max-subscribers 40 \
            -max-total-subscribers 200 -conn-rate-limit 0 -broadcast-grace 60m \
            > "$RUNNER_TEMP/relay.log" 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:4498/healthz && break; sleep 1; done

      # Every Rust step runs before the Simulator boots, as Go does above.
      # With them after the boot, a warm-cache run (2026-10-05) spent 2.5 min
      # installing the pinned toolchain (17 s in `rust`) and 3.5 min updating
      # the crates.io index, for 30 s of compiling.
      - name: Rust toolchain and crates
        working-directory: gawk-ios/rust
        run: |
          rustup toolchain install
          cargo fetch --locked

      # The core the app links, built here so the app's own build phase (the
      # same script) finds it fresh.
      - name: Build the Rust core (simulator)
        run: ../scripts/build-core.sh iphonesimulator

      - name: Build gawk-devpub
        working-directory: gawk-ios/rust
        run: cargo build -p gawk-devpub

      # The first iPhone on the pinned iOS 27 runtime; device names vary
      # between runner images.
      - name: Pick a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          for rt in sorted(devs, reverse=True):
              if "iOS-27" not in rt:
                  continue
              for d in devs[rt]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit(1)
          ') || { echo "::error::no iPhone simulator on an iOS 27 runtime"; exit 1; }
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$udid"
          # Booted explicitly and waited for below. Left to xcodebuild, it
          # boots right before the tests, and the first test ran in its boot
          # storm: QUIC handshakes answered 14-31 s late and sessions that
          # went silent (2026-10-04).
          xcrun simctl boot "$udid" || true

      # The Watch smoke test (D24) watches a broadcast: gawk-devpub loops the
      # recorded H.264 fixture to the local relay and prints its code.
      - name: Publish the H.264 fixture
        working-directory: gawk-ios/rust
        run: |
          ./target/debug/gawk-devpub --codec h264 --url https://127.0.0.1:4499 \
            --insecure --secret smoke > "$RUNNER_TEMP/devpub.out" 2> "$RUNNER_TEMP/devpub.log" &
          for i in $(seq 60); do grep -q GAWK_DEVPUB_ID "$RUNNER_TEMP/devpub.out" && break; sleep 1; done
          id=$(sed -n 's/^GAWK_DEVPUB_ID=//p' "$RUNNER_TEMP/devpub.out" | head -1)
          [ -n "$id" ] || { cat "$RUNNER_TEMP/devpub.log"; exit 1; }
          echo "SMOKE_ID=$id" >> "$GITHUB_ENV"

      # The broadcast loop's first QUIC dial sometimes never reaches the
      # relay on a fresh runner (2026-10-04); the relay logs nothing for a
      # handshake that never completes, so the loopback UDP is recorded and
      # shown on failure: long-header (handshake) packets only, so a live
      # stream's short-header traffic doesn't fill it.
      - name: Wait for the simulator to finish booting
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b
          # bootstatus returns at "booted"; give the post-boot work a moment.
          sleep 20

      # docs/70 IX5, IX6: the rooms the UI tests watch and join, as
      # GAWK_UI_* variables (scripts/room-fixtures.sh says which is which).
      # After the boot: publishers that ran through it had dozens of keyframe
      # streams refused, and a room stream later delivered only its cached
      # keyframe (2026-10-06).
      - name: Publish the room fixtures
        run: ../scripts/room-fixtures.sh https://127.0.0.1:4499 smoke "$RUNNER_TEMP/rooms" >> "$GITHUB_ENV"

      - name: Record the relay's QUIC handshakes
        run: |
          sudo tcpdump -i lo0 -n -tttt -c 300 'udp port 4499 and udp[8] & 0x80 != 0' \
            > "$RUNNER_TEMP/udp.txt" 2>&1 &
          sleep 2

      # What the runner's CPU goes to during the tests, uploaded with a failed
      # run's results: on a starved runner the Simulator's video froze and a
      # menu ignored taps for 20 s (2026-10-06).
      - name: Sample the runner's CPU
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          nohup top -l 0 -s 10 -o cpu -n 15 -stats pid,command,cpu,mem,state \
            > "$RUNNER_TEMP/results/top.txt" 2>&1 &

      # Every fixture still delivers video (Mika's is away by design).
      - name: The fixtures are streaming
        run: |
          ../scripts/fixtures-streaming.sh https://127.0.0.1:4499 "$RUNNER_TEMP/relay/gawk-loadgen" \
            "$SMOKE_ID" $(sed -n 's/^GAWK_DEVPUB_ID=//p' "$RUNNER_TEMP"/rooms/{P1,P2,P3,P4,P5,Keeper,Guest}.out)

      - name: Test (Simulator)
        env:
          TEST_RUNNER_GAWK_SMOKE_RELAY_URL: https://127.0.0.1:4499
          TEST_RUNNER_GAWK_SMOKE_SECRET: smoke
          TEST_RUNNER_GAWK_UI_RELAY_URL: https://127.0.0.1:4499
          TEST_RUNNER_GAWK_UI_SECRET: smoke
          TEST_RUNNER_GAWK_UI_OUT: ${{ runner.temp }}/ui
        # Ad-hoc signed: an unsigned test host has no Keychain, and the
        # identity tests (D17) need one. Needs no certificate or team.
        # Xcode 27 can spend 600 s in `simctl diagnose` after a test run;
        # diagnostics are not collected.
        run: |
          TEST_RUNNER_GAWK_SMOKE_BROADCAST_ID="$SMOKE_ID" \
          TEST_RUNNER_GAWK_SMOKE_ROOM_CODE="$GAWK_UI_ROOM_CODE" \
          TEST_RUNNER_GAWK_UI_BROADCAST_ID="$SMOKE_ID" \
          TEST_RUNNER_GAWK_UI_ROOM_CODE="$GAWK_UI_ROOM_CODE" \
          TEST_RUNNER_GAWK_UI_AWAY_ROOM="$GAWK_UI_AWAY_ROOM" \
          TEST_RUNNER_GAWK_UI_CREATOR_ROOM="$GAWK_UI_CREATOR_ROOM" \
          TEST_RUNNER_GAWK_UI_CREATOR_TOKEN="$GAWK_UI_CREATOR_TOKEN" \
          xcodebuild -project Gawk.xcodeproj -scheme Gawk \
            -destination "id=$SIM_UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            -collect-test-diagnostics never -resultBundlePath "$RUNNER_TEMP/results/iphone.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test

      # docs/70 IX8: the Live Activity's extension draws state and nothing
      # more; it must never carry the core.
      # A Debug build puts the code in GawkLiveActivity.debug.dylib beside a
      # stub executable, so every binary in the bundle is read.
      - name: The Live Activity links no gawk Rust code
        run: |
          appex="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Gawk.app/PlugIns/GawkLiveActivity.appex"
          test -f "$appex/GawkLiveActivity"
          for bin in "$appex"/GawkLiveActivity "$appex"/*.dylib; do
            if nm "$bin" 2>/dev/null | grep -iE 'uniffi|gawk_core'; then
              echo "::error::$(basename "$bin") in the Live Activity extension links the Rust core"
              exit 1
            fi
          done

      # docs/70 IX9, D26: the iPad layouts, on the first iPad on the runtime.
      - name: Test (iPad Simulator)
        env:
          TEST_RUNNER_GAWK_UI_RELAY_URL: https://127.0.0.1:4499
          TEST_RUNNER_GAWK_UI_SECRET: smoke
          TEST_RUNNER_GAWK_UI_OUT: ${{ runner.temp }}/ui-ipad
        run: |
          ipad=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          for rt in sorted(devs, reverse=True):
              if "iOS-27" not in rt:
                  continue
              for d in devs[rt]:
                  if d["name"].startswith("iPad"):
                      print(d["udid"]); sys.exit(0)
          sys.exit(1)
          ') || { echo "::error::no iPad simulator on an iOS 27 runtime"; exit 1; }
          # The iPhone Simulator goes first. With both booted, the runner ran
          # out of memory in the iPad's first boot (wired 2 GB to 5.8 GB, load
          # 640); every process stalled for minutes and four room fixtures'
          # publishers timed out (2026-10-06, top.txt).
          xcrun simctl shutdown "$SIM_UDID" || true
          xcrun simctl boot "$ipad" || true
          xcrun simctl bootstatus "$ipad" -b
          sleep 20
          TEST_RUNNER_GAWK_UI_ROOM_CODE="$GAWK_UI_ROOM_CODE" \
          xcodebuild -project Gawk.xcodeproj -scheme Gawk \
            -destination "id=$ipad" -derivedDataPath "$RUNNER_TEMP/dd" \
            -collect-test-diagnostics never -resultBundlePath "$RUNNER_TEMP/results/ipad.xcresult" \
            -only-testing:GawkUITests/IPadUITests \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test

      - name: Relay log
        if: failure()
        run: |
          cat "$RUNNER_TEMP/relay.log"
          echo "--- room fixtures"
          tail -n 20 "$RUNNER_TEMP"/rooms/*.log || true
          echo "--- the fixtures after the tests"
          ../scripts/fixtures-streaming.sh https://127.0.0.1:4499 "$RUNNER_TEMP/relay/gawk-loadgen" \
            "$SMOKE_ID" $(sed -n 's/^GAWK_DEVPUB_ID=//p' "$RUNNER_TEMP"/rooms/{P1,P2,P3,P4,P5,Keeper,Guest}.out) || true
          echo "--- QUIC handshake packets to and from the relay (first 300)"
          sudo pkill tcpdump || true
          sleep 1
          cat "$RUNNER_TEMP/udp.txt"

      # The screenshots and result bundles of a failed run: a CI-only UI
      # failure is otherwise a log line with nothing to look at.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/ui
            ${{ runner.temp }}/ui-ipad
            ${{ runner.temp }}/results
          retention-days: 7
          if-no-files-found: ignore
