# The iOS app's Xcode project, generated by XcodeGen (docs/67 D2, OD15):
#
#   cd gawk-ios/app && xcodegen
#
# Gawk.xcodeproj and Gawk/Info.plist are written by that command and
# git-ignored; this file is the only source. Identifiers are fixed by
# docs/67 D28 and are permanent once the app ships.
name: Gawk
options:
  bundleIdPrefix: fi.ioio
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0" # x-release-please-version
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # The Rust core is built for arm64 only (docs/67 D3); an Intel simulator
    # slice would have nothing to link against.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    # Phase S needs no team (OD14): Xcode signs to run locally in the
    # Simulator, and CI builds unsigned.
    CODE_SIGN_STYLE: Automatic

targets:
  Gawk:
    type: application
    platform: iOS
    sources:
      - Gawk
      # Written by build-core.sh, so absent until the first build.
      - path: Generated/gawk_core.swift
        optional: true
      # Generated from assets/icon/gawk.svg by tools/icon (docs/70 K13).
      - ../../assets/icon/ios/AppIcon.xcassets
      - ../../assets/icon/ios/Mark.xcassets
    preBuildScripts:
      - name: Build the Rust core
        script: '"${PROJECT_DIR}/../scripts/build-core.sh"'
        # cargo decides what is stale, not Xcode.
        basedOnDependencyAnalysis: false
        # Declared so Xcode orders the Swift compile and the link after it.
        outputFiles:
          - $(PROJECT_DIR)/Generated/gawk_core.swift
          - $(PROJECT_DIR)/Build/rust/$(PLATFORM_NAME)/libgawk_core.a
    info:
      path: Gawk/Info.plist
      properties:
        CFBundleDisplayName: gawk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # `screen-capture` keeps a broadcast running behind a game (D6);
        # `audio` keeps PiP and a locked screen playing (D22).
        UIBackgroundModes:
          - audio
          - screen-capture
        # `gawk://watch/<CODE>`, `gawk://room/<name>` and
        # `gawk://broadcast?…` (docs/67 D20, docs/68 D1).
        CFBundleURLTypes:
          - CFBundleURLName: fi.ioio.gawk
            CFBundleURLSchemes:
              - gawk
        # The broadcast's Live Activity (docs/70 D15), drawn by the
        # GawkLiveActivity extension.
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.ioio.gawk
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Live Activity's intents run here, not in the extension that
        # compiles them too (LiveActivityIntents.swift).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) GAWK_APP
        # build-core.sh writes into the source tree (Build/, Generated/).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The core's C module (gawk_coreFFI) and static library (D3).
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Build/ffi
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Build/rust/$(PLATFORM_NAME)
        OTHER_LDFLAGS:
          - -lgawk_core
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: VideoToolbox.framework
      - target: GawkLiveActivity
        embed: true

  # The Live Activity (docs/70 D15, K9, revising docs/67 §6): a widget
  # extension that draws the state the app sends it. It holds no media, needs
  # no App Group or shared Keychain, and links no gawk Rust code.
  GawkLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - GawkLiveActivity
      - Gawk/LiveActivity/GawkActivityAttributes.swift
      - Gawk/LiveActivity/LiveActivityIntents.swift
      - Gawk/Design/Theme.swift
      - ../../assets/icon/ios/Mark.xcassets
    info:
      path: GawkLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: gawk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.ioio.gawk.LiveActivity
        SKIP_INSTALL: YES
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework

  GawkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GawkTests
    dependencies:
      - target: Gawk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fi.ioio.gawk.Tests
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Build/ffi

  # The Watch screen driven through its UI against a local relay (docs/67
  # D26); skipped unless a relay and a code are passed in.
  GawkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GawkUITests
    dependencies:
      - target: Gawk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fi.ioio.gawk.UITests
        TEST_TARGET_NAME: Gawk

schemes:
  Gawk:
    build:
      targets:
        Gawk: all
    test:
      targets:
        - GawkTests
        - GawkUITests
