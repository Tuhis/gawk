[package]
name = "uniffi-bindgen"
description = "Host-only: generates the Swift bindings for gawk-core (docs/67 D2)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# A crate of its own so the bindgen's `cli` feature (clap and friends) never
# unifies into the library Xcode links into the app and the extension.
[dependencies]
uniffi = { workspace = true, features = ["cli"] }
