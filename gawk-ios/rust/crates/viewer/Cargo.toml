[package]
name = "gawk-viewer"
description = "The first viewer outside gawk-app: subscribe, reassembly, parity repair, decode, timing (docs/67 D13–D16)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
gawk-engine.workspace = true
gawk-wire.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "test-util"] }
