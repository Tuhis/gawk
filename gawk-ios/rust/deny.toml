# cargo-deny: the license gate for the iOS app's Rust core (R72, docs/74
# OL2). The `licenses` job in .github/workflows/ci.yml runs it here and in
# gawk-broadcast-desktop/, whose deny.toml this one follows: the same
# allowlist, kept in step with ALLOWED_LICENSES in
# tools/licenses/gen-notices.py. A workspace of its own needs a gate of its
# own — the desktop's covers the shared crates, not what only iOS links
# (uniffi, libvpx's bindings).
#
# The attributions are gawk-ios/THIRD-PARTY-NOTICES.md, which the app shows
# under Settings → Open-source licences.

[graph]
# The one shipped artifact: the app's arm64 device build. The Simulator
# slice is never distributed.
targets = ["aarch64-apple-ios"]
exclude-dev = true

[licenses]
# Permissive, notice-only terms; the desktop deny.toml says what each
# Rust-only identifier is.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# UniFFI (docs/67 D3) is the one dependency here under terms that are not
# notice-only: the Mozilla Public License 2.0, on every crate of the family.
# MPL-2.0 is file-level copyleft. It binds the MPL files themselves, not
# the app around them (§3.3 allows a Larger Work under other terms), and
# distributing the executable obliges gawk to say where their source can be
# had (§3.2(a)). gen-notices.py writes that into the notices' "Source code"
# section, and the crates are used unmodified. Decided 2026-10-20 with R72.
#
# Scoped per crate, as Slint is on the desktop: a different MPL crate
# arriving still fails the gate and gets read first. The bindgen, macro,
# metadata and UDL crates run at build time and are not linked into the app,
# but cargo-deny judges the build graph too, and the code they emit ships.
exceptions = [
    { name = "uniffi", allow = ["MPL-2.0"] },
    { name = "uniffi_bindgen", allow = ["MPL-2.0"] },
    { name = "uniffi_core", allow = ["MPL-2.0"] },
    { name = "uniffi_internal_macros", allow = ["MPL-2.0"] },
    { name = "uniffi_macros", allow = ["MPL-2.0"] },
    { name = "uniffi_meta", allow = ["MPL-2.0"] },
    { name = "uniffi_pipeline", allow = ["MPL-2.0"] },
    { name = "uniffi_udl", allow = ["MPL-2.0"] },
]

[bans]
# As on the desktop: duplicate versions are not this gate's business.
multiple-versions = "allow"

[advisories]
yanked = "allow"
