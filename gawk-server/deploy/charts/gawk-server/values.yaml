image:
  repository: ghcr.io/tuhis/gawk-server
  # Empty = use the chart's appVersion, which release-please keeps in
  # lockstep with the published image tag. Only set this to pin a
  # different image than the chart was released with.
  tag: ""
  pullPolicy: IfNotPresent

# The published images are public; a pull secret is only for a registry of
# your own.
imagePullSecrets: []

# R17 (docs/22): relay pod count. Anything above 1 REQUIRES
# config.clusterMode: true (per-broadcast origin Leases + edge pulls) plus
# the shared Secrets (statelessResetKey, internalPsk, and publishSecret or
# resumeTokenKey) — the chart refuses replicas > 1 without clusterMode.
# The default stays 1 so existing single-pod installs upgrade unchanged;
# the design's product topology is replicas: 2+.
replicas: 1

service:
  type: LoadBalancer
  port: 4433
  # Pin a MetalLB address if the relay's DNS record points at a fixed IP:
  # loadBalancerIP: 10.12.0.40
  loadBalancerIP: ""
  # Empty renders nothing (Kubernetes defaults to Cluster). Cluster: any
  # node forwards to any pod — cross-node hops are SNAT'd, the relay sees
  # node IPs (why config.trustedCidrs exists) and per-IP rate limiting is
  # best-effort. Local: only nodes with a ready relay pod receive traffic,
  # real client IPs are preserved and the per-IP limiter is exact — viable
  # ONLY when the LB advertises per-node routes (MetalLB BGP mode with
  # ECMP on the router; under L2 it pins all traffic to the one announcing
  # node — docs/22 Decision 13 + finding 10). With Local, keep
  # podAntiAffinity on so the replicas actually spread across nodes.
  externalTrafficPolicy: ""
  # Pin the node port (30000–32767) when service.type is NodePort — the R20
  # cluster E2E (docs/25) maps a fixed kind hostPort onto it. Empty lets
  # Kubernetes pick.
  nodePort: ""
  # e.g. metallb.universe.tf/address-pool: default
  annotations: {}

# R9 observability (docs/13): a plain-TCP ops endpoint serving /metrics
# (Prometheus), /healthz and /statusz. Exposed ONLY through a ClusterIP
# Service — never through the public LoadBalancer above. The ServiceMonitor
# needs the prometheus-operator CRDs (e.g. kube-prometheus-stack); its
# labels must match your Prometheus's serviceMonitorSelector (for
# kube-prometheus-stack that is typically {release: <helm release name>}).
metrics:
  enabled: true
  port: 2112
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 15s
    scrapeTimeout: 10s

# R28 (docs/33): per-session telemetry. OFF by default — a deployment that
# leaves it off renders byte-identically to the pre-R28 chart, mints no session
# tokens, sends no TelemetryHello, and every client therefore collects nothing.
# Enable it together with the gawk-telemetry chart, sharing ONE key.
telemetry:
  enabled: false
  # The session-token HMAC key: 64 hex chars (32 bytes), shared by every relay
  # pod AND by gawk-telemetry, which verifies tokens with it and no lookup.
  # Generate once and put it in a Secret referenced by both charts:
  #   kubectl -n gawk create secret generic gawk-telemetry-key \
  #     --from-literal=key=$(openssl rand -hex 32)
  # then set: keyRef: {name: gawk-telemetry-key, key: key}.
  # Rotating it revokes every outstanding session token.
  key: ""
  keyRef: {}
  # The sampling cadence the relay asks clients to use, carried in the hello —
  # so the volume can be turned down fleet-wide without shipping a frontend.
  # 500ms-60s; the client stats tick is 500 ms, so anything faster only
  # resends the same numbers.
  reportInterval: 2s
  # D5: the headless companion Service that gives gawk-telemetry a per-pod
  # address list to scrape. The existing metrics Service is a ClusterIP and
  # load-balances, so scraping it would hit one random pod. Requires
  # metrics.enabled.
  headlessService:
    enabled: true
    annotations: {}
  # R37 (docs/40 §4.10 D14): the absolute https URL of THIS fleet's telemetry
  # ingest, advertised to every publish/subscribe session in-band (wire 0x12)
  # so sessions arriving from foreign gawk UIs report to this operator's
  # collector. It names the FRONTEND's public ingress + ingest path (the same
  # place the gawk-app chart's telemetry.path routes), e.g.
  #   advertiseUrl: "https://gawk.example.com/api/telemetry/v1/ingest"
  # Empty advertises nothing; an invalid URL fails relay startup (fail-fast).
  # Only meaningful with telemetry.enabled.
  advertiseUrl: ""

certificate:
  # cert-manager Certificate for the relay's public name. The server's
  # tlsutil.Reloader picks up renewals on the fly — no pod restart needed.
  enabled: true
  issuerRef:
    # Use letsencrypt-staging for the first rollout to avoid burning
    # production rate limits while iterating.
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - gawk-relay.example.com # CHANGEME: the relay's public DNS name
  secretName: gawk-server-tls

config:
  # Origins allowed to CONNECT, checked against the Origin header. MUST
  # include the frontend's origin (the gawk-app ingress host), e.g.
  # ["https://gawk.example.com"]. Empty allows all — fine for dev, don't
  # ship it to prod. The fleet's own pod-to-pod edge origin
  # (gawk-server://native-internal-edge) is built in and honored only on
  # the PSK-gated internal route — never list it here (docs/22 finding 12).
  allowedOrigins: []
  # R37 (docs/40 §4.4): operator display name advertised to server pickers
  # over /echo (wire 0x11), e.g. "Juho's homelab". Rendered by picker UIs
  # next to (never instead of) this relay's host. Empty leaves it unnamed.
  serverName: ""
  maxSubscribers: 15
  maxBroadcasts: 5
  maxTotalSubscribers: 50
  publishSecret: ""
  publishSecretKeyRef: {}
  # R17 W3: multi-pod federation (per-broadcast k8s origin Leases, edge
  # pulls, drain lease release). Off = single-pod behavior byte-identical to
  # pre-R17 (no k8s API client at all). Turning it on also creates a
  # ServiceAccount + Role (Leases only) + RoleBinding and injects the pod
  # identity via the downward API. Multi-replica deploys REQUIRE it — and
  # shared statelessResetKey/resumeTokenKey (or publishSecret) Secrets.
  clusterMode: false
  # R17 W4: pre-shared key gating the pod-to-pod /internal/subscribe route
  # (it rides the same public UDP port as viewers). Required with
  # clusterMode; use the secret ref in real deploys:
  #   kubectl -n gawk create secret generic gawk-internal-psk \
  #     --from-literal=psk=$(openssl rand -hex 32)
  internalPsk: ""
  internalPskRef: {}
  # R17 W4: the TLS server name edge pods verify when dialing an origin's
  # pod IP — the relay's public cert hostname (certificate.dnsNames[0]).
  # Defaults to the first certificate dnsName when left empty.
  internalServerName: ""
  # R17 W6: statusz/metrics obfuscation key — 64 hex chars (32 bytes),
  # shared fleet-wide so one broadcast keeps ONE obfuscated identity across
  # pods (Prometheus can aggregate). Same generation recipe as below.
  statsKey: ""
  statsKeyRef: {}
  # R17 W2: resume-token HMAC key — 64 hex chars (32 bytes), shared by all
  # relay pods. RECOMMENDED for any real deployment: when set it WINS over
  # the publish-secret derivation. The publish secret is handed to every
  # broadcaster, so a token key derived from it can be computed by every
  # broadcaster — only this independent server-side key stops one
  # broadcaster from taking over another's broadcast ID (PR #47 security
  # review); rotating it revokes all resume tokens. Empty: derive from the
  # publish secret (protects only against non-secret-holders). Same
  # generation recipe as the reset key below.
  resumeTokenKey: ""
  resumeTokenKeyRef: {}
  # R17 W1: QUIC stateless reset key — 64 hex chars (32 bytes), SHARED by
  # every relay pod so any pod can reject packets for a dead pod's
  # connections in ~1 RTT (docs/22 Decision 3). Generate once:
  #   kubectl -n gawk create secret generic gawk-reset-key \
  #     --from-literal=key=$(openssl rand -hex 32)
  # then set: statelessResetKeyRef: {name: gawk-reset-key, key: key}.
  # Empty disables (abrupt pod death costs the ~30s idle timeout).
  statelessResetKey: ""
  statelessResetKeyRef: {}
  connRateLimit: 3.0
  connBurstLimit: 10
  # R17 W5: CIDRs that bypass the per-IP rate limiter. Under
  # externalTrafficPolicy: Cluster (any LB mode — the SNAT is kube-proxy's,
  # not MetalLB's) the relay sees SNAT'd NODE IPs for cross-node hops — a
  # rollout's reconnect herd through those would trip the 3/s bucket and
  # fail fresh joiners fatally. List the cluster's node/pod CIDRs, e.g.
  # ["10.42.0.0/16", "10.12.0.0/24"]. With service.externalTrafficPolicy:
  # Local the client IPs are real and this is unnecessary — but keep it:
  # in-cluster dials of the VIP (e.g. a loadgen pod) still hairpin-SNAT.
  trustedCidrs: []
  maxBandwidth: "0"
  # R8 reliable keyframes: cap on a single keyframe stream (memory-inflation
  # defense) and how long a keyframe write to one subscriber may block before
  # the stream is cancelled and that subscriber recovers at the next keyframe.
  maxKeyframeBytes: "8388608"
  keyframeWriteTimeout: 1s
  # R21 DVR ring (docs/26): per-broadcast history retained for resilient
  # viewers, so a stalled link costs delay instead of frames. The window is
  # also the ceiling a viewer's requested buffer is clamped to; a viewer's
  # buffer must strictly exceed the stall it covers, so 3 s of ring backs a
  # ~2 s stall. Allocated only for broadcasts that actually have a resilient
  # viewer. dvrMaxBytes is the bound that protects the pod: 3 s of a 50 Mbps
  # broadcaster is 18 MB, and nothing else stops several of those at once.
  dvrWindow: 3s
  dvrMaxBytes: "25165824"
  # How much faster than live a recovering viewer may send, as a multiple of
  # the broadcast's own bitrate. Covering a stall S with buffer B needs
  # B/(B-S)x, so 4x carries a 2 s stall on a 2.67 s buffer. The ceiling exists
  # because the egress budget is one bucket shared with every other viewer on
  # the pod, and a network event that stalls one viewer usually stalls them
  # all. Negative disables it.
  dvrMaxCatchup: "4"
  # Put audio in the ring too, on its own reliable stream. On by default: a
  # video-only DVR fixes the picture and leaves the sound full of holes, which
  # is the half users notice. Off restores live-edge audio (docs/20 finding 5).
  dvrAudio: true
  # Deliver a plain live-edge viewer's audio on its own reliable stream instead
  # of unreliable datagrams. Video is untouched — live-edge deltas stay
  # datagrams, which is the mode. Off by default because the trade depends on
  # the viewer's RTT: resilient and DVR viewers buffer 150-3000 ms so a
  # retransmit is free, while a live-edge viewer holds only ~90-150 ms of audio
  # and a retransmit costs a stall once the RTT exceeds that, where the same
  # loss is a concealed 20 ms gap today. On a lossy link the win is large (a
  # measured 3.7% of Opus packets lost, a dropout every half second); turn it on
  # and read avPlayheadAdvance (~1.0 = the worklet is not starving) and the
  # audio packet rate (50/s) before making it fleet policy.
  liveEdgeAudioOnReliableStream: false
  # R29 forward parity (docs/34): how many parity symbols producers emit per
  # delta frame, and the ceiling on what any single subscriber can be served.
  #
  # 2 is the default and the recommended setting: it repairs any two lost
  # chunks of a frame, which on a measured 3% loss link takes GOP freezes from
  # ~99% to ~0.3% and decoded framerate from 8 to 43 fps. It costs ~22% extra
  # egress per live-edge viewer, so watch gawk_relay_parity_forwarded_total
  # against your uplink before assuming it is free at fleet scale.
  #
  # Viewers can opt DOWN (1 or 0) from their own menu; they can never opt up,
  # because a viewer cannot conjure symbols the producer never emitted.
  # Carrier modes (resilient / deep buffer) are always served 0 — QUIC
  # retransmission already recovers their loss.
  #
  # 0 disables the feature fleet-wide from this one value: no capability is
  # advertised, so producers emit nothing and the wire is byte-identical to a
  # relay predating R29.
  parityDefault: "2"
  # R30 striped delivery (docs/35): accept stripe-leg subscribe sessions so a
  # viewer whose path shows the per-connection burst-threshold loss (Firefox's
  # ~8-packet datagram buffer) can split each frame's datagrams across up to 4
  # extra connections. On by default: the relay pays nothing until a viewer
  # actually engages (auto-detected loss, or a manual toggle), and each engaged
  # viewer then holds up to 5 sessions — which count against maxSubscribers,
  # so size that cap accordingly on fleets expecting striping. Off: leg dials
  # get 400, the capability is not advertised, byte-identical to pre-R30.
  stripedDelivery: "true"
  logLevel: info
  logFormat: json
  # QUIC session tuning. The keepalive is what keeps idle viewers
  # connected while the broadcaster is away; it must stay below the idle
  # timeout. See gawk-server/README.md.
  maxIdleTimeout: 30s
  keepalivePeriod: 10s
  # How long an abandoned broadcast ID survives after its publisher
  # disconnects (the reclaim window); on expiry remaining viewers get a
  # terminal "broadcast ended" close. See docs/06-multi-broadcaster.md.
  broadcastGrace: 5m
  # Suppresses the INFO "session started"/"session ended" logs for the k8s
  # exec probe's own /echo sessions (fires every startup/liveness/readiness
  # probe period, forever). Real off-pod echo diagnostic use still logs
  # normally. Set false to see probe traffic while debugging.
  quietProbeLogs: true

# Extra GAWK_* environment variables, verbatim pod-spec env entries.
extraEnv: []

# Probe timings. The probe itself execs the bundled gawk-echo binary
# against localhost — the server is HTTP/3-only (UDP, no TCP listener), so
# kubelet's httpGet/tcpSocket probes cannot reach it. Each probe run costs
# one QUIC dial: trivial at this scale.
probes:
  startup:
    periodSeconds: 2
    failureThreshold: 15
  liveness:
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    timeoutSeconds: 3

# R17: a PodDisruptionBudget so node drains never take the last relay pod.
# Rendered only when replicas > 1 (at 1 replica it would block node
# maintenance outright), so it is safe to leave enabled.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Spread relay pods across nodes. soft (default) = preferred — never blocks
# scheduling on a small cluster; hard = required — guarantees the spread but
# leaves pods Pending when ready nodes < replicas; none = no anti-affinity.
# Matters most with service.externalTrafficPolicy: Local, where a node
# without a relay pod serves no external traffic at all; even under Cluster
# it keeps one node failure from taking every replica.
podAntiAffinity: soft

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi

# Optional initContainer to tune host sysctls for QUIC UDP buffer sizes.
# Requires privileged securityContext access on the host.
sysctlInitContainer:
  enabled: false
  image: busybox:1.38
