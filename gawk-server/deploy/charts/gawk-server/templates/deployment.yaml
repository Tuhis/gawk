apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gawk-server.fullname" . }}
  labels:
    {{- include "gawk-server.labels" . | nindent 4 }}
spec:
  # R17 (docs/22 Decision 15): replicas is a real value now. Multi-replica
  # REQUIRES config.clusterMode (the origin/edge federation) — without it a
  # second pod behind the Service would split the publisher from the
  # subscribers, so the chart refuses to render that combination.
  {{- if and (gt (int .Values.replicas) 1) (not .Values.config.clusterMode) }}
  {{- fail "replicas > 1 requires config.clusterMode: true (see docs/22-relay-scale-out.md)" }}
  {{- end }}
  replicas: {{ .Values.replicas }}
  # RollingUpdate with surge 1 / unavailable 0: pods drain one at a time and
  # a reconnecting client always has a ready pod to land on. At replicas: 1
  # this is strictly better than the old Recreate — the new pod is Ready
  # before the old one drains, so even a single-pod upgrade is a ≤1 s blip
  # instead of a full restart gap (W1 drain + W2 resume tokens).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "gawk-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gawk-server.selectorLabels" . | nindent 8 }}
    spec:
      # The SIGTERM drain (R17 W1, docs/22 Decision 2) closes every session
      # with 4002 inside ~1.25s and exits — 10s is generous headroom, and a
      # hung pod must not linger into the next rollout step.
      terminationGracePeriodSeconds: 10
      {{- if .Values.config.clusterMode }}
      serviceAccountName: {{ include "gawk-server.fullname" . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not (has .Values.podAntiAffinity (list "soft" "hard" "none")) }}
      {{- fail "podAntiAffinity must be one of: soft, hard, none" }}
      {{- end }}
      {{- if ne .Values.podAntiAffinity "none" }}
      # Spread pods across nodes (docs/22 finding 10): with
      # service.externalTrafficPolicy: Local a node without a relay pod
      # serves no external traffic, and even under Cluster one node failure
      # shouldn't take every replica. soft = preferred, hard = required.
      affinity:
        podAntiAffinity:
          {{- if eq .Values.podAntiAffinity "hard" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "gawk-server.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "gawk-server.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
          {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.sysctlInitContainer.enabled }}
      initContainers:
        - name: sysctl-tuner
          image: {{ .Values.sysctlInitContainer.image | quote }}
          command:
            - sysctl
            - -w
            - net.core.rmem_max=7340032
            - net.core.wmem_max=7340032
          securityContext:
            privileged: true
            runAsUser: 0
      {{- end }}
      containers:
        - name: gawk-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: webtransport
              containerPort: 4433
              protocol: UDP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: GAWK_ADDR
              value: ":4433"
            {{- if .Values.config.clusterMode }}
            # R17 W3: federation needs the k8s API (origin Leases) and this
            # pod's identity — the lease advertises <podIP>:4433 for edge
            # pulls (never the Service VIP, docs/22 Decision 9).
            - name: GAWK_CLUSTER_MODE
              value: "true"
            # R17 W4: pod-to-pod route gate + the TLS name edges verify.
            - name: GAWK_INTERNAL_PSK
              {{- if .Values.config.internalPskRef }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.internalPskRef.name | quote }}
                  key: {{ .Values.config.internalPskRef.key | quote }}
              {{- else }}
              value: {{ .Values.config.internalPsk | quote }}
              {{- end }}
            - name: GAWK_INTERNAL_SERVER_NAME
              value: {{ .Values.config.internalServerName | default (first .Values.certificate.dnsNames) | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            # "off" (not empty) disables: an empty env var reads as unset and
            # would fall back to the flag default.
            - name: GAWK_METRICS_ADDR
              {{- if .Values.metrics.enabled }}
              value: ":{{ .Values.metrics.port }}"
              {{- else }}
              value: "off"
              {{- end }}
            - name: GAWK_CERT_FILE
              value: /tls/tls.crt
            - name: GAWK_KEY_FILE
              value: /tls/tls.key
            - name: GAWK_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: GAWK_LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
            - name: GAWK_MAX_SUBSCRIBERS
              value: {{ .Values.config.maxSubscribers | quote }}
            - name: GAWK_MAX_BROADCASTS
              value: {{ .Values.config.maxBroadcasts | quote }}
            - name: GAWK_MAX_TOTAL_SUBSCRIBERS
              value: {{ .Values.config.maxTotalSubscribers | quote }}
            - name: GAWK_PUBLISH_SECRET
              {{- if .Values.config.publishSecretKeyRef }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.publishSecretKeyRef.name | quote }}
                  key: {{ .Values.config.publishSecretKeyRef.key | quote }}
              {{- else }}
              value: {{ .Values.config.publishSecret | quote }}
              {{- end }}
            # R17 W6: fleet-wide statusz/metrics obfuscation key.
            - name: GAWK_STATS_KEY
              {{- if .Values.config.statsKeyRef }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.statsKeyRef.name | quote }}
                  key: {{ .Values.config.statsKeyRef.key | quote }}
              {{- else }}
              value: {{ .Values.config.statsKey | quote }}
              {{- end }}
            # R17 W2: resume-token HMAC key — WINS over the publish-secret
            # derivation when set (recommended: the publish secret is
            # broadcaster-distributed, so a key derived from it is computable
            # by every broadcaster; this key stays server-side — PR #47).
            - name: GAWK_RESUME_TOKEN_KEY
              {{- if .Values.config.resumeTokenKeyRef }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.resumeTokenKeyRef.name | quote }}
                  key: {{ .Values.config.resumeTokenKeyRef.key | quote }}
              {{- else }}
              value: {{ .Values.config.resumeTokenKey | quote }}
              {{- end }}
            {{- if .Values.telemetry.enabled }}
            # R28 (docs/33 D2): the telemetry session-token key. Its presence
            # is the feature switch — the relay mints a token per session and
            # sends wire 0x0D only while it is set, so the whole client-side
            # collection path is gated on this one value. Shared with the
            # gawk-telemetry service, which verifies tokens statelessly.
            - name: GAWK_TELEMETRY_KEY
              {{- if .Values.telemetry.keyRef }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.telemetry.keyRef.name | quote }}
                  key: {{ .Values.telemetry.keyRef.key | quote }}
              {{- else }}
              value: {{ .Values.telemetry.key | quote }}
              {{- end }}
            - name: GAWK_TELEMETRY_REPORT_INTERVAL
              value: {{ .Values.telemetry.reportInterval | quote }}
            {{- if .Values.telemetry.advertiseUrl }}
            # R37 (docs/40 §4.10): the fleet's ingest URL, advertised to
            # clients in-band (wire 0x12) so foreign-UI sessions report HERE
            # instead of dying at their home deployment's token check. Names
            # the FRONTEND ingress (ingest rides it), not this relay.
            - name: GAWK_TELEMETRY_ADVERTISE_URL
              value: {{ .Values.telemetry.advertiseUrl | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.config.serverName }}
            # R37 (docs/40 §4.4): the display name server pickers show for
            # this relay (wire 0x11 on /echo).
            - name: GAWK_SERVER_NAME
              value: {{ .Values.config.serverName | quote }}
            {{- end }}
            # R17 W1: the QUIC stateless reset key (docs/22 Decision 3) —
            # SHARED across all relay pods (that is the whole point), so it
            # belongs in a Secret via statelessResetKeyRef in any multi-pod
            # deploy. Empty disables (abrupt pod death then costs the ~30s
            # idle timeout instead of ~1 RTT).
            - name: GAWK_STATELESS_RESET_KEY
              {{- if .Values.config.statelessResetKeyRef }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.statelessResetKeyRef.name | quote }}
                  key: {{ .Values.config.statelessResetKeyRef.key | quote }}
              {{- else }}
              value: {{ .Values.config.statelessResetKey | quote }}
              {{- end }}
            - name: GAWK_CONN_RATE_LIMIT
              value: {{ .Values.config.connRateLimit | quote }}
            - name: GAWK_CONN_BURST_LIMIT
              value: {{ .Values.config.connBurstLimit | quote }}
            {{- with .Values.config.trustedCidrs }}
            - name: GAWK_TRUSTED_CIDRS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: GAWK_MAX_BANDWIDTH
              value: {{ .Values.config.maxBandwidth | quote }}
            - name: GAWK_MAX_KEYFRAME_BYTES
              value: {{ .Values.config.maxKeyframeBytes | quote }}
            - name: GAWK_KEYFRAME_WRITE_TIMEOUT
              value: {{ .Values.config.keyframeWriteTimeout | quote }}
            - name: GAWK_DVR_WINDOW
              value: {{ .Values.config.dvrWindow | quote }}
            - name: GAWK_DVR_MAX_BYTES
              value: {{ .Values.config.dvrMaxBytes | quote }}
            - name: GAWK_DVR_MAX_CATCHUP
              value: {{ .Values.config.dvrMaxCatchup | quote }}
            - name: GAWK_DVR_AUDIO
              value: {{ .Values.config.dvrAudio | quote }}
            - name: GAWK_LIVE_EDGE_AUDIO_ON_RELIABLE_STREAM
              value: {{ .Values.config.liveEdgeAudioOnReliableStream | quote }}
            - name: GAWK_PARITY_DEFAULT
              value: {{ .Values.config.parityDefault | quote }}
            - name: GAWK_STRIPED_DELIVERY
              value: {{ .Values.config.stripedDelivery | quote }}
            - name: GAWK_MAX_IDLE_TIMEOUT
              value: {{ .Values.config.maxIdleTimeout | quote }}
            - name: GAWK_KEEPALIVE_PERIOD
              value: {{ .Values.config.keepalivePeriod | quote }}
            - name: GAWK_BROADCAST_GRACE
              value: {{ .Values.config.broadcastGrace | quote }}
            - name: GAWK_QUIET_PROBE_LOGS
              value: {{ .Values.config.quietProbeLogs | quote }}
            {{- with .Values.config.allowedOrigins }}
            - name: GAWK_ALLOWED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          # The server is HTTP/3-only (UDP) — kubelet can't probe it with
          # httpGet/tcpSocket, so all probes exec the bundled gawk-echo
          # against localhost. No -cert-hash: verification is skipped,
          # which is correct for a self-probe and keeps probes working
          # across cert renewals.
          startupProbe:
            exec:
              command: &probe ["/gawk-echo", "-url", "https://127.0.0.1:4433/echo", "-count", "1", "-timeout", "2s"]
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            exec:
              command: *probe
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          # Readiness is drain-aware since R17 W1: /readyz on the TCP ops
          # port flips 503 the moment the SIGTERM drain begins (scale-down /
          # HPA hygiene — rollout correctness comes from the active drain,
          # docs/22 Decision 2). Startup/liveness keep the exec probe: the
          # HTTP/3 UDP port itself still can't be probed by kubelet.
          readinessProbe:
            {{- if .Values.metrics.enabled }}
            httpGet:
              path: /readyz
              port: metrics
            {{- else }}
            exec:
              command: *probe
            {{- end }}
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.certificate.secretName }}
