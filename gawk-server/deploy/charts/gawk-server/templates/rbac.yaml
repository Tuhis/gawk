{{- if .Values.config.clusterMode }}
# R17 W3 (docs/22 Decision 8): the per-broadcast origin registry is a set of
# Kubernetes Leases (gawk-bc-<id>) in this namespace. The relay needs exactly
# the Lease verbs — nothing else — so the Role stays minimal on purpose.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gawk-server.fullname" . }}
  labels:
    {{- include "gawk-server.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gawk-server.fullname" . }}-leases
  labels:
    {{- include "gawk-server.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gawk-server.fullname" . }}-leases
  labels:
    {{- include "gawk-server.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gawk-server.fullname" . }}-leases
subjects:
  - kind: ServiceAccount
    name: {{ include "gawk-server.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
