# ONE Service, ClusterIP. Unlike gawk-telemetry there is no public/non-public
# split to render (docs/33 D14): gawk-admin's whole surface is behind the same
# OIDC boundary, and the SPA has to be same-origin with the API it calls or the
# portal's own CSP (`default-src 'self'`) would block it.
#
# ClusterIP by default means the zero-exposure way to use the portal is
#   kubectl -n gawk port-forward svc/gawk-admin 8090:8090
# Routing it publicly is the deliberate opt-in in ingress.yaml.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gawk-admin.fullname" . }}
  labels:
    {{- include "gawk-admin.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "gawk-admin.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
