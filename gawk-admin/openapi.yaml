  /api/v1/content-flags:
    post:
      operationId: postContentFlag
      tags: [screening]
      summary: Report a content sampler's window
      description: |
        The content sampler's report on one broadcast's window (R40). While
        the window is tripped the sampler posts `state: tripped` after every
        sample; when it clears it posts `state: cleared` once.

        The first tripped post for a broadcast with no unresolved flag raises
        one (`201`) and records `content_flag.raised` — in `flag` mode that
        event IS the page — or `content_flag.observed` in `observe` mode.
        Later tripped posts update it (`200`). A cleared post resolves it
        (`200`). `202` means nothing changed: the broadcast is muted by a
        dismissal (`muted`), the session posted about is no longer the
        broadcast's live one (`ended`), or a cleared post found no flag to
        resolve (`ignored`).

        `mode` is required: it decides between paging and silence, so there
        is no default. In `flag` mode, with no enabled webhook that would
        deliver `content_flag.raised`, the post is refused with `503` and
        code `no_flag_route`.

        A flag carries scores and metadata only, never a frame.
      x-gawk-roles: [flagger]
      x-gawk-requires: screening
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentFlagReport' }
            example:
              schema: gawk.content-flag.v1
              broadcastId: ABC234
              publisherEpoch: 5f2c9a0b11d4e6f7
              samplerId: gawk-sampler-0
              mode: flag
              state: tripped
              window: { start: '2026-09-16T09:30:35Z', end: '2026-09-16T09:31:00Z', samples: 6, flaggedSamples: 4 }
              scores: { max: 0.97, mean: 0.81 }
              labels: [FEMALE_GENITALIA_EXPOSED]
              labelCounts: { FEMALE_GENITALIA_EXPOSED: 4 }
              recent: [0.12, 0.2, 0.91, 0.95, 0.97, 0.93]
              summary: sustained explicit signal
      responses:
        '201':
          description: A flag was raised.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentFlagReportResult' }
              example: { status: raised, flagId: 42 }
        '200':
          description: The unresolved flag was updated or resolved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentFlagReportResult' }
              example: { status: updated, flagId: 42 }
        '202':
          description: Nothing changed (muted, ended or ignored).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentFlagReportResult' }
              example: { status: muted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503':
          description: No pager, so no flag; or a dependency is unreachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: no_flag_route
                  message: 'no enabled webhook would deliver content_flag.raised: flagging is paused until one does (docs/71 D12)'
    get:
      operationId: listContentFlags
      tags: [screening]
      summary: List content flags
      description: |
        Returns content flags newest first, with the screening plane's health
        beside them: `screening.flagRoute` is `false` when no enabled webhook
        would page anyone, and `screening.missingShards` lists sampler shards
        that have not polled for 30 seconds — the broadcasts of a missing
        shard are not being screened.

        A flag is unresolved while `open` or `acknowledged`. `signal` is
        `live` while the sampler keeps reporting the window tripped and
        `unknown` once it has gone quiet: a quiet sampler is not evidence of
        a clean broadcast, so an open flag keeps re-paging either way.
      x-gawk-roles: [operator]
      x-gawk-requires: screening
      parameters:
        - name: state
          in: query
          description: '`unresolved` (the default), `resolved` or `all`.'
          schema: { type: string, enum: [unresolved, resolved, all] }
        - name: mode
          in: query
          description: '`flag` (the default), `observe` or `all`.'
          schema: { type: string, enum: [flag, observe, all] }
        - name: limit
          in: query
          description: Page size, at most 500. Defaults to 100.
          schema: { type: integer, format: int32, minimum: 1 }
      responses:
        '200':
          description: The flags and the screening plane's health.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: Contains raw broadcast IDs and watch links.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentFlagsPage' }
              example:
                contentFlags:
                  - id: 42
                    mode: flag
                    state: open
                    broadcastId: ABC234
                    broadcastKey: 9f2c41ab77de
                    publisherEpoch: 5f2c9a0b11d4e6f7
                    samplerId: gawk-sampler-0
                    raisedAt: '2026-09-16T09:31:00Z'
                    updatedAt: '2026-09-16T09:33:05Z'
                    lastPostAt: '2026-09-16T09:33:05Z'
                    signal: live
                    window: { start: '2026-09-16T09:32:40Z', end: '2026-09-16T09:33:05Z', samples: 6, flaggedSamples: 5 }
                    scores: { max: 0.97, mean: 0.84 }
                    labels: [FEMALE_GENITALIA_EXPOSED]
                    labelCounts: { FEMALE_GENITALIA_EXPOSED: 5 }
                    peakScore: 0.97
                    reminders: 0
                    trips: 1
                    returnedAfterReview: false
                    links: { watch: 'https://gawk.example/#/view/ABC234' }
                screening:
                  flagRoute: true
                  expectedShards: 2
                  missingShards: []
                  lastPollAt: '2026-09-16T09:33:04Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/content-flags/{id}/acknowledge:
    post:
      operationId: acknowledgeContentFlag
      tags: [screening]
      summary: Acknowledge a content flag
      description: |
        Says "I'm looking": the flag stops re-paging and no deadline kill
        applies to it. It stays unresolved until the sampler clears it, the
        broadcast ends, or an operator dismisses it or kills the broadcast.
        Only an open `flag`-mode flag can be acknowledged; anything else
        returns `409` with code `content_flag_state`.
      x-gawk-roles: [operator]
      x-gawk-requires: screening
      parameters:
        - name: id
          in: path
          required: true
          description: The flag's `id`.
          schema: { type: integer, format: int64 }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyRequest' }
            example: {}
      responses:
        '200':
          description: The acknowledged flag.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: Contains the raw broadcast ID and its watch link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentFlag' }
              example:
                id: 42
                mode: flag
                state: acknowledged
                broadcastId: ABC234
                broadcastKey: 9f2c41ab77de
                publisherEpoch: 5f2c9a0b11d4e6f7
                samplerId: gawk-sampler-0
                raisedAt: '2026-09-16T09:31:00Z'
                updatedAt: '2026-09-16T09:34:00Z'
                lastPostAt: '2026-09-16T09:33:55Z'
                acknowledgedAt: '2026-09-16T09:34:00Z'
                acknowledgedBy: operator@example.org
                signal: live
                window: { start: '2026-09-16T09:33:30Z', end: '2026-09-16T09:33:55Z', samples: 6, flaggedSamples: 5 }
                scores: { max: 0.97, mean: 0.84 }
                labels: [FEMALE_GENITALIA_EXPOSED]
                peakScore: 0.97
                reminders: 0
                trips: 1
                returnedAfterReview: false
                links: { watch: 'https://gawk.example/#/view/ABC234' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/content-flags/{id}/dismiss:
    post:
      operationId: dismissContentFlag
      tags: [screening]
      summary: Dismiss a content flag
      description: |
        Resolves the flag as `dismissed`, with the operator's `reason`, and
        mutes re-flagging of its broadcast for the chosen `scope` (R70):
        `episode` until the sampler next reports the window cleared for
        this publisher session, `duration` for the deployment's mute period
        (the default, and R40's only kind), `session` until this publisher
        session ends. The two session-bound scopes are capped at 24 hours.
        When the mute ends, a signal that persists raises a new flag, marked
        `returnedAfterReview`. Records `content_flag.resolved` with the
        reason. An empty body is `{"scope": "duration"}`. An already
        resolved or an `observe`-mode flag returns `409` with code
        `content_flag_state`; an unknown reason or scope is `400`.
      x-gawk-roles: [operator]
      x-gawk-requires: screening
      parameters:
        - name: id
          in: path
          required: true
          description: The flag's `id`.
          schema: { type: integer, format: int64 }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DismissContentFlagRequest' }
            example: { reason: game_scene, scope: episode }
      responses:
        '200':
          description: The dismissed flag, with the mute's end.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: Contains the raw broadcast ID and its watch link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentFlag' }
              example:
                id: 42
                mode: flag
                state: resolved
                resolution: dismissed
                broadcastId: ABC234
                broadcastKey: 9f2c41ab77de
                publisherEpoch: 5f2c9a0b11d4e6f7
                samplerId: gawk-sampler-0
                raisedAt: '2026-09-16T09:31:00Z'
                updatedAt: '2026-09-16T09:35:00Z'
                lastPostAt: '2026-09-16T09:34:55Z'
                resolvedAt: '2026-09-16T09:35:00Z'
                resolvedBy: operator@example.org
                signal: live
                window: { start: '2026-09-16T09:34:30Z', end: '2026-09-16T09:34:55Z', samples: 6, flaggedSamples: 4 }
                scores: { max: 0.91, mean: 0.8 }
                labels: [FEMALE_GENITALIA_EXPOSED]
                peakScore: 0.97
                reminders: 0
                trips: 1
                returnedAfterReview: false
                mutedUntil: '2026-09-16T10:05:00Z'
                links: { watch: 'https://gawk.example/#/view/ABC234' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/screening/targets:
    get:
      operationId: listScreeningTargets
      tags: [screening]
      summary: List one sampler shard's screening targets
      description: |
        The content sampler's work list (R40): every live origin broadcast
        whose publisher is active and whose key falls into shard `shard` of
        `of`, with the ops address of the relay pod holding it. Each poll is
        recorded; a shard that stops polling is reported missing by
        `listContentFlags`.

        `exempt` broadcasts are listed so the sampler's metrics see them, and
        are not sampled. `muted` ones are sampled, and their `flag`-mode
        reports answer `202 muted`. With `flagRoute: false`, a sampler in
        `flag` mode samples nothing.
      x-gawk-roles: [flagger]
      x-gawk-requires: screening
      parameters:
        - name: shard
          in: query
          required: true
          description: This sampler's share, `0` to `of - 1`.
          schema: { type: integer, format: int32, minimum: 0 }
        - name: of
          in: query
          required: true
          description: How many shares there are, 1 to 64.
          schema: { type: integer, format: int32, minimum: 1, maximum: 64 }
      responses:
        '200':
          description: The shard's targets.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: Contains raw broadcast IDs and relay pod addresses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningTargets' }
              example:
                schema: gawk.screening.targets.v1
                shard: 0
                of: 2
                flagRoute: true
                targets:
                  - broadcastId: ABC234
                    broadcastKey: 9f2c41ab77de
                    publisherEpoch: 5f2c9a0b11d4e6f7
                    relay: http://10.42.0.7:2112
                    muted: false
                    exempt: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/screening/samples:
    post:
      operationId: postScreeningSamples
      tags: [screening]
      summary: Store a sampler's samples
      description: |
        One content sampler batch: per publisher session, how many samples it
        scored and the ones at or above its floor. The server numbers them —
        a sent sample is the session's count so far plus its `position` —
        so the numbering survives a sampler restart, and a gap in it always
        means "scored below the floor". These are the data
        `replayScreening` runs over.
      x-gawk-roles: [flagger]
      x-gawk-requires: screening
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SampleBatch' }
            example:
              schema: gawk.screening.samples.v1
              samplerId: gawk-sampler-1
              mode: observe
              floor: 0.3
              labels: [FEMALE_GENITALIA_EXPOSED, MALE_GENITALIA_EXPOSED, ANUS_EXPOSED]
              rule: { threshold: 0.5, window: 6, windowHits: 3 }
              sessions:
                - broadcastId: ABC234
                  broadcastKey: 9f2c41ab77de
                  publisherEpoch: 5f2c9a0b11d4e6f7
                  taken: 1
                  firstAt: '2026-09-16T09:31:00Z'
                  lastAt: '2026-09-16T09:31:00Z'
                  samples:
                    - position: 1
                      at: '2026-09-16T09:31:00Z'
                      scores: { FEMALE_GENITALIA_EXPOSED: 0.41, MALE_GENITALIA_EXPOSED: 0, ANUS_EXPOSED: 0.02 }
      responses:
        '200':
          description: How many samples were stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SamplesResult' }
              example: { stored: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/screening/replay:
    post:
      operationId: replayScreening
      tags: [screening]
      summary: Replay a candidate window rule over stored samples
      description: |
        Answers "what would this setting have done?" (R40 calibration): runs
        the sampler's window rule — trip when at least `windowHits` of the
        last `window` samples score at or above `threshold`, clear when none
        does — over every stored session overlapping `from`–`to`, and counts
        the trips in the range per 100 broadcast-hours.

        A `threshold` below the highest sample floor among those sessions is
        refused with `400`: below it, a missing sample no longer means "below
        the threshold".
      x-gawk-roles: [operator]
      x-gawk-requires: screening
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplayRequest' }
            example:
              threshold: 0.8
              window: 6
              windowHits: 4
              from: '2026-09-09T00:00:00Z'
              to: '2026-09-16T00:00:00Z'
      responses:
        '200':
          description: The would-trips.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: Contains raw broadcast IDs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplayResult' }
              example:
                schema: gawk.screening.replay.v1
                request: { threshold: 0.8, window: 6, windowHits: 4, from: '2026-09-09T00:00:00Z', to: '2026-09-16T00:00:00Z' }
                floor: 0.3
                sessions: 212
                samplesTaken: 98113
                samplesStored: 2871
                broadcastHours: 136.4
                wouldTrips: 1
                wouldTripsPer100h: 0.73
                trips:
                  - broadcastKey: 9f2c41ab77de
                    broadcastId: ABC234
                    publisherEpoch: 5f2c9a0b11d4e6f7
                    at: '2026-09-12T21:04:05Z'
                    peakScore: 0.86
                truncated: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/screening/timeline:
    get:
      operationId: getScreeningTimeline
      tags: [screening]
      summary: One broadcast's moderation timeline
      description: |
        Everything the portal's broadcast drill-down draws (R70): the
        broadcast's sampled publisher sessions with the window rule each
        sampler reported, its stored samples bucketed (the highest score per
        label, and how many samples reached the session's threshold and the
        critical level), its content flags of both modes, its events, the
        levels in force, and a computed `summary` with a `pattern` and a
        `suggestion`. The suggestion pre-selects a choice in the portal; it
        never acts.

        Keyed by the broadcast key, so a timeline outlives the broadcast.
        `to` defaults to now; `from` to the broadcast's first sampled session
        in the 24 hours before `to` (at least 10 minutes before `to`). The
        range may be at most 48 hours. `bucket` (seconds) defaults to about
        300 buckets across the range, never under 5 seconds or over 1 500
        buckets. A bucket with no stored samples is omitted: inside a
        session's span it was sampled below the floor, outside every span
        it was not sampled. Samples are pruned after the deployment's sample
        retention, so an older range has incidents and events but no buckets.
      x-gawk-roles: [operator]
      x-gawk-requires: screening
      parameters:
        - name: key
          in: query
          required: true
          description: The broadcast key.
          schema: { type: string, pattern: '^[0-9a-f]{1,64}$' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: bucket
          in: query
          description: Bucket width in seconds.
          schema: { type: integer, format: int32, minimum: 1 }
      responses:
        '200':
          description: The timeline.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: Contains the raw broadcast ID and its watch link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningTimeline' }
              example:
                schema: gawk.screening.timeline.v1
                broadcastKey: 9f2c41ab77de
                broadcastId: ABC234
                live: true
                from: '2026-10-15T19:42:00Z'
                to: '2026-10-15T21:56:00Z'
                bucketSeconds: 30
                truncated: false
                levels: { floor: 0.3, threshold: 0.5, window: 6, windowHits: 3, critical: 0.7, sustainedAfterSeconds: 180, rejoinSeconds: 600 }
                labels: [FEMALE_GENITALIA_EXPOSED, MALE_GENITALIA_EXPOSED, ANUS_EXPOSED]
                sessions:
                  - publisherEpoch: 5f2c9a0b11d4e6f7
                    broadcastId: ABC234
                    firstSampleAt: '2026-10-15T19:42:00Z'
                    lastSampleAt: '2026-10-15T21:56:00Z'
                    samplesTaken: 1608
                    samplesStored: 512
                    floor: 0.3
                    threshold: 0.5
                    window: 6
                    windowHits: 3
                    mode: flag
                    samplerId: gawk-sampler-0
                buckets:
                  - start: '2026-10-15T20:53:00Z'
                    max: 0.79
                    scores: { FEMALE_GENITALIA_EXPOSED: 0, MALE_GENITALIA_EXPOSED: 0.79, ANUS_EXPOSED: 0.41 }
                    stored: 6
                    above: 5
                    critical: 2
                incidents: []
                events:
                  - id: 812
                    type: content_flag.raised
                    occurredAt: '2026-10-15T20:54:00Z'
                    actor: service-account-gawk-sampler
                    summary: 'content flag raised on broadcast ABC234: 4 of 6 samples flagged (MALE_GENITALIA_EXPOSED), peak score 0.79 — join and judge it'
                summary:
                  pattern: recurring
                  thresholdKnown: true
                  sampledSeconds: 7800
                  aboveSeconds: 3360
                  criticalSeconds: 1210
                  longestRunSeconds: 2460
                  runs: 4
                  sustainedRuns: 2
                  peak: 0.84
                  peakLabel: ANUS_EXPOSED
                suggestion:
                  verdict: violation
                  banSeconds: 604800
                  why: 'the signal came back: two sustained runs, or a return after review'
                links: { watch: 'https://gawk.example/#/view/ABC234' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An access token issued by the deployment's OIDC provider. Its role
        claim must include the role the operation lists under `x-gawk-roles`.

  responses:
    BadRequest:
      description: The request is malformed or a target could not be resolved.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: bad_request
              message: reason is required
    Unauthorized:
      description: The bearer token is missing or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: unauthorized
              message: a valid bearer token is required
    Forbidden:
      description: The token lacks the required role.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: forbidden
              message: this account does not hold the operator role
    TooManyRequests:
      description: Too many rejected tokens from this address.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, format: int32 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: rate_limited
              message: too many invalid credentials; slow down
    NotFound:
      description: No such object, or the feature is disabled.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: not_found
              message: no such endpoint
    Conflict:
      description: The object's current state refuses the request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: source_immutable
              message: webhook ops-pager is defined by chart values and cannot be changed from the portal
    Internal:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: internal
              message: internal error
    Unavailable:
      description: A dependency is unreachable; retry later.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: unavailable
              message: the moderation database is unreachable; enforcement of existing bans is unaffected

  schemas:
    ErrorCode:
      type: string
      description: |
        Machine-readable error code. The enum only grows; treat unknown values
        as unknown. The first four are issued by the authentication layer and
        can occur on any operation that requires a role.
      enum:
        # From the authentication layer, on any operation with a role.
        - unauthorized
        - idp_unavailable
        - forbidden
        - rate_limited
        # From the handlers.
        - bad_request
        - not_found
        - duplicate_active
        - duplicate_name
        - source_immutable
        - internal
        - unavailable
        - invalid_target
        - ban_not_active
        - room_exists
        - room_not_static
        - room_not_dynamic
        - room_not_owned
        - no_flag_route
        - screening_not_allowed
        - content_flag_state
        - pop_exists
        - pop_revoked
        - wall_code_taken

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message:
          type: string
          description: Human-readable explanation, for display only.

    Error:
      type: object
      description: The error envelope every failing operation returns.
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }

    EventType:
      type: string
      description: |
        The type of a recorded event. The enum only grows; treat unknown
        values as unknown.

        The first sixteen are moderation events — what an operator, or the
        content-flag lifecycle (R40), did; the `pop.*` five (R74) audit an
        operator's changes to a PoP relay. `content_flag.observed` is a
        screening row: what a sampler in observe mode would have flagged. The
        rest are activity events ingested from the relay event bus (R50),
        present only on a deployment with the bus configured; filter with
        the `category` query parameter rather than by listing types.
      enum:
        - broadcast.killed
        - ban.created
        - ban.expired
        - ban.removed
        - content_flag.raised
        - content_flag.reminded
        - content_flag.resolved
        - room.created
        - room.ended
        - room.secret_rotated
        - room.screening_changed
        - pop.created
        - pop.updated
        - pop.repaired
        - pop.revoked
        - pop.deleted
        - content_flag.observed
        - broadcast.started
        - broadcast.publisher_away
        - broadcast.publisher_back
        - broadcast.ended
        - room.opened
        - room.home_changed
        - room.attached
        - room.detached
        - room.participant_joined
        - room.participant_left
        - room.participant_updated

    EventCategory:
      type: string
      description: |
        Which kind of row an event is: `moderation` is the audit trail of
        operator actions, `activity` is what the fleet did, ingested from the
        relay event bus (R50), and `screening` is content-screening
        calibration data (R40). Activity rows exist only where the bus is
        configured; activity and screening rows are pruned by age.
      enum:
        - moderation
        - activity
        - screening

    BroadcastId:
      type: string
      description: |
        A raw, joinable broadcast ID: six characters of the broadcast
        alphabet. Case-insensitive on input, normalized on output.
      example: ABC234

    BroadcastKey:
      type: string
      description: |
        The HMAC'd handle of a broadcast. Stable for the lifetime of the relay
        process and safe to forward: it cannot be used to join.
      example: 9f2c41ab77de

    Me:
      type: object
      description: The calling identity and this deployment's defaults and features.
      required: [email, subject, roles, defaults, features]
      properties:
        email:
          type: string
          description: From the token, when present. Usually empty for a service identity.
        subject:
          type: string
          description: The token's `sub` claim. Always present; the stable identifier.
        roles:
          type: array
          description: The roles this deployment recognized in the token.
          items: { type: string }
        defaults:
          type: object
          description: Server-side defaults a client should read rather than hard-code.
          required: [killCooldownSeconds]
          properties:
            killCooldownSeconds:
              type: integer
              format: int32
              description: Default cooldown for a kill's ID ban.
        features:
          type: object
          description: Optional features this deployment serves. Routes of a disabled feature return `404`.
          required: [rooms, screening, pops, popNamedAddress]
          properties:
            rooms:
              type: boolean
              description: Whether the `/api/v1/rooms` routes are served.
            screening:
              type: boolean
              description: Whether the content-flagging routes (R40) are served.
            pops:
              type: boolean
              description: Whether the `/api/v1/pops` routes (R74) are served.
            popNamedAddress:
              type: boolean
              description: Whether a PoP can be given a named address on this deployment.

    BanTarget:
      type: object
      description: What a ban applies to.
      required: [type, value]
      properties:
        type:
          type: string
          enum: [broadcastId, ip]
        value:
          type: string
          description: A broadcast ID, or a CIDR for an `ip` ban. Always a prefix on output.

    Enforcement:
      type: object
      description: |
        Whether the Kubernetes enforcement object matches the record. Present
        only on a `202`; absent means the two are in sync.

        A pending create means the ban is recorded but not yet enforced. A
        pending removal means the ban is lifted in the record but the target
        is still enforced.
      required: [inSync]
      properties:
        inSync:
          type: boolean
        detail:
          type: string
          description: One sentence describing the pending direction. Suitable for display.

    Ban:
      type: object
      description: One ban record.
      required: [id, target, state, reason, createdAt, createdBy, expiresAt]
      properties:
        id: { type: string, format: uuid }
        target: { $ref: '#/components/schemas/BanTarget' }
        state:
          type: string
          enum: [active, expired, removed]
        reason:
          type: string
          description: Operator-private context. Never included in outbound events.
        createdAt: { type: string, format: date-time }
        createdBy:
          type: string
          description: The identity that created the ban, or `system`.
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: Always present. `null` means the ban is permanent.
        removedAt: { type: string, format: date-time }
        removedBy: { type: string }
        sourceBroadcastId:
          allOf:
            - $ref: '#/components/schemas/BroadcastId'
          description: The broadcast the ban was taken against, if any.
        crName:
          type: string
          description: Name of the Kubernetes enforcement object. Derived from the target.
        enforcement: { $ref: '#/components/schemas/Enforcement' }

    BanConflict:
      type: object
      description: A `409` that returns the active ban already covering the target.
      required: [error, ban]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
        ban: { $ref: '#/components/schemas/Ban' }

    BanCursor:
      type: object
      description: |
        Cursor for ban history. Both halves are needed: `createdAt` alone is
        not unique and `id` alone does not order.
      required: [createdAt, id]
      properties:
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 with nanoseconds. Send it back unchanged.
        id: { type: string, format: uuid }

    BansPage:
      type: object
      required: [bans, nextAfter]
      properties:
        bans:
          type: array
          items: { $ref: '#/components/schemas/Ban' }
        nextAfter:
          oneOf:
            - $ref: '#/components/schemas/BanCursor'
            - type: 'null'
          description: Cursor for the next page, or `null` on the last page.

    CreateBanRequest:
      type: object
      required: [target, reason]
      properties:
        target:
          type: object
          required: [type, value]
          properties:
            type:
              type: string
              enum: [broadcastId, ip]
            value:
              type: string
              description: |
                A broadcast ID, an IP address, a CIDR, or the literal
                `publisher` for an `ip` ban. `publisher` resolves the live
                publisher's address from `sourceBroadcastId`, which is then
                required.
            prefixLength:
              type: integer
              format: int32
              description: |
                Prefix length for an IP ban. Defaults to `32` for IPv4 and
                `64` for IPv6. Rejected if it disagrees with a CIDR in `value`.
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: RFC 3339. `null` or absent means permanent.
        reason:
          type: string
          maxLength: 512
          description: Operator-private context. Never included in outbound events.
        sourceBroadcastId:
          allOf:
            - $ref: '#/components/schemas/BroadcastId'
          description: The broadcast this ban stems from. Required when `target.value` is `publisher`.

    KillRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 512
          description: Operator-private context. Never included in outbound events.
        cooldownSeconds:
          type: integer
          format: int32
          minimum: 1
          description: Duration of the ID ban. Defaults to `defaults.killCooldownSeconds` from `GET /api/v1/me`.

    KillResult:
      type: object
      description: The kill response envelope, shared by `201` and `202`.
      required: [ban]
      properties:
        ban: { $ref: '#/components/schemas/Ban' }

    PodPlacement:
      type: object
      description: One relay pod's view of a broadcast.
      required: [pod, role, viewersLocal]
      properties:
        pod: { type: string }
        role:
          type: string
          enum: [origin, edge]
          description: '`origin` is the pod the publisher is connected to; `edge` pulls from it.'
        viewersLocal:
          type: integer
          format: int32
          description: Viewers attached to this pod.

    BroadcastLinks:
      type: object
      description: Deep links. Each is omitted when its base URL is not configured.
      properties:
        watch: { type: string, format: uri }
        telemetry: { type: string, format: uri }

    BanState:
      type: object
      description: Whether an active ban covers a broadcast.
      required: [banned]
      properties:
        banned: { type: boolean }
        ban:
          allOf:
            - $ref: '#/components/schemas/Ban'
          description: The covering ban. An ID ban is preferred over an IP ban.

    Broadcast:
      type: object
      description: One broadcast, merged across every pod carrying it.
      required: [id, key, publisherActive, viewersGlobal, pods, banState]
      properties:
        id: { $ref: '#/components/schemas/BroadcastId' }
        key: { $ref: '#/components/schemas/BroadcastKey' }
        publisherActive:
          type: boolean
          description: Whether a publisher session is currently attached.
        publisherRemoteIp:
          type: string
          description: The publisher's address as observed by the relay. Absent when no publisher is attached.
        startedAt: { type: string, format: date-time }
        viewersGlobal:
          type: integer
          format: int32
          description: Viewers across the whole fleet.
        pods:
          type: array
          items: { $ref: '#/components/schemas/PodPlacement' }
        links: { $ref: '#/components/schemas/BroadcastLinks' }
        banState:
          oneOf:
            - $ref: '#/components/schemas/BanState'
            - type: 'null'
          description: '`null` means unknown (the moderation database was unreachable), not "not banned".'
        contentFlag:
          allOf:
            - $ref: '#/components/schemas/ContentFlag'
          description: |
            The broadcast's unresolved `flag`-mode content flag (R40), which
            a client pins to the top of the list. Absent when there is none,
            and always absent when screening is off.
        pop:
          allOf:
            - $ref: '#/components/schemas/BroadcastPop'
          description: |
            The PoP a party broadcast started at (R74). Absent on every other
            broadcast. A party-only row (home does not carry it) has an empty
            `key`, no `pods` and no `publisherRemoteIp`; it can be killed like
            any other, and the kill reaches the PoP.

    BroadcastPop:
      type: object
      required: [name, forwarded, localViewers, outsideViewers]
      properties:
        name:
          type: string
          description: The PoP's name.
        forwarded:
          type: boolean
          description: Whether home is carrying it now; false is party-only.
        label: { type: string }
        publisherLanAddr:
          type: string
          description: The broadcaster's LAN address at the party, as the PoP reports it.
        localViewers: { type: integer, format: int32 }
        outsideViewers: { type: integer, format: int32 }

    BroadcastsPage:
      type: object
      required: [broadcasts, podsResolved, podsAnswered]
      properties:
        broadcasts:
          type: array
          items: { $ref: '#/components/schemas/Broadcast' }
        podsResolved:
          type: integer
          format: int32
          description: Number of relay pods found.
        podsAnswered:
          type: integer
          format: int32
          description: Number of pods that answered. If lower than `podsResolved`, the list is incomplete.

    Delivery:
      type: object
      description: One webhook's delivery attempt for one event.
      required: [webhookName, state, attempts]
      properties:
        webhookName: { type: string }
        state:
          type: string
          enum: [pending, delivered, failed]
          description: '`failed` is terminal: the retry budget is exhausted.'
        attempts: { type: integer, format: int32 }
        lastError: { type: string }
        deliveredAt: { type: string, format: date-time }
        nextAttemptAt: { type: string, format: date-time }

    Event:
      type: object
      description: One event in the audit feed.
      required: [id, type, occurredAt, actor, category, deliveries]
      properties:
        id:
          type: integer
          format: int64
          description: Monotonic; the feed's paging cursor.
        type: { $ref: '#/components/schemas/EventType' }
        occurredAt: { type: string, format: date-time }
        actor:
          type: string
          description: The identity that caused the event, or `system`.
        broadcastKey: { $ref: '#/components/schemas/BroadcastKey' }
        broadcastId:
          allOf:
            - $ref: '#/components/schemas/BroadcastId'
          description: The raw broadcast ID, as the outbound event of this row also carries it.
        reason: { type: string }
        category:
          allOf:
            - $ref: '#/components/schemas/EventCategory'
          description: Which kind of row this is. Always present.
        summary:
          type: string
          description: One-sentence rendering of the event, suitable for display.
        deliveries:
          type: array
          description: Per-webhook delivery state.
          items: { $ref: '#/components/schemas/Delivery' }

    EventsPage:
      type: object
      required: [events, nextAfterId]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        nextAfterId:
          type: [integer, 'null']
          format: int64
          description: The `afterId` for the next page, or `null` on the last page.

    Relay:
      type: object
      description: One relay pod's effective configuration, as reported by the pod.
      required: [pod, reachable]
      properties:
        pod: { type: string }
        reachable: { type: boolean }
        version: { type: string }
        config:
          type: object
          description: |
            The pod's sanitized configuration, with secrets redacted by the
            relay. Free-form: its keys follow the relay's flags, which are the
            relay's contract rather than this API's.
          additionalProperties: true
        error:
          type: string
          description: Why the pod could not be scraped or its config could not be read.

    RelaysPage:
      type: object
      required: [relays]
      properties:
        relays:
          type: array
          items: { $ref: '#/components/schemas/Relay' }
        bus:
          allOf:
            - $ref: '#/components/schemas/EventBusHealth'
          description: |
            The relay event bus's health (R50). Absent when no bus is
            configured — which distinguishes "not configured" from "quiet".

    EventBusHealth:
      type: object
      description: |
        Whether the NATS JetStream the relays publish to is alive, and what
        this portal has heard from each publishing pod. Read it before relying
        on anything the bus feeds.
      required: [stream, connected, messages, bytes]
      properties:
        stream: { type: string }
        connected:
          type: boolean
          description: Whether this portal's NATS connection is up.
        messages:
          type: integer
          format: int64
          description: Messages currently retained in the stream.
        bytes:
          type: integer
          format: int64
        pods:
          type: array
          items: { $ref: '#/components/schemas/EventBusPod' }
        error:
          type: string
          description: Why the stream could not be inspected, when it could not.

    EventBusPod:
      type: object
      required: [pod, lastSeen, lastSeq, gaps]
      properties:
        pod: { type: string }
        lastSeen: { type: string, format: date-time }
        lastSeq:
          type: integer
          format: int64
          description: The last per-pod sequence this portal ingested.
        gaps:
          type: integer
          format: int32
          description: |
            Sequence jumps observed for this pod: events the relay dropped
            (its own counters say why) or that expired unread. Reported, not
            repaired — reconcile against the read API if you need the truth
            after one.

    Webhook:
      type: object
      description: An outbound notification target. Has no secret field; signing secrets are never returned.
      required: [name, url, enabled, source]
      properties:
        id:
          type: string
          format: uuid
          description: Present for `ui` webhooks only.
        name: { type: string }
        url: { type: string, format: uri }
        enabled: { type: boolean }
        source:
          type: string
          enum: [config, ui]
          description: '`config` is defined in chart values and read-only here; `ui` was created through this API.'
        events:
          type: [array, 'null']
          description: The event filter. `null` receives every moderation event and no room activity event.
          items: { $ref: '#/components/schemas/WebhookEvent' }

    WebhookEvent:
      type: string
      description: |
        A value of a webhook's `events` filter. With no filter (`null`) a
        webhook receives every moderation event and none of the four room
        activity events or `content_flag.observed`; a list is exact. The
        activity events are only delivered on a deployment with the relay
        event bus configured. `content_flag.observed` is a content sampler's
        calibration signal (R40): opt-in, so it never wakes a pager that did
        not ask for it.

        `room.participant_rejoined` is not an event type. When a room moves
        to another relay pod its participants reconnect, which the bus reports
        as a `room.participant_left` (`reason: home_moved`) and
        `room.participant_joined` (`rejoin: true`) pair. Both halves are
        dropped unless the filter lists `room.participant_rejoined`.
      enum:
        - broadcast.killed
        - ban.created
        - ban.expired
        - ban.removed
        - content_flag.raised
        - content_flag.reminded
        - content_flag.resolved
        - content_flag.observed
        - room.created
        - room.ended
        - room.secret_rotated
        - room.screening_changed
        - pop.created
        - pop.updated
        - pop.repaired
        - pop.revoked
        - pop.deleted
        - room.attached
        - room.detached
        - room.participant_joined
        - room.participant_left
        - room.participant_rejoined

    WebhookRequest:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
          description: Unique across both sources.
        url: { type: string, format: uri }
        secret:
          type: string
          description: |
            Write-only signing secret. Required on create. On update, empty or
            absent keeps the stored secret.
        enabled: { type: boolean }
        events:
          type: [array, 'null']
          description: |
            The event filter. Absent or `null` keeps the default: every
            moderation event and no room activity event. A list is exact. An
            update replaces the filter, so omitting it restores the default.
            An unknown value returns `400`.
          items: { $ref: '#/components/schemas/WebhookEvent' }

    WebhooksPage:
      type: object
      required: [webhooks]
      properties:
        webhooks:
          type: array
          items: { $ref: '#/components/schemas/Webhook' }

    WebhookTestResult:
      type: object
      description: The outcome of a test delivery. A non-2xx from the receiver is reported with `ok` false.
      required: [ok]
      properties:
        ok: { type: boolean }
        status:
          type: integer
          format: int32
          description: The receiver's HTTP status, if it answered.
        error: { type: string }
        deliveryId:
          type: string
          description: The delivery ID the receiver saw, for matching against its logs.

    Room:
      type: object
      description: |
        One room: its custom resource merged with the live state of the relay
        pod that is home for it. `attachments` and `participants` are present
        only in `getRoom`.
      required: [name, kind, code, live, counts, hasAttachSecret, managed]
      properties:
        name:
          type: string
          description: The custom resource name, which is the normalized room code. Raw and joinable.
        kind:
          type: string
          enum: ['', static, dynamic]
          description: Empty when the custom resource could not be decoded.
        code:
          type: string
          description: The display form of the code. The configured slug, or the upper-cased dynamic code.
        displayName: { type: string }
        maxBroadcasts:
          type: integer
          format: int32
          description: Per-room override. Absent or `0` means the fleet default.
        live:
          type: boolean
          description: Whether a reachable relay pod is home for the room. When `false`, who is in the room is unknown.
        links: { $ref: '#/components/schemas/RoomLinks' }
        counts: { $ref: '#/components/schemas/RoomCounts' }
        attachments:
          type: array
          description: The attached broadcasts in attach order. Only in `getRoom`.
          items: { $ref: '#/components/schemas/RoomAttachment' }
        participants:
          type: array
          description: Everyone in the room. Only in `getRoom`; empty when `live` is `false`.
          items: { $ref: '#/components/schemas/RoomParticipant' }
        homeHolder:
          type: string
          description: The pod holding the room's lease. Empty until a pod has homed it.
        key:
          type: string
          description: The HMAC'd handle of the room, safe to forward. Empty until homed.
        createdAt: { type: string, format: date-time }
        emptySince:
          type: string
          format: date-time
          description: When the room last became empty; used by the grace-period sweep.
        hasAttachSecret:
          type: boolean
          description: Whether a static room requires an attach secret. The secret itself is never returned.
        managed:
          type: boolean
          description: '`true` for rooms created through this API. Rooms applied with `kubectl` are listed and deletable but not managed.'
        screening:
          type: string
          enum: [exempt]
          description: |
            `exempt` while the room's broadcasts are exempt from content
            screening (R40); absent for a screened room. Honoured only on a
            static room with an attach secret.
        mumble:
          $ref: '#/components/schemas/RoomMumble'

    RoomLinks:
      type: object
      description: Absent when the deployment has no `-app-base-url`.
      required: [join]
      properties:
        join:
          type: string
          description: Opens the room in the gawk app. Contains the room code.

    RoomCounts:
      type: object
      required: [participants, streaming, watching, attachments]
      properties:
        participants:
          type: integer
          format: int32
          description: People in the room. `0` when the room is not live.
        streaming:
          type: integer
          format: int32
          description: Participants with a broadcast attached.
        watching:
          type: integer
          format: int32
          description: Participants without one. `streaming + watching = participants`.
        attachments:
          type: integer
          format: int32
          description: Broadcasts attached to the room.

    RoomAttachment:
      type: object
      required: [broadcastId]
      properties:
        broadcastId:
          type: string
          description: The raw broadcast ID. Joinable.
        label: { type: string }
        live:
          type: boolean
          description: '`false` while the broadcaster is away. Absent when the room is not live.'
        viewers:
          type: integer
          format: int32
          description: Viewers of this broadcast. Absent when the room is not live.
        attachedAt: { type: string, format: date-time }
        links: { $ref: '#/components/schemas/AttachmentLinks' }

    AttachmentLinks:
      type: object
      description: Absent when the deployment has no `-app-base-url`.
      required: [watch]
      properties:
        watch:
          type: string
          description: Opens the broadcast in the gawk app.

    RoomParticipant:
      type: object
      required: [id, nickname, clientKind, streaming, speaking]
      properties:
        id:
          type: integer
          format: int32
          description: Per-room participant ID. Re-issued if the room moves to another relay pod.
        nickname:
          type: string
          description: Chosen by the participant. Unauthenticated free text.
        clientKind:
          type: string
          enum: [web-viewer, web-broadcaster, native]
        streaming:
          type: boolean
          description: Whether one of the room's attachments is this participant's broadcast.
        speaking:
          type: boolean
          description: Reserved for a voice bridge. Always `false` today.
        identity:
          type: string
          description: Reserved for an authenticated identity. Absent today.

    RoomsPage:
      type: object
      required: [rooms]
      properties:
        rooms:
          type: array
          items: { $ref: '#/components/schemas/Room' }

    CreateRoomRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: The room slug. Must not have the six-character shape of a dynamic code.
        displayName: { type: string, maxLength: 128 }
        maxBroadcasts:
          type: integer
          format: int32
          minimum: 0
          maximum: 64
          description: '`0` means the fleet default.'
        withAttachSecret:
          type: boolean
          description: Mint an attach secret and return it once in the response.
        mumble:
          $ref: '#/components/schemas/RoomMumble'

    RoomWithSecret:
      type: object
      description: The only response shape that carries a room's attach secret.
      required: [room]
      properties:
        room: { $ref: '#/components/schemas/Room' }
        attachSecret:
          type: string
          description: Returned once, in this response only. It cannot be read back; rotate if lost.

    RoomMumble:
      type: object
      description: |
        A room's voice channel on the deployment's Mumble server (R79),
        absent for a room without voice. A static room names an existing
        channel; a dynamic room created with voice has `temporary: true`, a
        channel the voice bridge creates and Mumble removes when it empties.
        In a request `temporary` must be absent or `false`.
      properties:
        channel:
          type: string
          maxLength: 256
          description: |
            The channel as a "/"-separated path below the root
            (`Friends/Gaming`), with no control characters. Absent or empty
            is the root channel. Not set together with `temporary`.
        temporary:
          type: boolean
          description: A temporary channel. Only a dynamic room has one.

    RoomVoiceRequest:
      type: object
      description: The room's whole voice mapping. Absent or `null` `mumble` removes it.
      properties:
        mumble:
          oneOf:
            - $ref: '#/components/schemas/RoomMumble'
            - type: 'null'

    RoomPatchRequest:
      type: object
      required: [screening]
      properties:
        screening:
          type: string
          enum: ['', exempt]
          description: '`exempt` to exempt the room from content screening, `""` to screen it again.'

    Pop:
      type: object
      description: |
        One PoP (R74): its `Pop` custom resource merged with the live view of
        the relay pod that holds its link. `broadcasts` and `health` are
        present only in `getPop`. The pairing string and the credential are
        never part of it.
      required: [name, state, managed, revoked, pairing, uplink, downlink, limits, guests, namedAddress]
      properties:
        name:
          type: string
          description: The custom resource name, a DNS label of at most 63 characters.
        displayName: { type: string }
        state:
          type: string
          enum: [waiting-for-pairing, linked, offline, revoked, ended, invalid]
          description: |
            `waiting-for-pairing` until the PoP pairs with its current string;
            `ended` once `notAfter` has passed; `invalid` when the custom
            resource could not be decoded.
        stateSince:
          type: string
          format: date-time
          description: When the state began, when known.
        notAfter:
          type: string
          format: date-time
          description: Links are refused after this time. Absent for no end date.
        createdAt: { type: string, format: date-time }
        managed:
          type: boolean
          description: '`true` for PoPs created through this API.'
        revoked: { type: boolean }
        pairing: { $ref: '#/components/schemas/PopPairing' }
        uplink:
          $ref: '#/components/schemas/PopBudget'
          description: The effective uplink budget, defaults applied.
        downlink:
          $ref: '#/components/schemas/PopBudget'
          description: The downlink budget. `0` means unlimited at the PoP.
        limits: { $ref: '#/components/schemas/PopLimits' }
        guests:
          type: object
          required: [autoSwitch]
          properties:
            autoSwitch:
              type: boolean
              description: Whether home suggests the PoP to guests on its network.
        wall:
          type: object
          description: The party wall. Absent when the PoP has none.
          required: [roomCode]
          properties:
            roomCode:
              type: string
              description: The wall's room code. Raw and joinable.
        namedAddress:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
            host:
              type: string
              description: The random host name assigned to the PoP.
            certificateNotAfter:
              type: string
              format: date-time
              description: Expiry of the PoP's issued certificate.
        link: { $ref: '#/components/schemas/PopLink' }
        live: { $ref: '#/components/schemas/PopLive' }
        broadcasts:
          type: array
          description: Broadcasts live at the PoP. Only in `getPop`.
          items: { $ref: '#/components/schemas/PopBroadcast' }
        health:
          type: array
          description: The PoP's own health lines. Only in `getPop`.
          items: { $ref: '#/components/schemas/PopHealthLine' }

    PopPairing:
      type: object
      description: When the current pairing string was issued and expires. The string itself is never returned here.
      required: [paired]
      properties:
        issuedAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: An unused string cannot be redeemed after this. It never ends a credential paired in time.
        paired:
          type: boolean
          description: Whether the PoP holds a credential from the current string.
        pairedAt: { type: string, format: date-time }

    PopBudget:
      type: object
      required: [maxMbps, maxStreams]
      properties:
        maxMbps: { type: integer, format: int32 }
        maxStreams: { type: integer, format: int32 }

    PopLimits:
      type: object
      required: [maxBroadcasts, maxDownlinkStreams]
      properties:
        maxBroadcasts:
          type: integer
          format: int32
          description: How many of the PoP's broadcasts home carries at once.
        maxDownlinkStreams:
          type: integer
          format: int32
          description: How many distinct home broadcasts the PoP may pull at once.

    PopLink:
      type: object
      description: The PoP's link as the relays last saw it.
      required: [connected]
      properties:
        connected: { type: boolean }
        since: { type: string, format: date-time }
        version:
          type: string
          description: The PoP's build.
        proto:
          type: integer
          format: int32
          description: The link protocol's minor version.
        publicAddrs:
          type: array
          description: The PoP's public IPv4 addresses and IPv6 /64 prefixes.
          items: { type: string }
        lanAddr:
          type: string
          description: The PoP's LAN address.
        pod:
          type: string
          description: The relay pod holding the link.

    PopLive:
      type: object
      description: The link-home pod's live counts. Absent when no reachable pod holds the link.
      required: [pod, live, forwarded, outsideViewers, uplinkMbps, uplinkStreams, uplink, downlink, downlinkStreams, guestsConnected, offersSent]
      properties:
        pod: { type: string }
        live:
          type: integer
          format: int32
          description: Broadcasts live at the PoP.
        forwarded:
          type: integer
          format: int32
          description: Of those, the ones home is carrying now.
        outsideViewers:
          type: integer
          format: int32
          description: Viewers of the PoP's broadcasts outside the party.
        uplinkMbps: { type: number }
        uplinkStreams: { type: integer, format: int32 }
        uplink:
          $ref: '#/components/schemas/PopBudget'
          description: The effective uplink ceiling, lowered by the host if set.
        downlink:
          $ref: '#/components/schemas/PopBudget'
          description: The effective downlink ceiling.
        downlinkStreams: { type: integer, format: int32 }
        guestsConnected: { type: integer, format: int32 }
        offersSent:
          type: integer
          format: int32
          description: Times home suggested this PoP to a guest.

    PopBroadcast:
      type: object
      required: [id, localViewers, outsideViewers, forwarded]
      properties:
        id:
          type: string
          description: The raw broadcast ID. Joinable.
        label: { type: string }
        publisherLanAddr:
          type: string
          description: The broadcaster's LAN address at the party.
        localViewers: { type: integer, format: int32 }
        outsideViewers: { type: integer, format: int32 }
        forwarded:
          type: boolean
          description: Whether home is carrying it now.
        wall:
          type: string
          enum: ['on', hidden]
          description: Its state on the party wall. Absent when the PoP has no wall.
        links: { $ref: '#/components/schemas/AttachmentLinks' }

    PopHealthLine:
      type: object
      required: [key, ok]
      properties:
        key: { type: string }
        ok: { type: boolean }
        detail: { type: string }

    PopsPage:
      type: object
      required: [pops]
      properties:
        pops:
          type: array
          items: { $ref: '#/components/schemas/Pop' }

    PopWithPairing:
      type: object
      description: The only response shape that carries a pairing string.
      required: [pop, pairingString, expiresAt]
      properties:
        pop: { $ref: '#/components/schemas/Pop' }
        pairingString:
          type: string
          description: '`gawk-pair:<home endpoint>/<token>`. Returned once; only its SHA-256 is stored. Re-pair if lost.'
        expiresAt:
          type: string
          format: date-time
          description: When the string can no longer be redeemed.

    PopBudgetRequest:
      type: object
      properties:
        maxMbps:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: '`0` means the default.'
        maxStreams:
          type: integer
          format: int32
          minimum: 0
          maximum: 64
          description: '`0` means the default.'

    PopLimitsRequest:
      type: object
      properties:
        maxBroadcasts:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: '`0` means the default, 40.'
        maxDownlinkStreams:
          type: integer
          format: int32
          minimum: 0
          maximum: 64
          description: '`0` means the default, 20.'

    PopGuestsRequest:
      type: object
      properties:
        autoSwitch:
          type: boolean
          description: Absent means the default, on.

    CreatePopRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 63
          description: A DNS label. Also the default wall code.
        displayName:
          type: string
          maxLength: 64
          description: Defaults to the name.
        notAfter:
          type: string
          format: date-time
          description: Optional end date; must be in the future.
        uplink: { $ref: '#/components/schemas/PopBudgetRequest' }
        downlink: { $ref: '#/components/schemas/PopBudgetRequest' }
        limits: { $ref: '#/components/schemas/PopLimitsRequest' }
        guests: { $ref: '#/components/schemas/PopGuestsRequest' }
        wall:
          type: object
          description: Create the party wall. Needs rooms enabled.
          properties:
            roomCode:
              type: string
              description: Defaults to the PoP name.
            maxParticipants:
              type: integer
              format: int32
              minimum: 0
              maximum: 1000
              description: '`0` means the fleet default.'
        namedAddress:
          type: boolean
          description: Give the PoP a named address. Needs the named tier configured.

    PopPatchRequest:
      type: object
      properties:
        displayName: { type: string, maxLength: 64 }
        notAfter:
          type: string
          description: An RFC 3339 time in the future, or `""` to clear the end date.
        uplink: { $ref: '#/components/schemas/PopBudgetRequest' }
        downlink: { $ref: '#/components/schemas/PopBudgetRequest' }
        limits: { $ref: '#/components/schemas/PopLimitsRequest' }
        guests: { $ref: '#/components/schemas/PopGuestsRequest' }
        namedAddress: { type: boolean }

    EmptyRequest:
      type: object
      description: No fields. `{}` or no body at all.
      properties: {}

    ContentFlagWindow:
      type: object
      description: The sampler's window at its last report. Never a frame.
      required: [start, end, samples, flaggedSamples]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        samples:
          type: integer
          format: int32
          description: Samples in the window.
        flaggedSamples:
          type: integer
          format: int32
          description: Samples in the window that scored at or above the threshold.

    ContentFlagScores:
      type: object
      description: The window's highest and mean sample score, 0 to 1.
      required: [max, mean]
      properties:
        max: { type: number, minimum: 0, maximum: 1 }
        mean: { type: number, minimum: 0, maximum: 1 }

    ContentFlagLinks:
      type: object
      description: Absent when the deployment has no `-app-base-url`.
      required: [watch]
      properties:
        watch:
          type: string
          format: uri
          description: Opens the broadcast in the gawk app — how an operator judges a flag.

    ContentFlag:
      type: object
      description: |
        One content flag (R40). A flag is unresolved while `open` or
        `acknowledged`; it ends in exactly one `resolution`. `observe`-mode
        flags are calibration data: they page nobody and cannot be
        acknowledged or dismissed.
      required: [id, mode, state, broadcastId, broadcastKey, publisherEpoch, samplerId, raisedAt, updatedAt,
        lastPostAt, signal, window, scores, labels, peakScore, reminders, trips, returnedAfterReview]
      properties:
        id: { type: integer, format: int64 }
        mode:
          type: string
          enum: [flag, observe]
          description: '`flag` pages a human; `observe` is what a sampler in observe mode would have flagged.'
        state:
          type: string
          enum: [open, acknowledged, resolved]
        resolution:
          type: string
          enum: [cleared, dismissed, killed, auto_killed, ended]
          description: How the flag ended. Absent while it is unresolved.
        resolutionReason:
          type: string
          enum: [deadline, policy, stale, game_scene, not_explicit, detector_error, other]
          description: |
            Why the flag resolved: `deadline`, `policy` or `stale` for an
            automatic resolution; for a dismissal, the operator's reason
            (R70). Absent otherwise.
        broadcastId: { $ref: '#/components/schemas/BroadcastId' }
        broadcastKey: { $ref: '#/components/schemas/BroadcastKey' }
        publisherEpoch:
          type: string
          description: The publisher session the flag belongs to. A new session raises a new flag.
        samplerId:
          type: string
          description: The sampler instance that last reported.
        raisedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastPostAt:
          type: string
          format: date-time
          description: The sampler's last report on the flag.
        acknowledgedAt: { type: string, format: date-time }
        acknowledgedBy: { type: string }
        resolvedAt: { type: string, format: date-time }
        resolvedBy: { type: string }
        signal:
          type: string
          enum: [live, unknown, cleared]
          description: |
            `live` while the sampler keeps reporting the window tripped,
            `unknown` once it has been quiet for longer than the deployment's
            stale-after, `cleared` when it reported the window clear. An open
            flag re-pages while its signal is live or unknown.
        window: { $ref: '#/components/schemas/ContentFlagWindow' }
        scores: { $ref: '#/components/schemas/ContentFlagScores' }
        labels:
          type: array
          description: The detector labels that fired in the window.
          items: { type: string }
        labelCounts:
          type: object
          description: How many of the window's samples each label fired in, by label.
          additionalProperties: true
        peakScore:
          type: number
          minimum: 0
          maximum: 1
          description: The highest window score any report for the flag carried.
        reminders:
          type: integer
          format: int32
          description: How many `content_flag.reminded` pages the flag has sent.
        mutedUntil:
          type: string
          format: date-time
          description: |
            For a dismissed flag, when the mute its dismissal set ends (an
            `episode` mute ends at the clear that ended it). For any other,
            while a mute covers the flag's publisher session, when it ends.
        muteScope:
          type: string
          enum: [episode, duration, session]
          description: The dismissal's mute scope (R70). Absent on a flag that was not dismissed.
        trips:
          type: integer
          format: int32
          minimum: 1
          description: |
            How many times the sampler's window tripped within this one
            incident (R70): a re-trip inside the deployment's rejoin window
            is the same incident and pages nobody again.
        clearedAt:
          type: string
          format: date-time
          description: |
            Set while the sampler's clear of an unacknowledged flag is held
            for the rejoin window (R70); the signal reads `cleared` and the
            flag resolves `cleared` when the window passes.
        returnedAfterReview:
          type: boolean
          description: |
            True when an earlier incident on the broadcast was acknowledged,
            dismissed or killed within the last 24 hours and the signal came
            back (R70).
        links: { $ref: '#/components/schemas/ContentFlagLinks' }

    ScreeningTimeline:
      type: object
      required: [schema, broadcastKey, live, from, to, bucketSeconds, truncated, levels, labels, sessions, buckets,
        incidents, events, summary, suggestion]
      properties:
        schema: { type: string, const: gawk.screening.timeline.v1 }
        broadcastKey: { $ref: '#/components/schemas/BroadcastKey' }
        broadcastId: { $ref: '#/components/schemas/BroadcastId' }
        live:
          type: boolean
          description: Whether the fleet scan sees the broadcast now.
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        bucketSeconds: { type: integer, format: int32 }
        truncated:
          type: boolean
          description: The range held more stored samples than one read returns; the newest are missing.
        levels: { $ref: '#/components/schemas/TimelineLevels' }
        labels:
          type: array
          description: The flagged labels the sessions scored.
          items: { type: string }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/TimelineSession' }
        buckets:
          type: array
          items: { $ref: '#/components/schemas/TimelineBucket' }
        incidents:
          type: array
          description: The broadcast's content flags of both modes in the range, oldest first.
          items: { $ref: '#/components/schemas/ContentFlag' }
        events:
          type: array
          description: The broadcast's events in the range, newest first, at most 500.
          items: { $ref: '#/components/schemas/TimelineEvent' }
        summary: { $ref: '#/components/schemas/TimelineSummary' }
        suggestion: { $ref: '#/components/schemas/TimelineSuggestion' }
        links: { $ref: '#/components/schemas/ContentFlagLinks' }

    TimelineLevels:
      type: object
      description: |
        Every level the timeline draws. `floor` and the window rule are the
        sampler's (the newest session's that reported one); `critical`,
        `sustainedAfterSeconds` and `rejoinSeconds` are this deployment's.
      required: [floor, critical, sustainedAfterSeconds, rejoinSeconds]
      properties:
        floor: { type: number, minimum: 0, maximum: 1 }
        threshold: { type: number, minimum: 0, maximum: 1 }
        window: { type: integer, format: int32 }
        windowHits: { type: integer, format: int32 }
        critical: { type: number, minimum: 0, maximum: 1 }
        sustainedAfterSeconds: { type: integer, format: int32 }
        rejoinSeconds: { type: integer, format: int32, description: '`0` when the rejoin window is off.' }

    TimelineSession:
      type: object
      required: [publisherEpoch, broadcastId, firstSampleAt, lastSampleAt, samplesTaken, samplesStored, floor, mode, samplerId]
      properties:
        publisherEpoch: { type: string }
        broadcastId: { $ref: '#/components/schemas/BroadcastId' }
        firstSampleAt: { type: string, format: date-time }
        lastSampleAt: { type: string, format: date-time }
        samplesTaken: { type: integer, format: int64 }
        samplesStored: { type: integer, format: int64 }
        floor: { type: number }
        threshold:
          type: number
          description: Absent when the session's sampler predates R70 and reported no rule.
        window: { type: integer, format: int32 }
        windowHits: { type: integer, format: int32 }
        mode: { type: string, enum: [observe, flag] }
        samplerId: { type: string }

    TimelineBucket:
      type: object
      required: [start, max, scores, stored, above, critical]
      properties:
        start: { type: string, format: date-time }
        max:
          type: number
          description: The highest score among the flagged labels in the bucket.
        scores:
          type: object
          description: The highest score per label, 0–1, by label.
          additionalProperties: true
        stored: { type: integer, format: int32 }
        above:
          type: integer
          format: int32
          description: Stored samples at or above their session's threshold.
        critical:
          type: integer
          format: int32
          description: Stored samples at or above the critical level.

    TimelineEvent:
      type: object
      required: [id, type, occurredAt, actor, summary]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string }
        occurredAt: { type: string, format: date-time }
        actor: { type: string }
        summary: { type: string }

    TimelineSummary:
      type: object
      description: |
        Runs are consecutive sampled frames at or above their session's
        threshold; a missing sample is below the floor and breaks a run.
        `recurring`: two or more runs at least the sustained length, or an
        incident that returned after review. `sustained`: one such run.
        `flicker`: three or more runs, or an incident that tripped twice.
        `isolated`: any other run. `unknown`: no session reported a
        threshold.
      required: [pattern, thresholdKnown, sampledSeconds, aboveSeconds, criticalSeconds, longestRunSeconds, runs, sustainedRuns, peak]
      properties:
        pattern: { type: string, enum: [none, isolated, flicker, sustained, recurring, unknown] }
        thresholdKnown: { type: boolean }
        sampledSeconds: { type: integer, format: int32 }
        aboveSeconds: { type: integer, format: int32 }
        criticalSeconds: { type: integer, format: int32 }
        longestRunSeconds: { type: integer, format: int32 }
        runs: { type: integer, format: int32 }
        sustainedRuns: { type: integer, format: int32 }
        peak: { type: number }
        peakLabel: { type: string }

    TimelineSuggestion:
      type: object
      description: |
        What the pattern suggests: `violation` with a ban length for
        `recurring` (7 days) and for `sustained` reaching the critical level
        (24 hours); `not_violation` for `isolated`; nothing otherwise. A
        reading aid — it never acts.
      properties:
        verdict: { type: string, enum: [violation, not_violation] }
        banSeconds: { type: integer, format: int32 }
        why: { type: string }

    DismissContentFlagRequest:
      type: object
      additionalProperties: false
      description: How an operator dismissed a flag (R70). Both fields are optional.
      properties:
        reason:
          type: string
          enum: [game_scene, not_explicit, detector_error, other]
          description: Why it is not a violation; delivered as `content_flag.resolved`'s `reason`.
        scope:
          type: string
          enum: [episode, duration, session]
          default: duration

    ScreeningStatus:
      type: object
      description: |
        The screening plane's health. `flagRoute: false` means no enabled
        webhook would page anyone, so `flag`-mode samplers are paused.
        `missingShards` are sampler shards that have not polled for 30
        seconds: their broadcasts are not being screened.
      required: [flagRoute, expectedShards, missingShards]
      properties:
        flagRoute: { type: boolean }
        expectedShards:
          type: integer
          format: int32
          description: The shard count of the most recent sampler poll; `0` before any sampler polled.
        missingShards:
          type: array
          items: { type: integer, format: int32 }
        lastPollAt: { type: string, format: date-time }

    ContentFlagsPage:
      type: object
      required: [contentFlags, screening]
      properties:
        contentFlags:
          type: array
          items: { $ref: '#/components/schemas/ContentFlag' }
        screening: { $ref: '#/components/schemas/ScreeningStatus' }

    ContentFlagReport:
      type: object
      description: |
        The `gawk.content-flag.v1` body (docs/42 §4.11, extended additively by
        R40). Scores and metadata only, never a frame.
      required: [schema, broadcastId, publisherEpoch, samplerId, mode, state, window, scores, labels]
      properties:
        schema: { type: string, const: gawk.content-flag.v1 }
        broadcastId: { $ref: '#/components/schemas/BroadcastId' }
        publisherEpoch:
          type: string
          description: The relay's handle for the publisher session the window was built over.
        samplerId: { type: string }
        mode:
          type: string
          enum: [observe, flag]
          description: Required. `observe` pages nobody.
        state:
          type: string
          enum: [tripped, cleared]
        window: { $ref: '#/components/schemas/ContentFlagWindow' }
        scores: { $ref: '#/components/schemas/ContentFlagScores' }
        labels:
          type: array
          maxItems: 32
          items: { type: string, pattern: '^[A-Z0-9_]{1,64}$' }
        labelCounts:
          type: object
          description: How many of the window's samples each label fired in.
          additionalProperties: true
        recent:
          type: array
          maxItems: 64
          description: The session's last per-sample scores, oldest first — what an auto-kill policy is evaluated over.
          items: { type: number, minimum: 0, maximum: 1 }
        summary: { type: string, maxLength: 512 }

    ContentFlagReportResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [raised, updated, resolved, muted, ended, ignored]
        flagId:
          type: integer
          format: int64
          description: The flag the report raised, updated or resolved.

    ScreeningTarget:
      type: object
      required: [broadcastId, broadcastKey, publisherEpoch, relay, muted, exempt]
      properties:
        broadcastId: { $ref: '#/components/schemas/BroadcastId' }
        broadcastKey: { $ref: '#/components/schemas/BroadcastKey' }
        publisherEpoch: { type: string }
        relay:
          type: string
          description: Base URL of the ops listener of the relay pod holding the broadcast's origin.
        muted:
          type: boolean
          description: A dismissal mutes re-flagging; `flag`-mode reports answer `202 muted`.
        exempt:
          type: boolean
          description: Attached to an exempt room. Listed, never sampled.

    ScreeningTargets:
      type: object
      required: [schema, shard, of, flagRoute, targets]
      properties:
        schema: { type: string, const: gawk.screening.targets.v1 }
        shard: { type: integer, format: int32 }
        of: { type: integer, format: int32 }
        flagRoute:
          type: boolean
          description: '`false` when no enabled webhook would page anyone: a `flag`-mode sampler samples nothing.'
        targets:
          type: array
          items: { $ref: '#/components/schemas/ScreeningTarget' }

    Sample:
      type: object
      required: [position, at, scores]
      properties:
        position:
          type: integer
          format: int32
          description: The sample's 1-based place among the session's `taken`.
        at: { type: string, format: date-time }
        scores:
          type: object
          description: Every label of the batch's `labels`, by label, 0 to 1.
          additionalProperties: true

    SessionSamples:
      type: object
      required: [broadcastId, broadcastKey, publisherEpoch, taken, firstAt, lastAt, samples]
      properties:
        broadcastId: { $ref: '#/components/schemas/BroadcastId' }
        broadcastKey: { $ref: '#/components/schemas/BroadcastKey' }
        publisherEpoch: { type: string }
        taken:
          type: integer
          format: int32
          minimum: 1
          description: Samples scored for the session in this batch, sent or not.
        firstAt: { type: string, format: date-time }
        lastAt: { type: string, format: date-time }
        samples:
          type: array
          description: The samples at or above the floor, in position order.
          items: { $ref: '#/components/schemas/Sample' }

    SampleBatch:
      type: object
      required: [schema, samplerId, mode, floor, labels, sessions]
      properties:
        schema: { type: string, const: gawk.screening.samples.v1 }
        samplerId: { type: string }
        mode:
          type: string
          enum: [observe, flag]
        floor:
          type: number
          minimum: 0
          maximum: 1
          description: Only samples where some label scores at or above it are sent.
        labels:
          type: array
          items: { type: string, pattern: '^[A-Z0-9_]{1,64}$' }
        rule: { $ref: '#/components/schemas/SamplerRule' }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/SessionSamples' }

    SamplerRule:
      type: object
      description: |
        The sampler's window rule (R70): a window trips when `windowHits` of
        its last `window` samples score at or above `threshold`. Reported
        so the portal draws the threshold that was in force; absent from a
        sampler older than R70. `threshold` may not be below `floor`.
      required: [threshold, window, windowHits]
      properties:
        threshold: { type: number, exclusiveMinimum: 0, maximum: 1 }
        window: { type: integer, format: int32, minimum: 1, maximum: 64 }
        windowHits: { type: integer, format: int32, minimum: 1, maximum: 64 }

    SamplesResult:
      type: object
      required: [stored]
      properties:
        stored: { type: integer, format: int32 }

    ReplayRequest:
      type: object
      required: [threshold, window, windowHits, from, to]
      properties:
        threshold: { type: number, exclusiveMinimum: 0, maximum: 1 }
        window: { type: integer, format: int32, minimum: 1, maximum: 64 }
        windowHits:
          type: integer
          format: int32
          minimum: 1
          description: At most `window`.
        labels:
          type: array
          description: A subset of the stored labels to score by. Absent or empty means all of them.
          items: { type: string }
        from: { type: string, format: date-time }
        to:
          type: string
          format: date-time
          description: At most 92 days after `from`.

    ReplayTrip:
      type: object
      required: [broadcastKey, broadcastId, publisherEpoch, at, peakScore]
      properties:
        broadcastKey: { $ref: '#/components/schemas/BroadcastKey' }
        broadcastId: { $ref: '#/components/schemas/BroadcastId' }
        publisherEpoch: { type: string }
        at:
          type: string
          format: date-time
          description: When the window would have tripped.
        peakScore: { type: number, minimum: 0, maximum: 1 }

    ReplayResult:
      type: object
      required: [schema, request, floor, sessions, samplesTaken, samplesStored, broadcastHours, wouldTrips,
        wouldTripsPer100h, trips, truncated]
      properties:
        schema: { type: string, const: gawk.screening.replay.v1 }
        request: { $ref: '#/components/schemas/ReplayRequest' }
        floor:
          type: number
          description: The highest sample floor among the replayed sessions.
        sessions: { type: integer, format: int32 }
        samplesTaken: { type: integer, format: int64 }
        samplesStored: { type: integer, format: int64 }
        broadcastHours: { type: number }
        wouldTrips: { type: integer, format: int32 }
        wouldTripsPer100h: { type: number }
        trips:
          type: array
          description: Newest first, at most 1000; `truncated` says the list was cut. The count is exact.
          items: { $ref: '#/components/schemas/ReplayTrip' }
        truncated: { type: boolean }
