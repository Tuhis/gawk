        with is refused from this moment, and its link is closed; the new
        string is returned only in this response. A revoked PoP returns
        `409` with code `pop_revoked`.
      x-gawk-roles: [operator]
      x-gawk-requires: pops
      parameters:
        - name: name
          in: path
