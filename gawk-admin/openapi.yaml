# The contract for gawk-admin's /api/v1 (R48, docs/49).
#
# HAND-WRITTEN AND REVIEWED LIKE CODE (D1). There is no generator: edit the
# handler and this file in the same commit, and `go test ./internal/api/...`
# says whether they still agree. TestOpenAPIMatchesRoutes walks the route table
# and this document in both directions — every route documented, every
# documented operation registered, every error code and event type in the
# enums, every example decoding into its Go type with unknown fields refused.
#
# The served copy is this file as JSON at GET /api/v1/openapi.json, with
# servers[0].url rewritten to the deployment's -external-url.
#
# Prose conventions (the page is rendered by Redoc, docs/49 D5):
#   - `summary` is a short imperative phrase, no trailing period.
#   - A response `description` is ONE short line. Redoc puts it in the
#     collapsed response header, which does not wrap; anything longer runs off
#     the panel. Explanations go in the operation description or in the
#     "Errors" section of `info.description`.
#   - `x-gawk-sensitive-reason` is one short line for the same reason.
openapi: 3.1.1

info:
  title: gawk-admin API
  version: 1.11.0 # x-release-please-version
  summary: Moderation and fleet-operations API for a gawk deployment.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    The HTTP API of `gawk-admin`, the moderation portal of a
    [gawk](https://github.com/Tuhis/gawk) deployment. The portal SPA uses it,
    and external integrations such as bots use the same API.

    ## Authentication

    Every operation except `GET /api/v1/openapi.json` requires a bearer JWT
    issued by the deployment's OIDC provider:

    ```
    Authorization: Bearer <token>
    ```

    Each operation lists the role it requires under `x-gawk-roles`. A valid
    token without that role gets `403`. There are no cookies and no
    server-side session.

    The served copy of this document names the role claim values this
    deployment is configured with (`-operator-role`, `-rooms-reader-role`,
    `-rooms-manager-role`, `-flagger-role`). The repository copy uses the
    symbolic names `operator`, `rooms-reader`, `rooms-manager` and
    `flagger`.

    Service identities use the client-credentials grant against the same
    provider. `docs/self-hosting.md` §9.8 has a worked example. A bot that
    only reads rooms should hold `rooms-reader`, which reaches `getMe`,
    `listRooms` and `getRoom` and nothing else. Those operations return raw
    room codes and join links, so a `rooms-reader` token can join every
    room in the deployment. A bot that provisions rooms should hold
    `rooms-manager`, which reaches `getMe`, `createRoom` and `deleteRoom`
    and nothing else, and may delete only the static rooms it created
    itself. The content sampler (R40) holds `flagger`, which reaches
    `postContentFlag`, `listScreeningTargets` and `postScreeningSamples` and
    nothing else: it can raise a content flag, never kill.

    The routes that need no token: `GET /auth/config` returns the issuer,
    client ID and audience a browser client needs; `GET /api/v1/openapi.json`
    returns this document; `GET /api/v1/asyncapi.json` and
    `GET /api/v1/schemas/events/{name}` return the event contract.

    ## Compatibility

    `/api/v1` only changes additively. Fields and operations are added, never
    removed or retyped, and the `code` and `type` enums only grow. A breaking
    change would be a new `/api/v2`. Clients should ignore unknown fields and
    treat unknown enum values as unknown rather than as errors.

    ## Ban mutations

    A ban is written to two systems that do not share a transaction: a
    Postgres row (the system of record) and a Kubernetes object that enforces
    it. A mutation therefore has three outcomes:

    | Outcome | Status |
    |---|---|
    | Row written and enforcement object written | `201` (kill, create ban) or `204` (remove ban) |
    | Row written, enforcement object not yet written | `202` with the ban in the body and `enforcement.inSync: false` |
    | Row not written | `503` if Postgres is unreachable, otherwise `500` |

    `202` is a success. The record is durable and a reconciler completes the
    enforcement side within about a minute. Do not retry a `202`: the retry
    returns `409` because the row already exists.

    ## Sensitive data

    Responses marked `x-gawk-sensitive: true` may contain raw broadcast IDs,
    raw room codes or publisher IP addresses. Broadcast IDs and room codes are
    joinable, and IP addresses are personal data. Do not forward them to any
    system that is not equally access-controlled. Outbound events carry the
    joinable identifiers too, beside the HMAC'd `key` forms, and never an IP
    address — so a webhook receiver is one such system, and the operator
    chooses it knowing that.

    Webhook signing secrets are never returned. A room's attach secret is
    returned once, by the operation that creates it, and cannot be read again.

    ## Events

    Outbound events — webhook deliveries and, where enabled, the NATS bus —
    are not described here. They are one contract in the format built for
    event channels: an **AsyncAPI 3.0 catalogue** this deployment serves at
    [`/api/v1/asyncapi.json`](asyncapi.json), listing every event as a
    CloudEvents 1.0 message whose `data` has a JSON Schema served under
    `/api/v1/schemas/events/`. Webhook deliveries follow Standard Webhooks;
    `docs/self-hosting.md` §9.5 has a verifier. The `type` enum below is the
    stored event vocabulary of the audit feed, which is a different (shorter)
    set of names from the CloudEvents `type`s in the catalogue.

    ## Errors

    Every error response has the same shape:

    ```json
    { "error": { "code": "not_found", "message": "no such endpoint" } }
    ```

    Branch on `code`; `message` is for display only. The codes are part of the
    contract and the `ErrorCode` enum only grows.

    | Status | Codes | Meaning |
    |---|---|---|
    | `400` | `bad_request`, `invalid_target` | The request body or a parameter is invalid. |
    | `401` | `unauthorized` | The bearer token is missing, expired, or has the wrong issuer, audience or signature. |
    | `401` | `idp_unavailable` | OIDC discovery has not completed yet, so no token can be verified. Retry shortly. |
    | `403` | `forbidden` | The token is valid but lacks the required role. Re-authenticating does not help until the role is granted. |
    | `403` | `room_not_owned` | A `rooms-manager` caller without `operator` tried to delete a room it did not create. |
    | `400` | `screening_not_allowed` | Only a static room with an attach secret can be exempt from content screening. |
    | `404` | `not_found` | No such object, or a route for a feature this deployment has disabled. |
    | `409` | `duplicate_active`, `duplicate_name`, `source_immutable`, `ban_not_active`, `room_exists`, `room_not_static`, `room_not_dynamic`, `content_flag_state`, `pop_exists`, `pop_revoked`, `wall_code_taken` | The current state of the object refuses the request. |
    | `429` | `rate_limited` | Too many rejected tokens from your address. Honour `Retry-After` and obtain a fresh token before retrying. Valid tokens never count against this limit. |
    | `500` | `internal` | An unexpected server error. |
    | `503` | `unavailable` | A dependency (usually Postgres) is unreachable. Retry later. Existing bans stay enforced. |
    | `503` | `no_flag_route` | A `flag`-mode content flag was refused: no enabled webhook would deliver `content_flag.raised`, so nobody would be paged. |

servers:
  # One line, deliberately: a renderer puts this next to the URL, where a
  # paragraph is unreadable. The explanation belongs in `info.description`,
  # which has room for it.
  #
  # The URL here is a placeholder. The copy served at `/api/v1/openapi.json`
  # carries the deployment's own `-external-url` instead.
  - url: https://admin.gawk.example
    description: This deployment.

security:
  - bearerAuth: []

tags:
  - name: identity
    description: The calling identity and this deployment's configuration.
  - name: broadcasts
    description: Live broadcasts on the relay fleet.
  - name: bans
    description: The ban record, which is the system of record for enforcement.
  - name: events
    description: The audit feed, with per-webhook delivery state.
  - name: relays
    description: Effective configuration of each relay pod (read-only).
  - name: webhooks
    description: Outbound notification targets.
  - name: rooms
    description: Room custom resources. Only served when the deployment enables rooms.
  - name: screening
    description: Automatic content flagging (R40). Only served when the deployment enables screening.
  - name: pops
    description: PoP relays (R74) and their pairing. Only served when the deployment enables PoPs.

paths:
  /api/v1/openapi.json:
    get:
      operationId: getOpenAPIDocument
      tags: [identity]
      summary: Get this document
      description: |
        Returns this document as JSON, with `servers[0].url` set to this
        deployment's base URL and a top-level `x-gawk-build` naming the
        binary that served it.

        No authentication is required. The response is cacheable for five
        minutes and carries an `ETag`; send `If-None-Match` to get `304`.

        The body is an OpenAPI 3.1 document and is not described by a schema
        here.
      x-gawk-roles: []
      security: []
      responses:
        '200':
          description: The document.
        '304':
          description: Not modified.

  /api/v1/asyncapi.json:
    get:
      operationId: getAsyncAPIDocument
      tags: [identity]
      summary: Get the event catalogue
      description: |
        Returns the event contract as an AsyncAPI 3.0 document: every event
        this deployment can emit, on the NATS bus and in webhook deliveries,
        as CloudEvents 1.0 messages. The references to each event's data
        schema point at this deployment's `/api/v1/schemas/events/` URLs, and
        a top-level `x-gawk-build` names the binary that served it.

        No authentication is required. The response is cacheable for five
        minutes and carries an `ETag`; send `If-None-Match` to get `304`.

        The body is an AsyncAPI document and is not described by a schema
        here.
      x-gawk-roles: []
      security: []
      responses:
        '200':
          description: The catalogue.
        '304':
          description: Not modified.

  /api/v1/schemas/events/{name}:
    get:
      operationId: getEventSchema
      tags: [identity]
      summary: Get one event data schema
      description: |
        Returns the JSON Schema 2020-12 document that describes the `data` of
        one event type, by its file name (`<type>.json`, for example
        `fi.ioio.gawk.broadcast.killed.json`), or the shared definitions file
        `common.json`. The schema's `$id` is the identifier the event's
        `dataschema` attribute carries; its references to sibling files are
        rewritten to this deployment's URLs.

        No authentication is required. The response is cacheable for five
        minutes and carries an `ETag`; send `If-None-Match` to get `304`.

        The body is a JSON Schema document and is not described by a schema
        here.
      x-gawk-roles: []
      security: []
      parameters:
        - name: name
          in: path
          required: true
          description: The schema file name, `.json` included.
          schema: { type: string }
          example: fi.ioio.gawk.broadcast.killed.json
      responses:
        '200':
          description: The schema.
        '304':
          description: Not modified.
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Get the calling identity and deployment defaults
      description: |
        Call this first. A `200` confirms the token carries the required role,
        and the body reports server-side defaults and enabled features that a
        a client should read rather than hard-code.
      x-gawk-roles: [operator, rooms-reader, rooms-manager]
      responses:
        '200':
          description: The caller's identity and this deployment's defaults.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                email: operator@example.org
                subject: 5f3c1f7a-0f77-4a1e-9a63-9f0c1b2d3e4f
                roles: [operator]
                defaults:
                  killCooldownSeconds: 600
                features:
                  rooms: true
                  screening: true
                  pops: true
                  popNamedAddress: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/broadcasts:
    get:
      operationId: listBroadcasts
      tags: [broadcasts]
      summary: List live broadcasts
      description: |
        Returns one row per broadcast, merged across every relay pod carrying
        it, with the broadcast's ban state joined on.

        `podsResolved` and `podsAnswered` report coverage. When they differ,
        at least one pod did not answer and the list is incomplete. An empty
        list from an unreachable fleet does not mean nothing is broadcasting.

        `banState` is `null` when the moderation database was unreachable.
        Treat it as unknown, not as "not banned".
      x-gawk-roles: [operator]
      responses:
        '200':
          description: The broadcasts as of the most recent scan.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: Contains raw broadcast IDs and publisher IP addresses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BroadcastsPage' }
              example:
                broadcasts:
                  - id: ABC234
                    key: 9f2c41ab77de
                    publisherActive: true
                    publisherRemoteIp: 203.0.113.7
                    startedAt: '2026-09-16T09:12:04Z'
                    viewersGlobal: 41
                    pods:
                      - pod: gawk-server-7c9f8b6d5-2xk4p
                        role: origin
                        viewersLocal: 24
                      - pod: gawk-server-7c9f8b6d5-q7v2n
                        role: edge
                        viewersLocal: 17
                    links:
                      watch: https://gawk.example/#/view/ABC234
                      telemetry: https://telemetry.gawk.example/#/broadcast/9f2c41ab77de
                    banState:
                      banned: false
                podsResolved: 3
                podsAnswered: 3
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/broadcasts/{id}/kill:
    post:
      operationId: killBroadcast
      tags: [broadcasts]
      summary: End a broadcast
      description: |
        Ends the broadcast and bans its ID for a cooldown period. The cooldown
        is what keeps the broadcaster's resume token from reclaiming the ID
        immediately; it gives an operator time to decide on a longer ban.

        `cooldownSeconds` defaults to the deployment's configured cooldown,
        reported by `GET /api/v1/me`.

        If an active ban already covers the broadcast, the response is `409`
        with code `duplicate_active` and the existing ban in the body.

        See "Ban mutations" above for the meaning of `201` versus `202`.
      x-gawk-roles: [operator]
      parameters:
        - name: id
          in: path
          required: true
          description: The broadcast ID, as returned by `GET /api/v1/broadcasts`.
          schema: { $ref: '#/components/schemas/BroadcastId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KillRequest' }
            example:
              reason: repeated terms violations after a warning
              cooldownSeconds: 900
      responses:
        '201':
          description: The broadcast was ended and the ban is enforced.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: The ban target may be a raw broadcast ID or a publisher CIDR.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KillResult' }
              example:
                ban:
                  id: 1f1c2b3a-4d5e-4f60-8a91-0b2c3d4e5f60
                  target: { type: broadcastId, value: ABC234 }
                  state: active
                  reason: repeated terms violations after a warning
                  createdAt: '2026-09-16T09:31:00Z'
                  createdBy: operator@example.org
                  expiresAt: '2026-09-16T09:46:00Z'
                  sourceBroadcastId: ABC234
                  crName: bid-abc234
        '202':
          description: The ban is recorded; enforcement is pending. Do not retry.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: The ban target may be a raw broadcast ID or a publisher CIDR.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KillResult' }
              example:
                ban:
                  id: 1f1c2b3a-4d5e-4f60-8a91-0b2c3d4e5f60
                  target: { type: broadcastId, value: ABC234 }
                  state: active
                  reason: repeated terms violations after a warning
                  createdAt: '2026-09-16T09:31:00Z'
                  createdBy: operator@example.org
                  expiresAt: '2026-09-16T09:46:00Z'
                  sourceBroadcastId: ABC234
                  enforcement:
                    inSync: false
                    detail: >-
                      The ban is recorded but NOT enforced yet — its Kubernetes
                      enforcement object could not be written; the reconciler
                      retries within a minute, so do not re-submit.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '409':
          description: An active ban already covers this broadcast.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: The ban target may be a raw broadcast ID or a publisher CIDR.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BanConflict' }
              example:
                error:
                  code: duplicate_active
                  message: this broadcast is already banned
                ban:
                  id: 1f1c2b3a-4d5e-4f60-8a91-0b2c3d4e5f60
                  target: { type: broadcastId, value: ABC234 }
                  state: active
                  reason: repeated terms violations after a warning
                  createdAt: '2026-09-16T09:31:00Z'
                  createdBy: operator@example.org
                  expiresAt: '2026-09-16T09:46:00Z'
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/bans:
    get:
      operationId: listBans
      tags: [bans]
      summary: List bans
      description: |
        `state=active` (the default) returns the whole active set in one
        response. `state=all` returns the full history, newest first, paged by
        the `(afterCreatedAt, afterId)` cursor. Send both cursor parameters
        or neither.

        `nextAfter` is always present. It is `null` on the last page, and
        always `null` for `state=active`.
      x-gawk-roles: [operator]
      parameters:
        - name: state
          in: query
          required: false
          description: Which set to return.
          schema:
            type: string
            enum: [active, all]
            default: active
        - name: limit
          in: query
          required: false
          description: Page size for `state=all`. Values above 500 are clamped; zero or negative means the default.
          schema: { type: integer, format: int32, default: 50, maximum: 500 }
        - name: afterCreatedAt
          in: query
          required: false
          description: The previous page's `nextAfter.createdAt`. Must be sent together with `afterId`.
          schema: { type: string, format: date-time }
        - name: afterId
          in: query
          required: false
          description: The previous page's `nextAfter.id`. Must be sent together with `afterCreatedAt`.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: One page of bans.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: A ban target may be a raw broadcast ID or a publisher CIDR.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BansPage' }
              example:
                bans:
                  - id: 1f1c2b3a-4d5e-4f60-8a91-0b2c3d4e5f60
                    target: { type: ip, value: 203.0.113.0/24 }
                    state: active
                    reason: evading an ID ban
                    createdAt: '2026-09-16T09:31:00Z'
                    createdBy: operator@example.org
                    expiresAt: null
                    crName: ip-203-0-113-0-24
                nextAfter: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: createBan
      tags: [bans]
      summary: Create a ban
      description: |
        Bans a broadcast ID or a publisher address range.

        For an `ip` ban, `target.value` may be an address, a CIDR, or the
        literal `publisher`. The `publisher` form resolves the live
        publisher's address server-side from `sourceBroadcastId`, which is
        then required.

        A bare address is widened to `prefixLength`, which defaults to `/32`
        for IPv4 and `/64` for IPv6. A `prefixLength` that disagrees with a
        CIDR in `value` is rejected.

        `expiresAt: null` (or absent) makes the ban permanent.

        See "Ban mutations" above for the meaning of `201` versus `202`.
      x-gawk-roles: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBanRequest' }
            example:
              target: { type: ip, value: publisher, prefixLength: 24 }
              expiresAt: '2026-10-16T09:31:00Z'
              reason: evading an ID ban
              sourceBroadcastId: ABC234
      responses:
        '201':
          description: The ban is recorded and enforced.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: The ban target may be a raw broadcast ID or a publisher CIDR.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ban' }
              example:
                id: 2a2d3e4f-5061-4728-9b3c-4d5e6f708192
                target: { type: ip, value: 203.0.113.0/24 }
                state: active
                reason: evading an ID ban
                createdAt: '2026-09-16T09:31:00Z'
                createdBy: operator@example.org
                expiresAt: '2026-10-16T09:31:00Z'
                sourceBroadcastId: ABC234
                crName: ip-203-0-113-0-24
        '202':
          description: The ban is recorded; enforcement is pending. Do not retry.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: The ban target may be a raw broadcast ID or a publisher CIDR.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ban' }
              example:
                id: 2a2d3e4f-5061-4728-9b3c-4d5e6f708192
                target: { type: ip, value: 203.0.113.0/24 }
                state: active
                reason: evading an ID ban
                createdAt: '2026-09-16T09:31:00Z'
                createdBy: operator@example.org
                expiresAt: null
                enforcement:
                  inSync: false
                  detail: >-
                    The ban is recorded but NOT enforced yet — its Kubernetes
                    enforcement object could not be written; the reconciler
                    retries within a minute, so do not re-submit.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '409':
          description: An active ban already covers this target.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: The ban target may be a raw broadcast ID or a publisher CIDR.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BanConflict' }
              example:
                error:
                  code: duplicate_active
                  message: an active ban already covers this target
                ban:
                  id: 2a2d3e4f-5061-4728-9b3c-4d5e6f708192
                  target: { type: ip, value: 203.0.113.0/24 }
                  state: active
                  reason: evading an ID ban
                  createdAt: '2026-09-16T09:31:00Z'
                  createdBy: operator@example.org
                  expiresAt: null
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/bans/{id}:
    delete:
      operationId: removeBan
      tags: [bans]
      summary: Remove a ban
      description: |
        Lifts the ban and deletes its enforcement object. Removing an
        already-removed ban is idempotent: it returns `204` and records no
        second audit event.

        A `202` means the record says `removed` but the enforcement object
        could not be deleted yet, so the target is still banned until the
        reconciler catches up. The body carries the ban with
        `enforcement.inSync: false`.
      x-gawk-roles: [operator]
      parameters:
        - name: id
          in: path
          required: true
          description: The ban ID.
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: The ban is removed and no longer enforced.
        '202':
          description: The ban is removed; the target stays enforced until reconciled.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: The ban target may be a raw broadcast ID or a publisher CIDR.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ban' }
              example:
                id: 2a2d3e4f-5061-4728-9b3c-4d5e6f708192
                target: { type: ip, value: 203.0.113.0/24 }
                state: removed
                reason: evading an ID ban
                createdAt: '2026-09-16T09:31:00Z'
                createdBy: operator@example.org
                expiresAt: null
                removedAt: '2026-09-16T11:02:13Z'
                removedBy: operator@example.org
                enforcement:
                  inSync: false
                  detail: >-
                    The ban is lifted in the record but the target is STILL
                    banned — its Kubernetes enforcement object could not be
                    deleted; the reconciler retries within a minute, so do not
                    re-submit.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List events
      description: |
        Returns the audit feed, newest first. Each event carries its
        per-webhook delivery state; this feed is where a failed delivery
        becomes visible.

        `nextAfterId` is always present and is `null` on the last page. A
        cursor is only returned when the page was full.
      x-gawk-roles: [operator]
      parameters:
        - name: afterId
          in: query
          required: false
          description: The previous page's `nextAfterId`. Absent or `0` starts at the newest event.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          required: false
          description: Page size. Values above 500 are clamped.
          schema: { type: integer, format: int32, default: 50, maximum: 500 }
        - name: type
          in: query
          required: false
          description: |
            Only return these event types. Repeat the parameter
            (`?type=ban.created&type=ban.removed`) or send one comma-separated
            value (`?type=ban.created,ban.removed`). Absent means all types.
            An unknown type name is a `400`, not an empty page.
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/EventType' }
        - name: category
          in: query
          required: false
          description: |
            Only return rows of this category: `moderation` (the audit trail),
            `activity` (what the fleet did, ingested from the relay event
            bus) or `screening` (content-screening calibration rows, R40).
            Absent returns all of them.
          schema: { $ref: '#/components/schemas/EventCategory' }
      responses:
        '200':
          description: One page of events.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: '`broadcastId` is the raw broadcast ID.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventsPage' }
              example:
                events:
                  - id: 4821
                    type: broadcast.killed
                    occurredAt: '2026-09-16T09:31:00Z'
                    actor: operator@example.org
                    broadcastKey: 9f2c41ab77de
                    broadcastId: ABC234
                    reason: repeated terms violations after a warning
                    summary: operator@example.org ended broadcast 9f2c41ab77de
                    deliveries:
                      - webhookName: ops-pager
                        state: delivered
                        attempts: 1
                        deliveredAt: '2026-09-16T09:31:01Z'
                nextAfterId: 4821
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/relays:
    get:
      operationId: listRelays
      tags: [relays]
      summary: List relay pods
      description: |
        Returns each relay pod's effective configuration as the pod itself
        reports it, with secrets already redacted by the relay. This is
        read-only; relay configuration is changed through GitOps.
      x-gawk-roles: [operator]
      responses:
        '200':
          description: One row per relay pod.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelaysPage' }
              example:
                relays:
                  - pod: gawk-server-7c9f8b6d5-2xk4p
                    reachable: true
                    version: 2.4.1
                    config:
                      maxIdleTimeout: 30s
                      keepalivePeriod: 10s
                      maxViewersPerBroadcast: 1000
                  - pod: gawk-server-7c9f8b6d5-q7v2n
                    reachable: false
                    error: 'dial tcp 10.42.0.9:2112: connect: connection refused'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/webhooks:
    get:
      operationId: listWebhooks
      tags: [webhooks]
      summary: List webhooks
      description: |
        Returns webhooks from both sources: those defined in chart values
        (`source: config`, read-only here) and those created through this API
        (`source: ui`). Signing secrets are never included.
      x-gawk-roles: [operator]
      responses:
        '200':
          description: All webhooks, chart-defined ones first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhooksPage' }
              example:
                webhooks:
                  - name: ops-pager
                    url: https://pager.example.org/hooks/gawk
                    enabled: true
                    source: config
                  - id: 7b8c9d0e-1f20-4314-8526-3748596a7b8c
                    name: moderation-log
                    url: https://log.example.org/gawk
                    enabled: true
                    source: ui
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: createWebhook
      tags: [webhooks]
      summary: Create a webhook
      description: |
        Creates a portal-managed webhook. `secret` is required and write-only;
        it is never returned.

        Names are unique across both sources. A name already defined in chart
        values returns `409` with code `source_immutable`.
      x-gawk-roles: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookRequest' }
            example:
              name: moderation-log
              url: https://log.example.org/gawk
              secret: whsec_pJb4v3Q2u2G7S5dGm1bIqE7yq5c4Ht9R
              enabled: true
      responses:
        '201':
          description: The webhook was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
              example:
                id: 7b8c9d0e-1f20-4314-8526-3748596a7b8c
                name: moderation-log
                url: https://log.example.org/gawk
                enabled: true
                source: ui
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/webhooks/{id}:
    put:
      operationId: updateWebhook
      tags: [webhooks]
      summary: Update a webhook
      description: |
        Updates a portal-managed webhook. An empty or absent `secret` keeps
        the stored one.

        A chart-defined webhook has no ID and cannot be edited here. Putting
        its name in the `id` slot returns `409` with code `source_immutable`.
      x-gawk-roles: [operator]
      parameters:
        - name: id
          in: path
          required: true
          description: The webhook ID, or a chart-defined webhook's name, which returns `409`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookRequest' }
            example:
              name: moderation-log
              url: https://log.example.org/gawk/v2
              enabled: false
      responses:
        '200':
          description: The updated webhook.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
              example:
                id: 7b8c9d0e-1f20-4314-8526-3748596a7b8c
                name: moderation-log
                url: https://log.example.org/gawk/v2
                enabled: false
                source: ui
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: deleteWebhook
      tags: [webhooks]
      summary: Delete a webhook
      description: |
        Deletes a portal-managed webhook. A chart-defined webhook has no ID
        and cannot be deleted here. Putting its name in the `id` slot returns
        `409` with code `source_immutable`.
      x-gawk-roles: [operator]
      parameters:
        - name: id
          in: path
          required: true
          description: The webhook ID, or a chart-defined webhook's name, which returns `409`.
          schema: { type: string }
      responses:
        '204':
          description: The webhook was deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/webhooks/{name}/test:
    post:
      operationId: testWebhook
      tags: [webhooks]
      summary: Send a test delivery
      description: |
        Sends a signed test payload to the webhook. Works for both sources,
        so a chart-defined webhook can be verified without a redeploy.

        A non-2xx answer from the receiver is reported in the body with
        `ok: false`; it is not an error of this API.
      x-gawk-roles: [operator]
      parameters:
        - name: name
          in: path
          required: true
          description: The webhook name, from either source.
          schema: { type: string }
      responses:
        '200':
          description: The test was sent; the body reports the outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookTestResult' }
              example:
                ok: true
                status: 204
                deliveryId: 0198f3b2-7a41-7c9e-b1d3-5e6f708192a3
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/rooms:
    get:
      operationId: listRooms
      tags: [rooms]
      summary: List rooms
      description: |
        Returns every room, static rooms first, as a summary with counts and
        a join link. Only served when the deployment enables rooms
        (`features.rooms` in `GET /api/v1/me`); otherwise the path returns
        `404`.

        A row merges the room's custom resource with the live state of the
        relay pod that is home for it. `live: false` means no reachable pod
        is home for the room, so who is in it is unknown, not zero. Use
        `getRoom` for the attachments and the participant list.

        A room whose custom resource could not be decoded is still listed by
        name, with an empty `kind`, so that it can be deleted.
      x-gawk-roles: [operator, rooms-reader]
      x-gawk-requires: rooms
      responses:
        '200':
          description: All rooms.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: '`name`, `code` and `links.join` carry the raw room code.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomsPage' }
              example:
                rooms:
                  - name: team-standup
                    kind: static
                    code: team-standup
                    displayName: Team standup
                    maxBroadcasts: 4
                    live: true
                    links:
                      join: https://gawk.example/#/room/team-standup
                    counts:
                      participants: 3
                      streaming: 2
                      watching: 1
                      attachments: 2
                    homeHolder: gawk-server-7c9f8b6d5-2xk4p
                    key: 3c7d91fe20ab
                    createdAt: '2026-09-01T07:00:00Z'
                    hasAttachSecret: true
                    managed: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a static room
      description: |
        Static rooms are joined by link, so a code with the six-character
        shape of a dynamic code is rejected: the join box would treat it as
        one.

        With `withAttachSecret: true` the response includes a newly minted
        attach secret. It is returned only in this response and cannot be
        read again; use `rotateRoomSecret` if it is lost.

        The room records the caller as its creator. A `rooms-manager`
        caller can later delete the rooms it created, and no others. A code
        that is already taken returns `409` with code `room_exists`,
        whoever created the room.

        With `mumble` the room has voice on an existing Mumble channel
        (R79). A static room cannot ask for a temporary channel:
        `temporary: true` returns `400`. Without `mumble` the room has no
        voice; `setRoomVoice` changes it later.
      x-gawk-roles: [operator, rooms-manager]
      x-gawk-requires: rooms
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoomRequest' }
            example:
              code: team-standup
              displayName: Team standup
              maxBroadcasts: 4
              withAttachSecret: true
              mumble:
                channel: Friends/Gaming
      responses:
        '201':
          description: The room was created.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: Contains the raw room code and the one-time attach secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomWithSecret' }
              example:
                room:
                  name: team-standup
                  kind: static
                  code: team-standup
                  displayName: Team standup
                  maxBroadcasts: 4
                  live: false
                  links:
                    join: https://gawk.example/#/room/team-standup
                  counts: { participants: 0, streaming: 0, watching: 0, attachments: 0 }
                  createdAt: '2026-09-16T09:31:00Z'
                  hasAttachSecret: true
                  managed: true
                  mumble:
                    channel: Friends/Gaming
                attachSecret: s3cr3t-attach-key-shown-once
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/rooms/{name}/rotate-secret:
    post:
      operationId: rotateRoomSecret
      tags: [rooms]
      summary: Rotate a room's attach secret
      description: |
        Replaces a static room's attach secret. The new secret is returned
        only in this response.

        Dynamic rooms have no attach secret; rotating one returns `409` with
        code `room_not_static`.
      x-gawk-roles: [operator]
      x-gawk-requires: rooms
      parameters:
        - name: name
          in: path
          required: true
          description: The room code.
          schema: { type: string }
      responses:
        '200':
          description: The secret was rotated.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: Contains the raw room code and the one-time attach secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomWithSecret' }
              example:
                room:
                  name: team-standup
                  kind: static
                  code: team-standup
                  live: false
                  counts: { participants: 0, streaming: 0, watching: 0, attachments: 0 }
                  hasAttachSecret: true
                  managed: true
                attachSecret: s3cr3t-rotated-key-shown-once
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/rooms/{name}/voice:
    put:
      operationId: setRoomVoice
      tags: [rooms]
      summary: Set a static room's voice channel
      description: |
        Replaces a static room's voice mapping (R79): the existing Mumble
        channel the room's voice uses. The body replaces the mapping, so an
        absent or `null` `mumble` removes the room's voice. A relay with no
        voice bridge configured ignores the mapping.

        `temporary: true` returns `400`: a temporary channel is what a
        dynamic room's creator asks for. A dynamic room returns `409` with
        code `room_not_static`.

        No event is recorded for the change.
      x-gawk-roles: [operator]
      x-gawk-requires: rooms
      parameters:
        - name: name
          in: path
          required: true
          description: The room code, in any spelling.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomVoiceRequest' }
            example:
              mumble:
                channel: Friends/Gaming
      responses:
        '200':
          description: The room after the change.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: '`name`, `code` and `links.join` carry the raw room code.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
              example:
                name: team-standup
                kind: static
                code: team-standup
                live: false
                counts: { participants: 0, streaming: 0, watching: 0, attachments: 0 }
                hasAttachSecret: true
                managed: true
                mumble:
                  channel: Friends/Gaming
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/rooms/{name}/end:
    post:
      operationId: endRoom
      tags: [rooms]
      summary: End a dynamic room
      description: |
        Deletes a dynamic room and closes every session in it. Equivalent to
        `deleteRoom`, but refuses static rooms with `409` and code
        `room_not_dynamic`, for clients that mean "end" and must not delete a
        static room by mistake.
      x-gawk-roles: [operator]
      x-gawk-requires: rooms
      parameters:
        - name: name
          in: path
          required: true
          description: The room code.
          schema: { type: string }
      responses:
        '204':
          description: The room was ended and its sessions closed.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/rooms/{name}:
    get:
      operationId: getRoom
      tags: [rooms]
      summary: Get a room with its attachments and participants
      description: |
        Returns the `listRooms` row for one room plus `attachments` and
        `participants`. `{name}` accepts any spelling of the room code.

        When `live` is `false` no reachable relay pod is home for the room:
        `participants` is empty because it is unknown, and each attachment
        comes from the custom resource without `live` or `viewers`.
      x-gawk-roles: [operator, rooms-reader]
      x-gawk-requires: rooms
      parameters:
        - name: name
          in: path
          required: true
          description: The room code, in any spelling.
          schema: { type: string }
      responses:
        '200':
          description: The room.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: Contains the raw room code, join link and raw broadcast IDs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
              example:
                name: team-standup
                kind: static
                code: team-standup
                displayName: Team standup
                live: true
                links:
                  join: https://gawk.example/#/room/team-standup
                counts: { participants: 3, streaming: 2, watching: 1, attachments: 2 }
                attachments:
                  - broadcastId: ABC234
                    label: main pc
                    live: true
                    viewers: 3
                    attachedAt: '2026-09-16T09:32:00Z'
                    links:
                      watch: https://gawk.example/#/view/ABC234
                  - broadcastId: DEF567
                    label: laptop
                    live: false
                    viewers: 0
                    attachedAt: '2026-09-16T09:40:00Z'
                    links:
                      watch: https://gawk.example/#/view/DEF567
                participants:
                  - { id: 1, nickname: tuhis, clientKind: native, streaming: true, speaking: false }
                  - { id: 2, nickname: kaveri, clientKind: web-broadcaster, streaming: true, speaking: false }
                  - { id: 3, nickname: guest-3, clientKind: web-viewer, streaming: false, speaking: false }
                homeHolder: gawk-server-7c9f8b6d5-2xk4p
                key: 3c7d91fe20ab
                createdAt: '2026-09-01T07:00:00Z'
                hasAttachSecret: true
                managed: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    patch:
      operationId: patchRoom
      tags: [rooms, screening]
      summary: Set a room's content screening
      description: |
        Exempts a room's broadcasts from automatic content screening, or puts
        them back under it, and records a `room.screening_changed` event.
        Only a static room with an attach secret can be exempt: an open or
        dynamic room could be joined by anyone, so exempting it would leave an
        unscreened lane open to everyone. Any other room returns `400` with
        code `screening_not_allowed`.

        Served when the deployment enables screening; every room returns `404`
        when it does not also enable rooms.
      x-gawk-roles: [operator]
      x-gawk-requires: screening
      parameters:
        - name: name
          in: path
          required: true
          description: The room code, in any spelling.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomPatchRequest' }
            example:
              screening: exempt
      responses:
        '200':
          description: The room after the change.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: '`name`, `code` and `links.join` carry the raw room code.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
              example:
                name: team-standup
                kind: static
                code: team-standup
                live: false
                counts: { participants: 0, streaming: 0, watching: 0, attachments: 0 }
                hasAttachSecret: true
                managed: true
                screening: exempt
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    delete:
      operationId: deleteRoom
      tags: [rooms]
      summary: Delete a room
      description: |
        Deletes a room of either kind. Every relay pod acts on the deleted
        custom resource; for a dynamic room that closes the sessions in it.

        A caller that holds `rooms-manager` but not `operator` may delete
        only a static room it created itself (`createRoom` records the
        creator). Any other room returns `403` with code `room_not_owned`
        and is left in place, including rooms created before the creator
        was recorded.
      x-gawk-roles: [operator, rooms-manager]
      x-gawk-requires: rooms
      parameters:
        - name: name
          in: path
          required: true
          description: The room code.
          schema: { type: string }
      responses:
        '204':
          description: The room was deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/pops:
    get:
      operationId: listPops
      tags: [pops]
      summary: List PoPs
      description: |
        Returns every PoP (R74), sorted by name. Only served when the
        deployment enables PoPs (`features.pops` in `GET /api/v1/me`);
        otherwise the path returns `404`.

        A row merges the `Pop` custom resource with the live view of the
        relay pod that holds the PoP's link. `live` is absent when no
        reachable pod holds it. `state` is `waiting-for-pairing` until a
        PoP has paired with its current pairing string, including right
        after a re-pair. Use `getPop` for the live broadcasts and the health
        lines.

        A `Pop` whose custom resource could not be decoded is listed by name
        with `state: invalid`, so that it can be deleted.
      x-gawk-roles: [operator]
      x-gawk-requires: pops
      responses:
        '200':
          description: All PoPs.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: '`link` carries the PoP public and LAN addresses.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PopsPage' }
              example:
                pops:
                  - name: assembly-2026
                    displayName: Assembly 2026
                    state: linked
                    stateSince: '2026-10-21T18:04:11Z'
                    notAfter: '2026-11-09T00:00:00Z'
                    createdAt: '2026-10-21T18:00:00Z'
                    managed: true
                    revoked: false
                    pairing:
                      issuedAt: '2026-10-21T18:00:00Z'
                      expiresAt: '2026-10-24T18:00:00Z'
                      paired: true
                      pairedAt: '2026-10-21T18:04:11Z'
                    uplink: { maxMbps: 25, maxStreams: 3 }
                    downlink: { maxMbps: 0, maxStreams: 0 }
                    limits: { maxBroadcasts: 40, maxDownlinkStreams: 20 }
                    guests: { autoSwitch: true }
                    wall: { roomCode: assembly-2026 }
                    namedAddress: { enabled: false }
                    link:
                      connected: true
                      since: '2026-10-21T18:04:11Z'
                      version: 0.44.0
                      proto: 1
                      publicAddrs: ['203.0.113.7', '2001:db8:1:2::/64']
                      lanAddr: 192.168.1.20
                      pod: gawk-server-7c9f8b6d5-2xk4p
                    live:
                      pod: gawk-server-7c9f8b6d5-2xk4p
                      live: 7
                      forwarded: 2
                      outsideViewers: 11
                      uplinkMbps: 14.5
                      uplinkStreams: 2
                      uplink: { maxMbps: 25, maxStreams: 3 }
                      downlink: { maxMbps: 0, maxStreams: 0 }
                      downlinkStreams: 1
                      guestsConnected: 23
                      offersSent: 19
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      operationId: createPop
      tags: [pops]
      summary: Create a PoP
      description: |
        Creates a `Pop` custom resource and returns its pairing string. The
        string is returned only in this response and cannot be read again;
        only its SHA-256 is stored. It can be redeemed once, until
        `expiresAt` (`-pop-pairing-ttl`). Use `repairPop` if it is lost.

        With `wall`, the PoP's party wall is created too: a static room with
        no attach secret that only the PoP can attach to, owned by the `Pop`
        so deleting the PoP deletes it. The wall needs rooms enabled. Its
        code defaults to the PoP name; a name longer than a room code allows,
        or with the six-character shape of a dynamic code, needs an explicit
        `wall.roomCode`. A code that is already a room returns `409` with
        code `wall_code_taken`, and the PoP is not created.

        `namedAddress` needs the named tier configured (`features.popNamedAddress`).
        A name that is already a PoP returns `409` with code `pop_exists`.
      x-gawk-roles: [operator]
      x-gawk-requires: pops
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePopRequest' }
            example:
              name: assembly-2026
              displayName: Assembly 2026
              notAfter: '2026-11-09T00:00:00Z'
              uplink: { maxMbps: 25, maxStreams: 3 }
              downlink: { maxMbps: 0, maxStreams: 0 }
              limits: { maxBroadcasts: 40, maxDownlinkStreams: 20 }
              guests: { autoSwitch: true }
              wall: { roomCode: assembly-2026, maxParticipants: 200 }
              namedAddress: false
      responses:
        '201':
          description: The PoP was created.
          x-gawk-sensitive: true
          x-gawk-sensitive-reason: Contains the one-time pairing string.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PopWithPairing' }
              example:
                pop:
                  name: assembly-2026
                  displayName: Assembly 2026
                  state: waiting-for-pairing
                  stateSince: '2026-10-21T18:00:00Z'
                  notAfter: '2026-11-09T00:00:00Z'
                  createdAt: '2026-10-21T18:00:00Z'
                  managed: true
                  revoked: false
                  pairing:
                    issuedAt: '2026-10-21T18:00:00Z'
                    expiresAt: '2026-10-24T18:00:00Z'
                    paired: false
                  uplink: { maxMbps: 25, maxStreams: 3 }
                  downlink: { maxMbps: 0, maxStreams: 0 }
                  limits: { maxBroadcasts: 40, maxDownlinkStreams: 20 }
                  guests: { autoSwitch: true }
                  wall: { roomCode: assembly-2026 }
                  namedAddress: { enabled: false }
                pairingString: gawk-pair:api.gawk.ioio.fi:4433/K7M2Q-9XDA4-RT3VB-6NWPE-HJ5LC-Y
                expiresAt: '2026-10-24T18:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

