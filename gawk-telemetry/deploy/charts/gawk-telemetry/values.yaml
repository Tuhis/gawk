# gawk-telemetry (R28, docs/33) — OPTIONAL per-session diagnostics.
#
# Install it together with:
#   * the relay chart's  telemetry.enabled=true  (mints session tokens, wire 0x0D)
#   * the app chart's    telemetry.enabled=true  (routes the same-origin ingest path)
# All three share ONE telemetry key. Without it the relay sends no hello and
# every client collects nothing, so this service would sit idle.

image:
  repository: ghcr.io/tuhis/gawk-telemetry
  # Empty = the chart's appVersion, which release-please keeps in lockstep
  # with the published image tag.
  tag: ""
  pullPolicy: IfNotPresent

# The published images are public; see the gawk-server chart's values.
imagePullSecrets: []

# ONE replica, always. The service owns per-session files on a PVC with one
# writer per file (D3), and an in-memory live projection that a second replica
# would only ever hold half of. Scaling it is not a knob, it is a redesign.
replicaCount: 1

# The session-token HMAC key: 64 hex chars (32 bytes), the SAME value the
# relay chart's telemetry.key carries. The service refuses to start without it
# — with no key it could only reject everything or accept anything.
#   kubectl -n gawk create secret generic gawk-telemetry-key \
#     --from-literal=key=$(openssl rand -hex 32)
telemetryKey: ""
telemetryKeyRef: {}

# OPTIONAL, and NOT the same key as telemetryKey. This is the relay's stats key
# (the server chart's config.statsKey), and its only use is the dashboard's
# "find a stream by its code" box: an operator types the six-character code they
# already hold, the service computes the digest the relay would have published
# for it, and the page highlights that row.
#
# The mapping is one-way and stays server-side — no code is ever stored, logged
# or accepted from a client, and the key never reaches a browser. What it does
# cost: a service holding this key can enumerate join codes for the broadcasts
# it has stored (31^6 HMACs is minutes of work). That is why it is unset by
# default; turning it on is a deliberate act, like querySql.
#
# Leave both empty and the lookup returns 501 and the box does not render.
statsKey: ""
statsKeyRef: {}

persistence:
  enabled: true
  # 14 days of raw sessions is ~75 MB at ten viewers × 2 h/day (docs/33 §4.3);
  # rollups are permanent but tiny (a few thousand JSON lines). 2 Gi leaves
  # room for a far busier fleet and for a stress test.
  size: 2Gi
  storageClass: ""
  # An existing claim, if you manage PVCs outside this chart.
  existingClaim: ""

config:
  # How long RAW sessions are kept. Rollups are never pruned regardless — that
  # split is the whole point of the design (D4): raw is disposable, the
  # per-session summary is permanent.
  #
  # 30 days, raised from 14 by owner decision (R31 UD15). The trade-off it buys:
  # a release cycle fits inside the raw window, so "compare this session to one
  # from before the R30 change" stays answerable at FULL resolution instead of
  # degrading to rollup-only. ~160 MB at current volume — size the PVC below
  # accordingly if your fleet is busier than the homelab's.
  retentionDays: 30
  # How often each relay pod's /statusz is polled. Sessions shorter than this
  # have no relay-side view at all, and their rollups honestly say
  # relayCoverage "none" rather than pretending (D5).
  scrapeInterval: 5s
  # How long a session may go unheard-from before it is finalized. Longer than
  # the client's 10 s batch cadence plus its retries, so a client riding out a
  # blip is not finalized underneath itself and re-opened as a second session.
  sessionIdle: 2m
  # The relay's headless companion Service (the relay chart's
  # telemetry.headlessService). A plain ClusterIP would load-balance, so
  # scraping it hits one random pod.
  relayHeadlessService: gawk-server-metrics-headless
  relayMetricsPort: 2112
  # Base URL for the deep links a verdict carries, so a machine can hand a
  # human something to LOOK at. Empty = no links.
  dashboardBase: ""
  # The MCP endpoint on the read listener. On by default: it is the item's
  # primary read surface.
  mcp: true
  # The ad-hoc SQL surface — the console at #/sql and the MCP `query_sql` tool.
  #
  # ON by default (R31 UD18), reversing D11's posture. Two things this does NOT
  # mean, both worth knowing before you turn it off:
  #
  #   * It is not a public surface. Like everything else on the read listener it
  #     is never routed publicly (D14), and it is read-only — the engine refuses
  #     anything that is not a SELECT and friends.
  #   * It is not what decides whether a query can be ANSWERED. That is the
  #     build: the shipped image is compiled `-tags duckdb`, while a binary
  #     built from a fresh clone has no engine and says so (docs/36 §8 Q1).
  querySql: true
  # Ingest rate limiting, in two tiers. No client IP is ever consulted or
  # stored (D8): every browser reaches this through the frontend Ingress, so a
  # per-IP bucket would be fleet-wide anyway — just wearing a misleading name.
  #
  # ingestRate/ingestBurst bound the PROCESS, before a body is read. Size them
  # for the fleet: ~1000 viewers flushing every 10 s is ~100/s steady, and the
  # burst covers everyone flushing at once after a relay rollout.
  ingestRate: 300
  ingestBurst: 1200
  # ingestSessionRate/ingestSessionBurst bound ONE verified session, applied
  # after the token check — the fairness tier. A well-behaved client sends one
  # batch every 10 s, so this is generous by an order of magnitude and still
  # catches a client that has come loose.
  ingestSessionRate: 1
  ingestSessionBurst: 10
  logLevel: info
  logFormat: json

# The PUBLIC listener. Only the ingest path is routed here, from a same-origin
# path on the frontend's Ingress (set the app chart's telemetry.enabled) —
# never a LoadBalancer or an Ingress of its own.
ingest:
  port: 8080

# The NON-PUBLIC listener: dashboard, read API and MCP. It aggregates every
# broadcast on the fleet and should be no more reachable than /statusz is
# today (R9 D1's posture). ClusterIP only by default; reach it with
#   kubectl -n gawk port-forward svc/gawk-telemetry-read 8081:8081
read:
  port: 8081
  # Optional internal-only Ingress for operators who want the dashboard at a
  # URL. Turn basicAuth on if you do.
  ingress:
    enabled: false
    className: nginx-int
    host: ""
    annotations: {}
    tls:
      enabled: false
      secretName: ""
  basicAuth:
    enabled: false
    user: ""
    password: ""
    passwordRef: {}

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 512Mi
