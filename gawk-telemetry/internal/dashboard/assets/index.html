<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gawk telemetry</title>
<!--
  R28 TM8 (docs/33 §4.8.4). Plain HTML + one small vanilla JS file, embedded in
  the binary (Go embed), with NO build step and NO external asset fetch: the
  dashboard must work on a port-forward from a laptop with no network.

  Deliberately NOT part of R6's design system — different origin, different
  build, no shared tokens, and coupling an ops page to the product's component
  library buys nothing. It borrows R6's monochrome restraint for a functional
  reason: in an otherwise monochrome table, one amber row is unmissable.

  Colour carries TWO orthogonal channels and nothing else:
    * Severity  -> hue.       Amber/red accents, reserved for warn/bad.
                              ok and unknown spend no hue at all.
    * Lifecycle -> contrast.  Live rows at full contrast, ended rows recessed.
                              So an ended `bad` still shows its red — you can
                              see last night went badly — but it cannot
                              out-shout a live `warn` sitting above it.

  NEITHER channel is ever encoded by colour alone: every row carries a status
  glyph and a text label, so the page survives a colour-blind reader, a
  greyscale screenshot pasted into a chat, and the CSS failing to load.
-->
<style>
  :root {
    --bg: #0d0d0f;
    --panel: #16161a;
    --line: #26262c;
    --fg: #e8e8ea;
    --dim: #9a9aa2;
    --dimmer: #6a6a72;
    --warn: #e0a02c;
    --bad: #e0503c;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fbfbfc; --panel: #fff; --line: #e2e2e6;
      --fg: #1a1a1e; --dim: #5c5c66; --dimmer: #8e8e98;
      --warn: #9a6600; --bad: #b02a16;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 var(--mono);
  }
  header {
    display: flex; align-items: baseline; gap: 1rem;
    padding: 0.75rem 1rem; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: 0.04em; }
  #age { color: var(--dim); font-size: 12px; }
  #error { color: var(--bad); font-size: 12px; }
  main { padding: 1rem; max-width: 1400px; }
  h2 {
    font-size: 12px; font-weight: 600; margin: 1.5rem 0 0.5rem;
    color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase;
  }
  h2:first-child { margin-top: 0; }
  .group-note { color: var(--dimmer); font-size: 11px; margin: -0.35rem 0 0.6rem; }

  .bcast {
    border: 1px solid var(--line); border-radius: 4px;
    background: var(--panel); margin-bottom: 0.6rem; overflow: hidden;
  }
  .bcast summary {
    display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
    padding: 0.6rem 0.8rem; cursor: pointer; list-style: none;
  }
  .bcast summary::-webkit-details-marker { display: none; }
  .key { font-weight: 600; }
  .spacer { flex: 1; }
  .facts { color: var(--dim); font-size: 12px; display: flex; gap: 0.9rem; flex-wrap: wrap; }

  /* Severity -> hue. Only warn/bad spend any. */
  .sev { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 12px; }
  .sev-ok { color: var(--dim); }
  .sev-unknown { color: var(--dim); }
  .sev-warn { color: var(--warn); font-weight: 600; }
  .sev-bad { color: var(--bad); font-weight: 600; }
  .bcast.has-warn { border-left: 3px solid var(--warn); }
  .bcast.has-bad { border-left: 3px solid var(--bad); }

  /* Lifecycle -> contrast. Recession, not hue suppression. */
  .lifecycle { font-size: 11px; letter-spacing: 0.06em; color: var(--dim); }
  .ended { opacity: 0.55; }
  .ended .bcast { background: transparent; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 0.35rem 0.8rem; border-top: 1px solid var(--line); }
  th { color: var(--dimmer); font-weight: 500; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .role { color: var(--dim); }
  .role-broadcaster { color: var(--fg); font-weight: 600; }
  .stale { color: var(--dim); font-style: italic; }
  .verdict { color: var(--dim); }
  .empty { color: var(--dim); padding: 1rem 0; }
  .findings { margin: 0.2rem 0 0; padding: 0 0 0 1rem; color: var(--dim); font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>gawk telemetry</h1>
  <span id="age">connecting…</span>
  <span class="spacer"></span>
  <span id="error"></span>
</header>
<main>
  <div id="root"></div>
</main>
<script src="app.js"></script>
</body>
</html>
