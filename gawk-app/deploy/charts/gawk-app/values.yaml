image:
  repository: ghcr.io/tuhis/gawk-app
  # Empty = use the chart's appVersion, which release-please keeps in
  # lockstep with the published image tag.
  tag: ""
  pullPolicy: IfNotPresent

# GHCR is private — same pull secret as the gawk-server chart (one per
# namespace suffices): imagePullSecrets: [{name: ghcr-pull}]
imagePullSecrets: []

# Stateless static-file serving; safe to scale.
replicaCount: 2

service:
  type: ClusterIP
  port: 80 # targetPort is the nginx-unprivileged listen port, 8080

ingress:
  className: nginx-int
  host: gawk.example.com # CHANGEME: the frontend's public name; the server
  # chart's config.allowedOrigins must contain https://<this host>.
  tls:
    enabled: true
    secretName: gawk-app-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

# Frontend runtime config. Rendered into /config.js by a ConfigMap and read by
# the SPA at load — deploy-time flags with no image rebuild and no server
# endpoint. See gawk-app/src/config.ts.
config:
  # Prompt broadcasters for the relay's publish secret on "Start a stream".
  # Set true when the relay runs with -publish-secret (server chart's
  # config.publishSecret); the value itself is never shipped to the client.
  requirePublishSecret: false

  # The maximum number of frames the viewer's WebCodecs VideoDecoder will queue
  # before it starts dropping frames until the next keyframe.
  maxDecoderQueueSize: 5

  # R21 Deep buffer: how much video a viewer on that mode holds, in ms, and
  # what it asks the relay to keep filled. Pairs with the gawk-server chart's
  # config.dvrWindow, which clamps it — set the window at least this high or
  # the relay will serve less than the viewer expects. The buffer must
  # strictly EXCEED the stall it covers: covering S needs B/(B-S)x burst
  # bandwidth, so 3000 backs a ~2 s dropout at 3x. Clamped client-side to
  # [1000, 30000]; below 1000 the relay downgrades to plain resilient
  # delivery, since every replayed record would arrive past due.
  dvrBufferMs: 3000
