image:
  repository: ghcr.io/tuhis/gawk-app
  # Empty = use the chart's appVersion, which release-please keeps in
  # lockstep with the published image tag.
  tag: ""
  pullPolicy: IfNotPresent

# GHCR is private — same pull secret as the gawk-server chart (one per
# namespace suffices): imagePullSecrets: [{name: ghcr-pull}]
imagePullSecrets: []

# Stateless static-file serving; safe to scale.
replicaCount: 2

service:
  type: ClusterIP
  port: 80 # targetPort is the nginx-unprivileged listen port, 8080

ingress:
  className: nginx-int
  host: gawk.example.com # CHANGEME: the frontend's public name; the server
  # chart's config.allowedOrigins must contain https://<this host>.
  tls:
    enabled: true
    secretName: gawk-app-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production

# R28 (docs/33 D1): route the telemetry ingest path to the gawk-telemetry
# service from THIS host, so the browser collector talks same-origin. OFF by
# default — with it off this chart renders exactly as it did before R28, and
# clients never collect anything anyway (the relay gates that, wire 0x0D).
#
# Enable it together with the gawk-telemetry chart and the relay's
# telemetry.enabled, all three sharing one telemetry key.
telemetry:
  enabled: false
  # Must match the client default in gawk-app/src/config.ts, and the service's
  # own ingest route. Change it only if you also set config.telemetryUrl.
  path: /api/telemetry/
  serviceName: gawk-telemetry
  servicePort: 80

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

# Frontend runtime config. Rendered into /config.js by a ConfigMap and read by
# the SPA at load — deploy-time flags with no image rebuild and no server
# endpoint. See gawk-app/src/config.ts.
config:
  # CHANGEME for any self-hosted install: the relay's public URL, matching the
  # gawk-server chart's certificate.dnsNames[0] and service.port, e.g.
  #   relayUrl: "https://relay.example.com:4433"
  # Without it the app falls back to https://localhost:4433 on every origin
  # but the reference deployment's, and each viewer would have to paste the
  # URL into settings before a join link worked. See docs/self-hosting.md.
  relayUrl: ""

  # Prompt broadcasters for the relay's publish secret on "Start a stream".
  # Set true when the relay runs with -publish-secret (server chart's
  # config.publishSecret); the value itself is never shipped to the client.
  requirePublishSecret: false

  # The maximum number of frames the viewer's WebCodecs VideoDecoder will queue
  # before it starts dropping frames until the next keyframe.
  maxDecoderQueueSize: 5

  # R21 Deep buffer: how much video a viewer on that mode holds, in ms, and
  # what it asks the relay to keep filled. Pairs with the gawk-server chart's
  # config.dvrWindow, which clamps it — set the window at least this high or
  # the relay will serve less than the viewer expects. The buffer must
  # strictly EXCEED the stall it covers: covering S needs B/(B-S)x burst
  # bandwidth, so 3000 backs a ~2 s dropout at 3x. Clamped client-side to
  # [1000, 30000]; below 1000 the relay downgrades to plain resilient
  # delivery, since every replayed record would arrive past due.
  dvrBufferMs: 3000

  # ── R23 (docs/29): terms & conditions ──────────────────────────────────
  # The app ships a default Terms of Use text. These values let you present it
  # as YOUR deployment's terms without rebuilding the image.
  #
  # NOTE: the default text is a protective template, NOT legal advice. Before
  # exposing a deployment beyond people you know, have a Finnish lawyer review
  # the terms — especially the liability, consumer-law, and personal-data
  # clauses, which interact with mandatory EU/Finnish provisions no contract
  # can waive.
  #
  # Bump this whenever you make a meaningful edit to the terms — it re-prompts
  # every broadcaster to acknowledge them. Empty ⇒ the version baked into the
  # release. A date-stamp is the recommended form.
  termsVersion: ""
  # Substituted into the default text as the operating party + the contact
  # point. Leaving them empty shows neutral placeholders.
  operatorName: ""     # e.g. "Juho's homelab"
  operatorContact: ""  # e.g. "gawk@example.com"
  # Full-text override. To replace the whole terms document with your own:
  #   1. put your (lawful, inert) HTML in config.termsHtml below, and
  #   2. set config.termsUrl to "/terms.html".
  # The app fetches it on the terms page, sanitizes it (allowlist — scripts,
  # styles, iframes, event handlers stripped), and renders it in place of the
  # default. Leave termsUrl empty to keep the bundled default.
  termsUrl: ""
  termsHtml: ""

  # R28: where the browser posts telemetry batches. Empty ⇒ the app's built-in
  # same-origin default (/api/telemetry/v1/ingest), which is what the
  # telemetry.path route above serves. Set this only when the telemetry
  # service lives on a DIFFERENT origin — and then that origin has to answer
  # CORS preflights, which the unload beacon cannot perform.
  telemetryUrl: ""

  # R37 (docs/40 D6): whether this UI may talk to relays other than its own —
  # the server picker and the ?relay= link parameter. Default TRUE so shared
  # cross-relay links work out of the box; set false to lock the UI to its
  # deployment relay (picker hidden, ?relay= ignored with a quiet note).
  allowCustomRelays: true

  # R37 (docs/40 D9): optional URL of a server-directory JSON (schema v1) the
  # picker offers. Fetched when the picker opens, never at boot. Host it
  # same-origin (the terms.html ConfigMap pattern) or with CORS for this
  # frontend's origin. Empty ⇒ no directory section.
  serverDirectoryUrl: ""
