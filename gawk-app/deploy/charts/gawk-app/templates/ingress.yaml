apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gawk-app.fullname" . }}
  labels:
    {{- include "gawk-app.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.telemetry.enabled }}
          # R28 (docs/33 D1): telemetry ingest, routed to gawk-telemetry from a
          # SAME-ORIGIN path on this frontend's own host. That is the whole
          # point — a cross-origin `sendBeacon` with Content-Type:
          # application/json needs a preflight it cannot perform during unload,
          # and the usual workaround is to lie about the content type.
          # Same-origin needs neither, and costs no LoadBalancer, no DNS record
          # and no certificate.
          #
          # ONLY the ingest path is public. The read API and the dashboard live
          # on the service's other listener and are never routed here — the
          # read side aggregates every broadcast on the fleet and should be no
          # more reachable than /statusz is today (R9 D1's posture).
          - path: {{ .Values.telemetry.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.telemetry.serviceName }}
                port:
                  number: {{ .Values.telemetry.servicePort }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "gawk-app.fullname" . }}
                port:
                  name: http
