server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    # application/wasm: RNNoise for room voice (R80, docs/81 D4), 1.47 MB →
    # 1.21 MB. nginx's mime.types already serves .wasm as application/wasm,
    # which WebAssembly.compileStreaming requires.
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # Vite bundles are content-hashed — cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The app uses hash routing (#/view), so the SPA fallback is not strictly
    # needed — kept as future-proofing, it is harmless.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
