<title>gawk device probe — R22 iOS audio</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 16px 16px 64px;
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

  }
  h1 { font-size: 17px; margin: 0 0 4px; letter-spacing: .2px; }

    padding: 15px 16px; border-radius: 12px; border: 1px solid #35353c;

  button.primary { background: #e8e8ea; color: #0d0d0f; border-color: #e8e8ea; }
  button:disabled { opacity: .4; }

<h1>gawk device probe</h1>
<p class="sub">R22 / docs&#47;27 — why native fullscreen has no audio. Runs the production muxer, AAC transcoder and MSE presenter.</p>

<button id="run" class="primary">1 · Run probe</button>

<div id="status">Idle. Tap “Run probe”.</div>
<div id="summary"></div>

<video id="stage" class="stage" playsinline></video>
<p class="hint">2 · The video above should show a moving test pattern and play a 440&nbsp;Hz tone. Turn the ringer switch ON and the volume UP.</p>
<button id="fs" disabled>3 · Enter native fullscreen (listen for the tone)</button>
<div id="heard" style="display:none">
  <button id="yes">I HEARD the tone in fullscreen</button>
  <button id="no">Fullscreen was SILENT</button>
</div>

<button id="copy">4 · Copy results JSON</button>
<textarea id="out" readonly spellcheck="false"></textarea>
