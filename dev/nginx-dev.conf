# A COPY of gawk-app/deploy/nginx.conf, plus one location block (R38,
# docs/41 §4.1.2). Keep it in step with the original when that changes.
#
# It is a copy because the app image runs unprivileged and cannot write into
# /usr/share/nginx/html, so the generated /config.js cannot be copied over the
# shipped one at startup — it is aliased in from a read-only bind mount
# instead. A second server block in an additional conf.d file is not an
# alternative: two blocks on the same listen/server_name make which one wins
# an nginx implementation detail.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite bundles are content-hashed — cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # R38: the generated runtime config, bind-mounted read-only.
    location = /config.js {
        alias /gawk-gen/config.js;
        add_header Cache-Control "no-cache";
    }

    # R38: the `telemetry` profile's ingest, same-origin — the frontend's
    # default telemetryUrl is a relative path on this very origin, which is
    # what makes the sendBeacon unload flush work without a CORS preflight it
    # could not perform during unload.
    #
    # proxy_pass through a VARIABLE with an explicit resolver, deliberately: a
    # literal upstream name is resolved once at startup, so with the telemetry
    # profile off the app container would refuse to start at all. 127.0.0.11
    # is Docker's embedded DNS.
    location /api/telemetry/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gawk_telemetry telemetry;
        proxy_pass http://$gawk_telemetry:8080;
        proxy_set_header Host $host;
    }

    # The app uses hash routing (#/view), so the SPA fallback is not strictly
    # needed — kept as future-proofing, it is harmless.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
