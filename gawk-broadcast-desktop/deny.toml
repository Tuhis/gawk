# cargo-deny: the license gate for the Rust component (the `licenses` job in
# .github/workflows/ci.yml runs it).
#
# The Go and npm halves of the same gate live in
# tools/licenses/gen-notices.py (--check); keep the allowlists in step. Rust
# gets the ecosystem's own tool rather than that script because Cargo
# manifests declare SPDX *expressions* — `MIT OR Apache-2.0`,
# `(MIT OR Apache-2.0) AND Unicode-3.0` — and evaluating those correctly is
# exactly what cargo-deny does.
#
# What this gate is for: catching the arrival of a dependency whose terms
# gawk cannot redistribute under Apache-2.0 — a GPL/AGPL crate pulled in
# transitively by a bump. It is not a substitute for THIRD-PARTY-NOTICES.md,
# which is regenerated by the same script and carries the attributions.

[graph]
# The shipped artifact is a Windows EXE, so that is the graph that matters.
# Without this, cargo-deny would also judge the Linux/macOS halves of every
# cfg-gated dependency — crates that are never compiled, let alone shipped.
targets = ["x86_64-pc-windows-msvc"]
# Dev-dependencies are test-only and never redistributed.
exclude-dev = true

[licenses]
# Permissive, notice-only terms. Mirrors ALLOWED_LICENSES in
# tools/licenses/gen-notices.py, plus the identifiers that only occur in the
# Rust graph:
#
#   Unicode-3.0          the ICU4X crates (permissive; notice retention)
#   CDLA-Permissive-2.0  webpki-roots — a data license over the Mozilla CA set
#   BSL-1.0              Boost Software License
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Slint is the one dependency whose terms are a deliberate choice rather than
# a permissive default. Its crates are tri-licensed:
#
#   GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0
#
# gawk takes the middle option — the royalty-free desktop license — which is
# why the repository can stay Apache-2.0 (docs/38 D12). Its one condition is
# attribution, met by the "Made with Slint" badge on the READMEs and the
# release page; §2(b) of that license is the clause that permits it there
# rather than in an in-app About dialog.
#
# Listing it as a scoped exception rather than adding LicenseRef-* to `allow`
# is the point: it applies to these crates only, so a *different* crate
# arriving under a LicenseRef nobody has read still fails the gate.
# `slint-build` and `i-slint-compiler` are build-dependencies: they turn the
# .slint markup into Rust at compile time. They are not linked into the EXE
# (which is why THIRD-PARTY-NOTICES.md, built from `cargo tree -e normal`,
# does not list them) — but cargo-deny judges the build graph too, and it is
# right to: the code they emit does ship.
exceptions = [
    { name = "slint", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "slint-build", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "slint-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-compiler", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-common", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-core", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-core-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-backend-selector", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-backend-winit", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-renderer-femtovg", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-renderer-software", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
]

# The vendored wtransport crates carry their license in LICENSE-MIT /
# LICENSE-APACHE next to the source (added when the repo went open source);
# their Cargo.toml declares `MIT OR Apache-2.0`, which the allowlist covers.

[bans]
# Not what this gate is for — duplicate-version and ban policy is a separate
# argument, and turning it on here would make a license check fail for
# reasons that have nothing to do with licenses.
multiple-versions = "allow"

[advisories]
# Likewise: vulnerability scanning belongs in its own job with its own
# cadence (an advisory can appear with no change on our side, which must not
# turn every unrelated PR red).
yanked = "allow"
