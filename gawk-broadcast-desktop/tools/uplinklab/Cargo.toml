# The sender half of the uplink lab (docs/75): synthetic frames over the
# engine's exact transport stack — the vendored wtransport, the quinn the
# workspace pins (tools/uplinklab/build.sh builds it from a copy of the
# workspace's Cargo.lock; it keeps none of its own) and gawk-wire's chunking
# and parity. Its own workspace, so it never enters the shipped build.
[package]
name = "gawk-uplinklab"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
gawk-wire = { path = "../../crates/wire" }
wtransport = { version = "0.7.1", features = ["dangerous-configuration", "quinn"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[patch.crates-io]
wtransport = { path = "../../vendor/wtransport" }
wtransport-proto = { path = "../../vendor/wtransport-proto" }
