# The native desktop broadcasters: Windows (R34, docs/38) and macOS (R52,
# docs/54). One Cargo workspace, deliberately a separate top-level component
# with its own toolchain, CI and release unit (docs/38 D1, docs/54 D1) — not a
# sibling of the Go gawk-broadcast module. Two binaries, one per shell crate;
# everything below the shells is shared.
[workspace]
resolver = "2"
# vendor/ holds the patched wtransport (see vendor/wtransport/GAWK-PATCH.md);
# it is a [patch.crates-io] path dependency, not a workspace member.
exclude = ["vendor"]
members = [
    "crates/wire",
    "crates/engine",
    "crates/capture",
    "crates/encode",
    "crates/audio",
    "crates/ui",
    "crates/app-windows",
    "crates/app-macos",
]

[workspace.package]
version = "1.5.1" # x-release-please-version
edition = "2024"
publish = false
# Matches the repository LICENSE. Declared here (and inherited by every crate)
# because cargo-deny reads the manifest, not the LICENSE file: without it the
# `licenses` CI gate reports our own crates as unlicensed and fails.
license = "Apache-2.0"

# Single-EXE goal (docs/38 D17): trim what we can for free already.
[profile.release]
lto = "thin"
strip = true

# docs/38 D2 gate 2a: stock wtransport discards the HTTP status of a rejected
# CONNECT; the vendored copy carries a one-variant patch exposing it.
[patch.crates-io]
wtransport = { path = "vendor/wtransport" }
wtransport-proto = { path = "vendor/wtransport-proto" }
