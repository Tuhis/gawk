[package]
name = "gawk-broadcast-app-windows"
description = "The Windows Slint shell — gawk-broadcast.exe (WB6, docs/38 D12)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "gawk-broadcast"
path = "src/main.rs"

[dependencies]
gawk-audio = { path = "../audio" }
gawk-capture = { path = "../capture" }
gawk-encode = { path = "../encode" }
gawk-engine = { path = "../engine" }
gawk-ui = { path = "../ui" }
gawk-wire = { path = "../wire" }
arboard = "3"
log = { version = "0.4", features = ["std"] }
serde_json = "1"
# Licence note: see ../ui/Cargo.toml. The shell uses slint's runtime API
# (timers, models, the event loop); the window itself is gawk-ui's.
slint = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_UI_Shell",
] }
