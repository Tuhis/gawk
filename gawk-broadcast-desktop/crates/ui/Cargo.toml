[package]
name = "gawk-ui"
description = "The window both GUI shells show, compiled once, and the build's version (docs/54 D1, D11)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
gawk-engine = { path = "../engine" }
# Tri-licensed; gawk takes the Royalty-free Desktop License v2.0 (docs/38 D12,
# re-confirmed at the Apache-2.0 relicense). Its §2(b) attribution is the
# "Made with Slint" badge in the root and component READMEs. ../../deny.toml
# is the scoped cargo-deny exception that keeps the choice enforced.
slint = "1"

[build-dependencies]
slint-build = "1"

[dev-dependencies]
serde_json = "1"
