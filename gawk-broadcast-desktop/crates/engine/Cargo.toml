[package]
name = "gawk-engine"
description = "Session lifecycle, send policy, resume supervisor (WB2, docs/38 D5)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# R65 (docs/67 D4): `update` and `install` replace this binary from a signed
# release. Every desktop shell keeps the default; the iOS app turns it off,
# because App Store apps must not update themselves. `ureq` is not gated:
# `telemetry` posts through it too.
[features]
default = ["self-update"]
self-update = ["dep:minisign-verify"]

[dependencies]
gawk-wire = { path = "../wire" }
minisign-verify = { version = "0.3.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
ureq = "3"
url = "2"
wtransport = { version = "0.7.1", features = ["dangerous-configuration", "quinn"] }

# R47 (docs/48 D6): the Linux install unpacks the one binary from the
# verified release tarball. Linux only, so neither reaches the EXE or the
# macOS bundle (or their notices).
[target.'cfg(target_os = "linux")'.dependencies]
flate2 = "1"
tar = { version = "0.4", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "test-util"] }
