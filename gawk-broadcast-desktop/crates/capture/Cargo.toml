[package]
name = "gawk-capture"
description = "Screen capture: Windows.Graphics.Capture, ScreenCaptureKit and the xdg-desktop-portal (docs/38 D6, docs/54 D4, docs/58 D3)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
gawk-engine = { path = "../engine" }
# Narrates capture/session setup into the shell's debug.log (docs/38 F-8).
log = "0.4"

# Windows-only: the crate compiles empty elsewhere so the workspace builds
# and the portable halves (picker filter, fps gate) test on any host.
[target.'cfg(windows)'.dependencies]
# The Async::join() blocking wait for WinRT IAsyncOperation (the F-11
# borderless grant); the windows crate does not re-export the trait.
windows-future = "0.3"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Metadata",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    # GraphicsCaptureAccess::RequestAccessAsync returns an
    # AppCapabilityAccessStatus (the F-11 borderless grant).
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS (R52, docs/54 D3/D4): ScreenCaptureKit through the generated objc2
# bindings. `unsafe` is confined to `sck` and `sck_picker`; everything above
# them is safe Rust, like `wgc` over the windows crate.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"

# Linux (R56, docs/58 D3/D4): the ScreenCast portal through ashpd, and the
# CLOCK_MONOTONIC read behind the one-clock mapper (`pwclock`). ashpd runs on
# zbus's own async-io executor, NOT its tokio feature: features unify, and
# zbus built with `tokio` makes every zbus user in the process require a
# tokio runtime — including the accessibility and settings code in Slint's
# stack that calls it on the GUI thread (a launch panic, found on the first
# smoke run). The futures still poll fine from the portal's tokio runtime.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
libc = "0.2"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread"] }
