[package]
name = "gawk-encode"
description = "Hardware H.264 encode: Media Foundation, VideoToolbox and the GStreamer cascade (docs/38 D9, docs/54 D7, docs/58 D5)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# Portable: the cascade and the MFT session both narrate into the shell's
# debug.log (docs/38 F-8) through the facade.
[dependencies]
log = "0.4"

# macOS (R52, docs/54 D3/D7): VideoToolbox's low-latency H.264 session
# through the generated objc2 bindings; `unsafe` is confined to `vt`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-video-toolbox = "0.3"

# tests/vt_to_relay.rs: VideoToolbox output through the engine to the real
# relay (macOS, ignored by default).
[target.'cfg(target_os = "macos")'.dev-dependencies]
gawk-engine = { path = "../engine" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

# Windows-only: the crate's portable half (bitstream inspection, cascade
# policy) tests on any host; the MFT session is cfg-gated.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

# Linux (R56, docs/58 D4/D5): R14's cascade, in-process through gstreamer-rs.
# Feature-capped at v1_24: the build floor is Ubuntu 24.04's GStreamer 1.24
# (OD14), and a binding feature above it would link symbols the floor lacks.
[target.'cfg(target_os = "linux")'.dependencies]
gawk-engine = { path = "../engine" }
gstreamer = { version = "0.25", features = ["v1_24"] }
gstreamer-app = { version = "0.25", features = ["v1_24"] }
gstreamer-video = { version = "0.25", features = ["v1_24"] }

# tests/gst_plumbing.rs and tests/gst_to_relay.rs: the live pipeline with a
# test-only software encoder, through the engine to the real relay.
[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
