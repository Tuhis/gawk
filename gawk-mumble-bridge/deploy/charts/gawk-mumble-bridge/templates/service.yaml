# Public: the browsers' voice sessions (QUIC/UDP). Only ticket-gated voice
# rides it (D1).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gawk-mumble-bridge.fullname" . }}
  labels:
    {{- include "gawk-mumble-bridge.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- if and .Values.service.externalTrafficPolicy (ne .Values.service.type "ClusterIP") }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "gawk-mumble-bridge.selectorLabels" . | nindent 4 }}
  ports:
    - name: voice
      port: {{ .Values.service.port }}
      targetPort: voice
      protocol: UDP
      {{- with .Values.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
---
# Internal: the relay's observer links and the ops port. ClusterIP by
# construction; never route it publicly (D1, D24).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gawk-mumble-bridge.fullname" . }}-internal
  labels:
    {{- include "gawk-mumble-bridge.labels" . | nindent 4 }}
    app.kubernetes.io/component: internal
spec:
  type: ClusterIP
  selector:
    {{- include "gawk-mumble-bridge.selectorLabels" . | nindent 4 }}
  ports:
    - name: internal
      port: {{ .Values.internalService.port }}
      targetPort: internal
      protocol: UDP
    - name: ops
      port: {{ .Values.internalService.opsPort }}
      targetPort: ops
      protocol: TCP
