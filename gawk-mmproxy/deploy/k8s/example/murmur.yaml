# A stock murmur, as an operator might already run it: the base the CI kind
# job patches (docs/92 PX3 criterion 3) and a worked example. Not a
# supported way to deploy murmur (docs/80 OD9: gawk ships no murmur).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: murmur
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: murmur
  template:
    metadata:
      labels:
        app.kubernetes.io/name: murmur
    spec:
      containers:
        - name: murmur
          image: mumblevoip/mumble-server:v1.6.1001
          env:
            - {name: MUMBLE_CONFIG_WELCOMETEXT, value: ""}
          ports:
            - {name: mumble-tcp, containerPort: 64738, protocol: TCP}
            - {name: mumble-udp, containerPort: 64738, protocol: UDP}
          readinessProbe:
            tcpSocket: {port: 64738}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: murmur
spec:
  selector:
    app.kubernetes.io/name: murmur
  ports:
    - {name: mumble-tcp, port: 64738, protocol: TCP}
    - {name: mumble-udp, port: 64738, protocol: UDP}
