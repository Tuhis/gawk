[package]
name = "gawk-broadcast-app"
description = "The Slint GUI shell — the only binary (WB6, docs/38 D12)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "gawk-broadcast"
path = "src/main.rs"

[dependencies]
gawk-audio = { path = "../audio" }
gawk-capture = { path = "../capture" }
gawk-encode = { path = "../encode" }
gawk-engine = { path = "../engine" }
gawk-wire = { path = "../wire" }
arboard = "3"
log = { version = "0.4", features = ["std"] }
serde_json = "1"
# Tri-licensed; gawk takes the Royalty-free Desktop License v2.0 (docs/38 D12,
# re-confirmed at the Apache-2.0 relicense). Its §2(b) attribution is the
# "Made with Slint" badge in the root and component READMEs — NOT the INSTALL
# doc, which is what this comment used to claim and which satisfies neither
# option the license offers. ../../deny.toml is the scoped cargo-deny
# exception that keeps the choice enforced.
slint = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_UI_Shell",
] }

[build-dependencies]
slint-build = "1"
