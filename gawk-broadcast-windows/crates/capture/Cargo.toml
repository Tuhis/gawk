[package]
name = "gawk-capture"
description = "Windows.Graphics.Capture frame source + picker enumeration (WB3, docs/38 D6)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gawk-engine = { path = "../engine" }

# Windows-only: the crate compiles empty elsewhere so the workspace builds
# and the portable halves (picker filter, fps gate) test on any host.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Metadata",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }
