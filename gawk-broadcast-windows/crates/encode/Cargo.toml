[package]
name = "gawk-encode"
description = "Media Foundation hardware H.264 encoder cascade (WB4, docs/38 D9)"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Windows-only: the crate's portable half (bitstream inspection, cascade
# policy) tests on any host; the MFT session is cfg-gated.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
